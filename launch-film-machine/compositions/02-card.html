  <script>
    (() => {
      const SM = window.FireworkMachine;
      // shader colours come from the palette on the root, as "r g b" in 0..1
      const rgb = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim().split(/\s+/).map(Number);
      const machine = SM.mount(document.getElementById("c-stage-inner"), {
        video: document.getElementById("c-screen-wrap"),
        colors: { beam: rgb("--beam-ink"), body: rgb("--lamp-body"), core: rgb("--lamp-core") },
      });
      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const span = (x, a, b) => clamp01((x - a) / (b - a));
      const ease = (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
      const easeOut = (x) => 1 - Math.pow(1 - clamp01(x), 3);

      // shot 2 text
      const CMD = "/firework ";
      const LINE = "make a 30-second launch film for an AI platform, paced like the card vortex reference";
      const cmdEl = document.getElementById("c-cmd");
      const typedEl = document.getElementById("c-typed");

      // the machine's state as a pure function of scene time
      // shot 3 (4.0-8.0) build · shot 4 (8.0-10.0) lamp · shot 5 (10.0-16.0) drawer, pick, timeline · shot 6 (16.0-25.0) projector
      const STEP = 0.36;
      function stateAt(t) {
        const steps = span(t, 13.0, 13.0 + STEP * 7 / 0.55) * 7;
        let head = -0.55;
        if (t >= 12.75 && t < 13.0) head = -0.55 + 0.55 * ease(span(t, 12.75, 13.0));
        else if (t >= 13.0) head = Math.min(7, Math.floor(steps) + easeOut(span(steps % 1, 0, 0.55)));
        const lamp = ease(span(t, 8.2, 9.4));
        return {
          build: span(t, 4.5, 7.7),
          drawer: span(t, 10.1, 10.8),
          pick: span(t, 10.8, 12.75),
          head,
          feed: span(t, 16.0, 16.9),
          lamp,
          beam: ease(span(t, 16.7, 17.3)),
          screen: ease(span(t, 17.1, 17.6)),
          reel: Math.max(0, t - 16.7),
          needle: t > 12.9 ? easeOut(span(t, 12.9, 16.0)) * 0.82 : 0,
          frames: t >= 16.7 ? Math.min(720, (t - 16.7) * 92) : null,
        };
      }
      const setText = (id, v) => { const el = document.getElementById(id); const text = String(v); if (el.textContent !== text) el.textContent = text; };
      const fader = (id, v) => {
        setText(id + "-pct", Math.round(v * 100) + "%");
        document.getElementById(id + "-fill").style.transform = `scaleX(${v.toFixed(4)})`;
        document.getElementById(id + "-knob").style.transform = `translateX(${(v * 360).toFixed(1)}px)`;
      };
      const timecode = (f) => {
        const pad = (n) => String(n).padStart(2, "0");
        return `00:00:${pad(Math.floor(f / 24))}:${pad(f % 24)}`;
      };
      // segmented build bar: one segment per assembly, as wide as its share of the parts
      const first = machine.buildInfo(1);
      setText("c-parts-of", `of ${first.totalParts} parts`);
      setText("c-lines-of", `of ${first.totalLines.toLocaleString("en-US")} lines`);
      const bar = document.getElementById("c-parts-bar");
      bar.innerHTML = first.segments.map((seg) => `<span style="flex:${seg.total}"><i></i></span>`).join("");
      const segFills = [...bar.querySelectorAll("i")];
      const shotFills = [...document.getElementById("c-shots-bar").querySelectorAll("i")];
      // the easing curve: x is time through one step, y is distance; a dot rides it
      const CW = 360, CH = 96, CT = 8;
      const yOf = (x) => CT + CH - (1 - Math.pow(1 - x, 3)) * CH;
      const pts = Array.from({ length: 41 }, (_, i) => `${((i / 40) * CW).toFixed(1)} ${yOf(i / 40).toFixed(1)}`);
      document.getElementById("c-curve").innerHTML =
        `<line x1="0" y1="${CT + CH}" x2="${CW}" y2="${CT + CH}" style="stroke:var(--line)" stroke-width="1"/>` +
        `<line x1="0" y1="${CT}" x2="${CW}" y2="${CT}" style="stroke:var(--track)" stroke-width="1"/>` +
        `<path d="M${pts.join("L")}" fill="none" style="stroke:var(--ink)" stroke-width="2"/>` +
        `<line id="c-curve-x" x1="0" y1="${CT}" x2="0" y2="${CT + CH}" style="stroke:var(--faint)" stroke-width="1"/>` +
        `<circle id="c-curve-dot" r="6" cx="0" cy="${CT + CH}" style="fill:var(--accent-ink);stroke:var(--card)" stroke-width="2"/>`;
      const curveAt = (x) => {
        const dot = document.getElementById("c-curve-dot");
        const ln = document.getElementById("c-curve-x");
        dot.setAttribute("cx", (x * CW).toFixed(1));
        dot.setAttribute("cy", yOf(x).toFixed(1));
        ln.setAttribute("x1", (x * CW).toFixed(1));
        ln.setAttribute("x2", (x * CW).toFixed(1));
      };
      // pointer: the lamp fader's knob (measured once, in card px) and the open drawer's pull (from the figure's camera)
      const cardBox = document.getElementById("c-card").getBoundingClientRect();
      const knob0 = (() => { const r = document.getElementById("c-lamp-knob").getBoundingClientRect(); return [r.left + r.width / 2 - cardBox.left, r.top + r.height / 2 - cardBox.top]; })();
      const KS = 1080 / SM.DATA.W;
      const inCard = (p) => { const v = SM.at(p); return [30 + v[0] * KS, 92 + v[1] * KS]; };
      const DR = SM.DATA.drawer;
      const pull = (out) => inCard([DR.x + DR.w / 2, DR.fy + 2.2 + out, DR.z + 6.2]);
      const cursor = document.getElementById("c-cursor");
      const lerp = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
      function pointer(t, s) {
        let at = null, o = 0, press = 0;
        if (t >= 8.0 && t < 9.95) {
          // shot 4: comes in, takes the knob, drags it to full as the lamp warms, lets go and leaves
          const grab = knob0;
          const held = [knob0[0] + 360 * s.lamp, knob0[1]];
          if (t < 8.2) at = lerp([knob0[0] + 60, knob0[1] + 70], grab, easeOut(span(t, 8.0, 8.18)));
          else at = held;
          if (t > 9.5) at = lerp(held, [held[0] + 50, held[1] + 60], ease(span(t, 9.5, 9.95)));
          o = span(t, 8.0, 8.12) * (1 - span(t, 9.7, 9.95));
          press = t >= 8.15 && t < 9.45 ? 1 : 0;
        } else if (t >= 9.95 && t < 11.3) {
          // shot 5: comes in over the drawer, clicks its pull; the drawer slides out under it
          const out = SM.DATA.drawerOut * ease(s.drawer ?? 0);
          const start = [pull(0)[0] + 90, pull(0)[1] + 80];
          at = t < 10.05 ? lerp(start, pull(0), easeOut(span(t, 9.95, 10.05))) : pull(out);
          if (t > 10.85) at = lerp(pull(out), [pull(out)[0] + 60, pull(out)[1] + 70], ease(span(t, 10.85, 11.3)));
          o = span(t, 9.95, 10.1) * (1 - span(t, 11.05, 11.3));
          press = t >= 10.05 && t < 10.2 ? 1 : 0;
        }
        if (!at) { cursor.style.opacity = "0"; return; }
        cursor.style.opacity = o.toFixed(3);
        cursor.style.transform = `translate(${(at[0] - 4).toFixed(1)}px, ${(at[1] - 3).toFixed(1)}px) scale(${press ? 0.88 : 1})`;
      }
      function render(t) {
        // typing: 0.6-3.2 s
        const n = Math.round((CMD.length + LINE.length) * span(t, 0.6, 3.2));
        cmdEl.textContent = CMD.slice(0, n);
        typedEl.textContent = LINE.slice(0, Math.max(0, n - CMD.length));
        const s = stateAt(t);
        machine.pose(s, t);
        pointer(t, s);
        // readouts: every number is counted from what the figure is doing
        const info = machine.buildInfo(s.build ?? 0);
        setText("c-parts", info.parts);
        setText("c-parts-at", info.current);
        setText("c-lines", info.lines.toLocaleString("en-US"));
        info.segments.forEach((seg, i) => (segFills[i].style.transform = `scaleX(${(seg.done / seg.total).toFixed(4)})`));
        const kelvin = Math.round((3200 * s.lamp) / 10) * 10;
        setText("c-lamp", kelvin.toLocaleString("en-US"));
        setText("c-lamp-at", s.lamp >= 0.999 ? "steady" : "warming up");
        document.getElementById("c-lamp-bar").style.transform = `scaleX(${s.lamp.toFixed(4)})`;
        fader("c-lamp", s.lamp);
        const shots = t < 12.95 ? 0 : Math.max(0, Math.min(8, Math.floor(s.head + 1.0001)));
        setText("c-shots", shots);
        setText("c-shots-at", shots === 0 ? "waiting" : s.head >= 6.999 ? "8 shots read" : `reading shot ${shots}`);
        shotFills.forEach((el, i) => (el.style.transform = `scaleX(${i < shots ? 1 : 0})`));
        // the dot rides power3.out through each step of the playhead
        const stepsNow = span(t, 13.0, 13.0 + (STEP * 7) / 0.55) * 7;
        curveAt(t < 13.0 ? 0 : s.head >= 6.999 ? 1 : span(stepsNow % 1, 0, 0.55));
        const frames = Math.round(s.frames ?? 0);
        setText("c-frames", frames);
        document.getElementById("c-frames-bar").style.transform = `scaleX(${(frames / 720).toFixed(4)})`;
        setText("c-tc", timecode(frames));
        fader("c-play", frames / 720);
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: 25, duration: 25, ease: "none", onUpdate: () => render(clock.t) }, 0);

      // entrances by role: the card fades in place; captions rise from behind their line and fade out; readouts cross
      // on the cut and let their numbers do the moving
      const wipe = (id, at) => {
        tl.set(id, { opacity: 1 }, at);
        tl.fromTo(id + " .rise-in", { yPercent: 110 }, { yPercent: 0, duration: 0.8, ease: "power4.out" }, at);
      };
      const cut = (id, at) => tl.fromTo(id, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in", immediateRender: false }, at - 0.3);
      const swap = (out, inn, at) => {
        tl.fromTo(out, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.in", immediateRender: false }, at - 0.3);
        tl.fromTo(inn, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, at);
      };

      // shot 2: card in, typing, send
      // the card arrives full size from shot 1 showing the finished film; it fades to the empty prompt
      tl.fromTo("#c-ghost", { opacity: 1 }, { opacity: 0, duration: 0.7, ease: "power1.inOut" }, 0.15);
      tl.fromTo("#c-caret", { opacity: 1 }, { opacity: 0, duration: 0.01, repeat: 5, yoyo: true, repeatDelay: 0.24 }, 3.25);
      tl.to("#c-send-on", { opacity: 1, duration: 0.1 }, 3.45);
      wipe("#c-cap1", 0.5);
      cut("#c-cap1", 3.85);

      // shot 3: the input folds into the bar, the plate opens
      tl.to("#c-input", { opacity: 0, y: -150, scale: 0.6, transformOrigin: "0% 0%", duration: 0.45, ease: "power3.in" }, 3.8);
      tl.to(["#c-you", "#c-agent", "#c-rule"], { opacity: 0, duration: 0.2 }, 3.8);
      tl.fromTo("#c-bar", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 4.15);
      tl.fromTo("#c-read", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 4.3);
      wipe("#c-cap2", 4.3);

      // shot 4: lamp
      cut("#c-cap2", 8.0);
      swap("#c-b-parts", "#c-b-lamp", 8.0);
      wipe("#c-cap3", 8.15);

      // shot 5: timeline
      cut("#c-cap3", 10.0);
      swap("#c-b-lamp", "#c-b-shots", 10.0);
      wipe("#c-cap4", 10.15);

      // shot 6: projector
      cut("#c-cap4", 16.0);
      swap("#c-b-shots", "#c-b-frames", 16.0);
      wipe("#c-cap5", 16.15);
      cut("#c-cap5", 24.6);
      // the camera stays put: a push toward any part carries the library or the bench past the card's edge

      render(0);
      window.__timelines["card"] = tl;
    })();
  </script>
</template>

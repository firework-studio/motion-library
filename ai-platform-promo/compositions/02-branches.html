  <script>
    // world: the signal origin sits at (220, 540); the wave runs in from the left
    const O = { x: 220, y: 540 };
    const W0 = -670;
    const span = O.x - W0;
    const easeOut = gsap.parseEase("power2.out");
    const easeIn = gsap.parseEase("power2.in");
    const clamp01 = (v) => Math.min(1, Math.max(0, v));
    const smooth = (a, b, v) => {
      const u = clamp01((v - a) / (b - a));
      return u * u * (3 - 2 * u);
    };

    // the wave is a travelling signal: its front eases out from W0 to O, the packet rides
    // just behind the front and settles mid-line, and its phase keeps running to the right
    const WAVE_IN = [0.08, 0.85];
    const WAVE_OUT = [4.45, 4.85];
    const wavePath = (t) => {
      const p = easeOut(clamp01((t - WAVE_IN[0]) / (WAVE_IN[1] - WAVE_IN[0])));
      const q = easeIn(clamp01((t - WAVE_OUT[0]) / (WAVE_OUT[1] - WAVE_OUT[0])));
      const front = W0 + span * p;
      const tail = W0 + span * q;
      if (p <= 0 || front - tail < 2) return "";
      const centre = W0 + (front - W0) * (0.82 - 0.32 * p);
      const amp = 60 * smooth(0.08, 0.45, p);
      let d = "";
      for (let x = tail; x <= front; x += 3) {
        const env = Math.exp(-Math.pow((x - centre) / 150, 2)) * clamp01((front - x) / 70);
        const y = O.y - amp * env * Math.sin((x - W0) / 16 - 10 * t);
        d += (d ? " L" : "M") + x.toFixed(1) + " " + y.toFixed(2);
      }
      return d;
    };

    // one branch per node; each grows at its own pace and lands before its label types in
    const GROW = [0.85, 0.8, 1.25, 0.8, 1.05, 1.35];
    const curves = gsap.utils.toArray(".b-curve").map((el, i) => ({
      el,
      points: el.dataset.points.split(" ").map((p) => p.split(",").map(Number)),
      phase: i * 1.7,
      grow: [0.78 + i * 0.03, GROW[i]],
      retract: [4.45 + i * 0.015, 0.4],
    }));
    const growEase = gsap.parseEase("power1.out");
    const drawn = (c, t) => {
      const g = growEase(clamp01((t - c.grow[0]) / c.grow[1]));
      const r = easeIn(clamp01((t - c.retract[0]) / c.retract[1]));
      return g * (1 - r);
    };
    // branches sway while they grow: inner waypoints drift on slow sines, origin and node stay put;
    // a Catmull-Rom spline through the waypoints keeps every joint smooth
    const curvePath = (c, t) => {
      const sway = 1 - smooth(3.0, 3.6, t) * 0.7; // calmer once the overview lands
      const last = c.points.length - 1;
      const p = c.points.map(([x, y], k) => {
        if (k === 0 || k === last) return [x, y];
        const w = c.phase + k * 1.3;
        return [x + 8 * sway * Math.sin(1.7 * t + w), y + 20 * sway * Math.sin(1.9 * t + w + 0.6)];
      });
      let d = `M${p[0][0]} ${p[0][1]}`;
      for (let k = 0; k < last; k++) {
        const p0 = p[Math.max(k - 1, 0)];
        const p1 = p[k];
        const p2 = p[k + 1];
        const p3 = p[Math.min(k + 2, last)];
        const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
        const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
        d += ` C ${c1[0].toFixed(1)} ${c1[1].toFixed(1)}, ${c2[0].toFixed(1)} ${c2[1].toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
      }
      return d;
    };

    const wave = document.querySelector("#b-wave");
    const render = (t) => {
      wave.setAttribute("d", wavePath(t));
      curves.forEach((c) => {
        c.el.setAttribute("d", curvePath(c, t));
        c.el.style.strokeDashoffset = 1 - drawn(c, t);
      });
    };

    const tl = gsap.timeline({ paused: true });
    const cam = "#b-cam";
    const clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, { t: 5.4, duration: 5.4, ease: "none", onUpdate: () => render(clock.t) }, 0);

    // shot 3: the source dot stays at W0; a second glow lands where the wave ends
    tl.set(cam, { x: 1820, y: 0, scale: 1 }, 0);
    tl.set("#b-src", { x: W0, y: O.y }, 0);
    tl.fromTo("#b-src", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.2, ease: "expo.out" }, 0);
    tl.to("#b-src", { opacity: 0.6, scale: 0.7, duration: 0.6 }, 0.8);
    tl.set("#b-dot", { x: O.x, y: O.y }, 0);
    tl.fromTo("#b-dot", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.25, ease: "expo.out" }, 0.75);
    tl.to(cam, { x: 1210, duration: 0.2, ease: "power2.out" }, 0);
    tl.to(cam, { x: 715, duration: 0.6, ease: "power1.inOut" }, 0.2);

    // shot 4: branches grow while the camera drifts; then hard cuts to three close-ups and back out
    const OVERVIEW_X = -28;
    tl.to(cam, { x: 220, duration: 0.95, ease: "power1.inOut" }, 0.82);

    const nodes = gsap.utils.toArray(".b-node");
    tl.set(".b-pin", { opacity: 0, scale: 0 }, 0);
    tl.set(".b-icon", { opacity: 0 }, 0);
    tl.set(".b-copy", { clipPath: "inset(0 100% 0 0)" }, 0);
    // a node: its pin lands with the branch, the icon fades in dim (sometimes before the branch
    // arrives), then brightens as its label types in on the close-up
    const reveal = (i, iconAt, typeAt) => {
      const n = nodes[i];
      const landed = Math.min(curves[i].grow[0] + curves[i].grow[1], typeAt - 0.1);
      tl.to(n.querySelector(".b-pin"), { opacity: 1, scale: 1, duration: 0.15, ease: "back.out(3)" }, landed);
      tl.to(n.querySelector(".b-icon"), { opacity: 0.4, duration: 0.15, ease: "sine.out" }, iconAt);
      tl.to(n.querySelector(".b-icon"), { opacity: 1, duration: 0.12 }, typeAt);
      tl.to(n.querySelector(".b-copy"), { clipPath: "inset(0 0% 0 0)", duration: 0.25, ease: "steps(12)" }, typeAt);
    };
    // a close-up: cut in, then push in slightly about the frame centre for the hold
    const closeUp = (at, hold, s, x, y) => {
      tl.set(cam, { x, y, scale: s }, at);
      const k = 1.035;
      tl.to(cam, { x: 960 - (960 - x) * k, y: 540 - (540 - y) * k, scale: s * k, duration: hold, ease: "none" }, at);
    };

    closeUp(1.8, 0.6, 1.66, -360, -75); // top left: comments, moodboard
    reveal(0, 1.66, 1.82);
    reveal(1, 1.69, 1.88);
    closeUp(2.4, 0.6, 1.705, -347, -638); // bottom: prompt, launch cut
    reveal(3, 1.69, 2.41);
    reveal(4, 1.72, 2.46);
    closeUp(3.0, 0.3, 2.05, -1918, -164); // top right: review
    reveal(2, 2.1, 3.0);
    tl.set(cam, { x: OVERVIEW_X, y: 0, scale: 1 }, 3.3); // overview
    reveal(5, 2.3, 3.36);

    // shot 5: everything retracts; the node pins gather into a ring
    tl.to(".b-tag", { opacity: 0, filter: "blur(4px)", duration: 0.25, stagger: 0.03 }, 4.3);
    tl.to("#b-dot", { scale: 0.6, opacity: 0.55, duration: 0.4 }, 4.55);
    tl.to("#b-src", { opacity: 0, duration: 0.3 }, 4.55);

    const R = 420;
    const C = { x: 960, y: 540 };
    const slots = [-135, -90, -45, 135, 90, 45, 0, 180]; // degrees, evenly spaced: one per node pin + 2 spare
    nodes.forEach((n, i) => {
      const a = (slots[i] * Math.PI) / 180;
      const pin = n.querySelector(".b-pin");
      const nx = parseFloat(n.style.left);
      const ny = parseFloat(n.style.top);
      tl.to(pin, { x: C.x - OVERVIEW_X + R * Math.cos(a) - nx, y: C.y + R * Math.sin(a) - ny, scale: 3.6, duration: 0.45, ease: "power3.inOut" }, 4.42 + i * 0.03);
    });
    const ringDots = gsap.utils.toArray(".b-rd");
    ringDots.forEach((rd, i) => {
      tl.set(rd, { rotation: slots[i] + 90 }, 0);
    });
    tl.fromTo(ringDots.slice(6).map((rd) => rd.firstElementChild), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 4.6);
    tl.set(ringDots.slice(0, 6).map((rd) => rd.firstElementChild), { opacity: 1 }, 4.95);
    tl.set(".b-pin", { opacity: 0 }, 4.95);

    window.__timelines["branches"] = tl;
  </script>

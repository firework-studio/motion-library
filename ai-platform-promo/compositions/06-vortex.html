  <script>
    const tl = gsap.timeline({ paused: true });

    // shot 10: the blue ripple opens out from the send button together with the cards
    tl.fromTo("#v-ripple", { scale: 1 }, { scale: 1.3, duration: 2.1, ease: "none" }, 0);
    tl.to("#v-ripple", { "--outer": "1800px", duration: 0.75, ease: "power1.in" }, 0);
    tl.to("#v-bg", { "--lx": "-700px", duration: 0.45, ease: "power1.in" }, 0.05);
    tl.to("#v-base", { opacity: 1, duration: 0.3, ease: "power1.inOut" }, 0.32);
    tl.to("#v-halo", { opacity: 1, duration: 0.18, ease: "power1.out" }, 0.28);

    // the button never leaves the frame: it drifts to the centre, then keeps shrinking once the ring is full
    tl.fromTo("#v-btn", { x: 34, y: 0, scale: 1.62 }, { x: 0, y: 0, scale: 1.2, duration: 0.22, ease: "power2.inOut" }, 0.02);
    tl.to("#v-btn", { scale: 0.95, duration: 0.6, ease: "sine.inOut" }, 0.3);

    // the arrow turns once in place, clockwise like a clock hand, while the cards are dealt
    tl.fromTo("#v-arrow", { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 360, transformOrigin: "50% 50%", duration: 0.75, ease: "power1.out" }, 0);
    // the coloured light on the sphere swings round more slowly than the arrow, from lower left to upper right
    tl.fromTo("#v-face", { rotation: 0 }, { rotation: 180, duration: 0.9, ease: "power1.out" }, 0);

    // cards are dealt clockwise starting at the button's upper right: each slides out along its own
    // radius washed in blue, then the blue clears to show the poster
    const arms = gsap.utils.toArray(".v-arm");
    const START = -60; // degrees, upper right
    arms.forEach((arm) => {
      const angle = parseFloat(arm.dataset.angle);
      const r = parseFloat(arm.dataset.r) - 40; // keeps a white gap around the button
      const card = arm.firstElementChild;
      const tilt = parseFloat(card.dataset.tilt);
      const order = (((angle - START) % 360) + 360) % 360 / 360; // 0 … 1 clockwise from the start
      const t = order * 0.3;
      tl.set(arm, { rotation: angle }, 0);
      tl.set(card, { opacity: 1 }, t);
      tl.fromTo(card, { x: r - 25, scale: 0.68, rotation: tilt - 8 }, { x: r, scale: 0.74, rotation: tilt, duration: 0.3, ease: "power2.out" }, t);
      tl.fromTo(card, { "--tint": 1 }, { "--tint": 0, duration: 0.08, ease: "power1.in" }, t + 0.02);
      // shot 11: the petals blow outward and clear the centre
      tl.to(card, { x: r * 2.6, scale: 1.1, duration: 0.55, ease: "power1.in" }, 0.66 + order * 0.06);
    });
    tl.fromTo("#v-cards", { rotation: 0, scale: 1 }, { rotation: 40, scale: 1.06, duration: 1.6, ease: "power1.out" }, 0);
    // the ring is centred on the button while the button settles to the middle of the frame
    tl.fromTo("#v-cards", { x: 34 }, { x: 0, duration: 0.22, ease: "power2.inOut" }, 0.02);

    // the button lifts away and "Seconds." types in, blue settling to ink
    tl.to("#v-btn", { y: -640, duration: 0.25, ease: "power2.in" }, 0.95);
    tl.to("#v-sky", { opacity: 1, duration: 0.4, ease: "power1.inOut" }, 0.95);
    tl.fromTo("#v-word", { scale: 1.12 }, { scale: 1, duration: 0.8, ease: "power2.out" }, 1.0);
    const letters = gsap.utils.toArray("#v-word span");
    letters.forEach((el, i) => {
      const t = 1.02 + i * 0.045;
      tl.fromTo(el, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.1 }, t);
      if (el.id !== "v-dot") tl.to(el, { color: "#111418", duration: 0.15 }, t + 0.16);
    });

    window.__timelines["vortex"] = tl;

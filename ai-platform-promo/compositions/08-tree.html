    const clamp01 = (v) => Math.min(1, Math.max(0, v));
    const smooth = (a, b, x) => {
      const u = clamp01((x - a) / (b - a));
      return u * u * (3 - 2 * u);
    };
    const hash = (a, b) => {
      let h = (a * 374761393 + b * 668265263) | 0;
      h = (h ^ (h >>> 13)) * 1274126177;
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    };
    const easeOut = gsap.parseEase("power2.out");
    const backOut = gsap.parseEase("back.out(2.2)");

    // ---- shot 15: the camera flies forward through labels scattered in depth ----
    const decoys = gsap.utils.toArray(".d-lab").map((el, i) => ({
      el,
      x: +el.dataset.x,
      y: +el.dataset.y,
      z: +el.dataset.z,
      tint: ["#f3a21a", "#e8455a", "#7cc79a", "#e6d14a", "#f07a3a"][i % 5],
    }));
    const FOCAL = 900;
    const camZ = (t) => 300 * gsap.parseEase("power1.in")(clamp01(t / 1.8));
    // the camera circles a point in the middle of the field, swinging from left to right
    const PIVOT = 1050;
    const yaw = (t) => (-55 + 95 * gsap.parseEase("sine.inOut")(clamp01(t / 1.8))) * (Math.PI / 180);
    const drawDecoys = (t) => {
      const cz = camZ(t);
      const a = yaw(t);
      const ca = Math.cos(a), sa = Math.sin(a);
      decoys.forEach((d) => {
        const rz = d.z - PIVOT;
        const x = d.x * ca - rz * sa;
        const dz = PIVOT + d.x * sa + rz * ca - cz;
        if (dz < 60 || t > 1.8) {
          d.el.style.opacity = 0;
          return;
        }
        const s = FOCAL / dz;
        const blur = Math.min(8, Math.max(0, Math.abs(dz - 700) - 220) / 60) + 5 * (1 - smooth(0.05, 0.3, t));
        const fadeNear = smooth(60, 260, dz);
        const fadeIn = smooth(0.02, 0.35, t);
        const fadeOut = 1 - smooth(1.45, 1.75, t);
        d.el.style.opacity = fadeNear * fadeIn * fadeOut;
        d.el.style.transform = `translate(${x * s}px, ${d.y * s}px) scale(${s * 1.25})`;
        d.el.style.filter = `blur(${blur.toFixed(1)}px)`;
        // mixed colours at first, settling to the orange dots
        const k = smooth(0.2, 0.6, t);
        d.el.querySelector(".t-dot").style.background = gsap.utils.interpolate(d.tint, "#f3a21a", k);
        d.el.querySelector(".t-name").style.color = gsap.utils.interpolate(d.tint, "#26221e", k);
      });
    };

    // ---- shot 16–17: a tree grows from the lower left, a branch reaching every label ----
    const labels = gsap.utils.toArray(".t-lab").map((el) => ({ el, x: parseFloat(el.style.left), y: parseFloat(el.style.top) }));
    const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
    const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
    const mul = (a, k) => [a[0] * k, a[1] * k];
    const len = (a) => Math.hypot(a[0], a[1]);
    const norm = (a) => mul(a, 1 / (len(a) || 1));
    const perp = (a) => [-a[1], a[0]];
    // a smooth (Catmull-Rom) curve through a list of points, sampled at u in 0..1
    const along = (pts, u) => {
      const n = pts.length - 1;
      const f = Math.min(n - 1e-6, Math.max(0, u * n));
      const k = Math.floor(f);
      const t = f - k;
      const p0 = pts[Math.max(0, k - 1)], p1 = pts[k], p2 = pts[k + 1], p3 = pts[Math.min(n, k + 2)];
      const c = (i) =>
        0.5 * (2 * p1[i] + (-p0[i] + p2[i]) * t + (2 * p0[i] - 5 * p1[i] + 4 * p2[i] - p3[i]) * t * t + (-p0[i] + 3 * p1[i] - 3 * p2[i] + p3[i]) * t * t * t);
      return [c(0), c(1)];
    };

    // The tree traced from the reference: it leans right like a branch in the wind, six limbs sweep out
    // of the trunk in long S-curves, fork again and again, and every last twig ends at a label.
    // Traced on the 1752 x 922 reference frame.
    const S = 1920 / 1752;
    // scaled down a touch and lowered so the top twigs and their labels clear the frame edge
    const T = (pts) => pts.map(([x, y]) => [x * S * 0.95 + 10, y * S * 0.95 + 60]);
    const TREE = [
      // [points, start width, end width, label index or -1]
      [[[-60, 980], [100, 820], [230, 705], [300, 640]], 80, 62, -1], // trunk
      [[[300, 640], [380, 560], [450, 480], [560, 420], [700, 330], [800, 300], [900, 260], [1000, 220], [1100, 205], [1200, 190], [1300, 170], [1400, 150], [1497, 135]], 48, 5, 4],
      [[[1020, 215], [1050, 150], [1100, 110], [1180, 70], [1226, 25]], 13, 3, 2],
      [[[1240, 182], [1270, 140], [1298, 115]], 7, 2, 3],
      [[[720, 322], [730, 240], [760, 170], [790, 110], [805, 60]], 14, 3, 0],
      [[[790, 140], [850, 110], [926, 66]], 7, 2, 1],
      [[[735, 272], [745, 240], [757, 220]], 6, 2, 6],
      [[[440, 470], [470, 380], [520, 300], [545, 240], [549, 190]], 14, 3, 5],
      [[[515, 300], [560, 280], [601, 263]], 6, 2, 8],
      [[[470, 342], [460, 290], [440, 252]], 8, 2, 7],
      [[[262, 640], [310, 560], [350, 480], [357, 387]], 15, 3, 12],
      [[[250, 610], [230, 530], [187, 480]], 12, 3, 13],
      [[[330, 620], [450, 560], [600, 480], [700, 420], [800, 400], [900, 370], [1000, 350], [1100, 340], [1200, 330], [1300, 300], [1360, 270], [1416, 248]], 36, 4, 10],
      [[[1300, 302], [1360, 310], [1427, 316]], 6, 2, 11],
      [[[1060, 337], [1100, 300], [1137, 285]], 7, 2, 9],
      [[[620, 470], [700, 450], [820, 430], [900, 450], [1000, 470], [1100, 460], [1200, 440], [1300, 420], [1385, 405]], 20, 3, 15],
      [[[1250, 432], [1320, 460], [1388, 467]], 6, 2, 16],
      [[[1040, 466], [1080, 430], [1108, 421]], 6, 2, 14],
      [[[330, 625], [450, 600], [580, 570], [700, 590], [800, 600], [900, 595], [1000, 580], [1100, 540], [1140, 522]], 24, 3, 18],
      [[[1020, 578], [1080, 595], [1144, 600]], 6, 2, 19],
      [[[820, 598], [850, 560], [869, 547]], 6, 2, 17],
      [[[290, 700], [380, 730], [480, 750], [600, 730], [700, 700], [794, 660]], 20, 3, 21],
      [[[690, 704], [740, 720], [795, 725]], 6, 2, 22],
      [[[500, 748], [530, 710], [548, 690]], 6, 2, 20],
      [[[300, 712], [400, 770], [500, 810], [650, 800], [800, 790], [900, 770], [1000, 745], [1050, 750], [1090, 770]], 22, 3, 23],
      [[[880, 788], [930, 815], [985, 830]], 6, 2, 24],
    ];
    // labels whose text sits to the left of their dot
    const FLIP = new Set([0, 7, 12, 13]);
    // the growing front travels at one steady speed through the whole tree: a limb starts the moment
    // the front of its parent passes the point it grows from, so there is never a pause
    const SPEED = 1700; // px per second
    const lengthOf = (p) => {
      let L = 0;
      for (let k = 1; k <= 80; k++) L += len(sub(along(p, k / 80), along(p, (k - 1) / 80)));
      return L;
    };
    const limbs = [];
    TREE.forEach(([pts, w0, w1, li], i) => {
      const p = T(pts);
      let start = 2.1;
      if (i > 0) {
        let best = null;
        limbs.forEach((q) => {
          for (let k = 0; k <= 80; k++) {
            const c = along(q.p, k / 80);
            const d = len(sub(c, p[0]));
            if (!best || d < best[0]) best = [d, c, q, k / 80];
          }
        });
        p[0] = best[1];
        start = best[2].start + (best[3] * best[2].L) / SPEED;
      }
      const L = lengthOf(p);
      if (li >= 0) {
        const tip = p[p.length - 1];
        const l = labels[li];
        l.x = tip[0];
        l.y = tip[1];
        l.el.style.left = `${tip[0]}px`;
        l.el.style.top = `${tip[1]}px`;
        if (FLIP.has(li)) l.el.classList.add("flip");
      }
      limbs.push({ p, L, w: [w0 * S * 0.9, w1 * S * 0.9], start, dur: L / SPEED });
    });
    const trunk = limbs[0];

    const canvas = document.querySelector("#t-canvas");
    const ctx = canvas.getContext("2d");
    // branches are drawn as a flat silhouette with torn edges, then painted with a crumpled-paper
    // bark texture and laid on the page with a soft drop shadow, like a paper cut-out
    const shape = document.createElement("canvas");
    shape.width = 1920;
    shape.height = 1080;
    const sctx = shape.getContext("2d");
    const barkTex = document.querySelector("#t-barktex");
    const drawLimb = (limb, t, idx) => {
      const g = clamp01((t - limb.start) / limb.dur);
      if (g <= 0) return;
      const STEPS = 140;
      const n = Math.max(2, Math.ceil(STEPS * g));
      const TIP = 160; // px behind the front over which the limb swells from a point to full width
      let prev = along(limb.p, 0);
      sctx.lineCap = "round";
      sctx.strokeStyle = "#000";
      for (let i = 1; i <= n; i++) {
        const u = (g * i) / n;
        const pt = along(limb.p, u);
        const rough = 1 + 0.22 * (hash(idx, i) - 0.5) + 0.1 * Math.sin(i * 0.9 + idx) + 0.06 * Math.sin(i * 2.7 + idx * 3);
        const behind = (g - u) * limb.L; // distance from the growing front
        const swell = g >= 1 ? 1 : 0.12 + 0.88 * smooth(0, TIP, behind);
        const w = (limb.w[0] + (limb.w[1] - limb.w[0]) * u) * rough * swell;
        sctx.lineWidth = w;
        sctx.beginPath();
        sctx.moveTo(prev[0], prev[1]);
        sctx.lineTo(pt[0], pt[1]);
        sctx.stroke();
        // torn-paper edge: short fibres bristle out of both sides
        if (w > 5) {
          const d = norm(sub(pt, prev));
          const nrm = perp(d);
          sctx.lineWidth = 2;
          for (let f = 0; f < 3; f++) {
            const side = f % 2 ? 1 : -1;
            const h = hash(idx * 131 + i, f);
            const at = add(add(prev, mul(sub(pt, prev), h)), mul(nrm, side * w * 0.45));
            const tip = add(at, add(mul(nrm, side * (0.8 + 2.2 * hash(i, idx + f))), mul(d, (h - 0.5) * 7)));
            sctx.beginPath();
            sctx.moveTo(at[0], at[1]);
            sctx.lineTo(tip[0], tip[1]);
            sctx.stroke();
          }
        }
        prev = pt;
      }
    };

    // a band near the base of the trunk is cut away to leave room for the project name
    const BAND = [0.28, 0.66];
    const cutBand = () => {
      sctx.save();
      sctx.globalCompositeOperation = "destination-out";
      sctx.lineCap = "butt";
      sctx.lineWidth = trunk.w[0] + 30;
      sctx.beginPath();
      for (let k = 0; k <= 20; k++) {
        const q = along(trunk.p, BAND[0] + ((BAND[1] - BAND[0]) * k) / 20);
        if (k === 0) sctx.moveTo(q[0], q[1]);
        else sctx.lineTo(q[0], q[1]);
      }
      sctx.stroke();
      sctx.restore();
    };

    // a few sprigs along the limbs, each a short stem with a couple of leaves and a small cluster of
    // blossoms at three stages: a tight bud, a half-open flower and a full bloom. Everything is laid down
    // in short, overlapping, semi-opaque strokes so it reads as oil paint rather than flat vector.
    const flora = [];
    // [limb, u, side, kind] — kept away from the label tips; each pops on its own beat
    // leaves and blossoms on the limbs and forks only, alternating sides, never on the label twigs
    const KINDS = ["leaf2", "bloom", "leaf", "leaf2", "bloom", "leaf"];
    const PLACE = [];
    TREE.forEach(([, w0], li) => {
      if (li === 0 || w0 < 13) return;
      const us = w0 >= 20 ? [0.35, 0.7] : [0.5];
      us.forEach((u, k) => PLACE.push([li, u, (li + k) % 2 ? 1 : -1, KINDS[(li * 2 + k) % KINDS.length]]));
    });
    PLACE.filter(([, , , kind]) => kind !== "buds" && kind !== "bud").forEach(([li, u, side, kind], n) => {
      const limb = limbs[li];
      const p = along(limb.p, u);
      const dir = norm(sub(along(limb.p, Math.min(1, u + 0.02)), along(limb.p, Math.max(0, u - 0.02))));
      const out = [dir[0] * 0.35 + perp(dir)[0] * side, dir[1] * 0.35 + perp(dir)[1] * side];
      const grown = limb.start + limb.dur * u;
      const at = Math.max(grown + 0.15, 3.75 + hash(n, 17) * 1.1);
      flora.push({ p, ang: Math.atan2(out[1], out[0]), at, kind, n });
    });

    // one dab of paint: a short soft ellipse
    const dab = (x, y, rx, ry, a, col, alpha) => {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, a, 0, 6.2832);
      ctx.fill();
    };
    const mixc = (c1, c2, u) => {
      const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
      const ch = (sh) => Math.round(((a >> sh) & 255) * (1 - u) + ((b >> sh) & 255) * u);
      return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
    };
    // a leaf built from strokes laid along its length, darker on one side of the midrib
    const paintLeaf = (L, seed) => {
      const W = L * 0.36;
      for (let k = 0; k < 26; k++) {
        const u = hash(seed, k);
        const v = hash(k, seed) * 2 - 1;
        const half = Math.sin(Math.PI * u) * W * (0.9 + 0.1 * hash(seed + 5, k));
        const x = u * L;
        const y = v * half * 0.8;
        const col = mixc(v < 0 ? "#5f8a33" : "#3f6a26", v < 0 ? "#a9c76c" : "#6f9a3f", hash(seed + 9, k));
        dab(x, y, L * 0.14, W * 0.32, 0.18 * v, col, 0.55);
      }
      ctx.globalAlpha = 0.6;
      ctx.strokeStyle = "#c9dc9a";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(L * 0.06, 0);
      ctx.quadraticCurveTo(L * 0.5, -1, L * 0.9, 0);
      ctx.stroke();
      ctx.globalAlpha = 1;
    };
    // a petal laid in strokes from a pink base to a creamy white edge
    const paintPetal = (R, seed, open) => {
      for (let k = 0; k < 14; k++) {
        const u = 0.25 + 0.75 * hash(seed, k);
        const v = (hash(k, seed) * 2 - 1) * Math.sin(Math.PI * u) * R * 0.42 * open;
        const col = mixc("#e79aac", "#fff6ef", Math.min(1, u * 1.1));
        dab(u * R, v, R * 0.24, R * 0.16 * (0.6 + open * 0.4), 0, col, 0.5);
      }
    };
    const paintBud = (R, seed) => {
      for (let k = 0; k < 10; k++) {
        const u = hash(seed, k);
        dab(u * R * 1.2, (hash(k, seed) - 0.5) * R * 0.6, R * 0.35, R * 0.28, 0, mixc("#d9788f", "#f7cfd7", u), 0.6);
      }
      ctx.save();
      for (const a of [-0.55, 0.55]) {
        ctx.save();
        ctx.rotate(a);
        for (let k = 0; k < 5; k++) dab(R * 0.3 + k * 1.5, 0, R * 0.32, R * 0.12, 0, k % 2 ? "#6e9a3c" : "#4f7a2c", 0.6);
        ctx.restore();
      }
      ctx.restore();
    };
    const paintFlower = (R, seed, open) => {
      for (let k = 0; k < 5; k++) {
        ctx.save();
        ctx.rotate((k * 2 * Math.PI) / 5 + hash(seed, k) * 0.2);
        paintPetal(R, seed * 7 + k, open);
        ctx.restore();
      }
      for (let k = 0; k < 8; k++) {
        const a = k * 0.8;
        dab(Math.cos(a) * R * 0.18, Math.sin(a) * R * 0.18, 2.2, 2.2, 0, k % 2 ? "#d39a35" : "#f0c45a", 0.9);
      }
    };
    const drawItem = (f, s) => {
      ctx.save();
      ctx.translate(f.p[0], f.p[1]);
      ctx.rotate(f.ang);
      ctx.scale(s * 1.35, s * 1.35);
      if (f.kind === "leaf") {
        paintLeaf(40, f.n * 5 + 1);
      } else if (f.kind === "leaf2") {
        ctx.save();
        ctx.rotate(-0.35);
        paintLeaf(42, f.n * 5 + 2);
        ctx.restore();
        ctx.save();
        ctx.rotate(0.4);
        paintLeaf(32, f.n * 5 + 3);
        ctx.restore();
      } else if (f.kind === "bloom") {
        ctx.translate(4, 0);
        paintFlower(17, f.n + 11, 1);
      } else if (f.kind === "bud") {
        paintBud(9, f.n + 31);
      } else {
        // a little sprig of buds at different stages: tight, swelling, just opening
        ctx.globalAlpha = 0.85;
        ctx.strokeStyle = "#6a5a32";
        ctx.lineWidth = 2.2;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(16, -3, 34, -10);
        ctx.moveTo(14, -3);
        ctx.quadraticCurveTo(22, 6, 30, 12);
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.save();
        ctx.translate(34, -10);
        ctx.rotate(-0.3);
        paintFlower(8, f.n + 41, 0.4);
        ctx.restore();
        ctx.save();
        ctx.translate(30, 12);
        ctx.rotate(0.4);
        paintBud(8, f.n + 51);
        ctx.restore();
        ctx.save();
        ctx.translate(20, -4);
        ctx.rotate(-0.9);
        paintBud(6, f.n + 61);
        ctx.restore();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    };
    const drawFlora = (t) => {
      ctx.save();
      ctx.shadowColor = "rgba(60, 50, 20, 0.2)";
      ctx.shadowBlur = 3;
      ctx.shadowOffsetY = 1.5;
      flora.forEach((f) => {
        const s = backOut(clamp01((t - f.at) / 0.35));
        if (s > 0) drawItem(f, s);
      });
      ctx.restore();
    };

    const drawTree = (t) => {
      sctx.clearRect(0, 0, 1920, 1080);
      limbs.forEach((l, i) => drawLimb(l, t, i));
      cutBand();
      // paint the silhouette with bark
      if (barkTex.complete && barkTex.naturalWidth) {
        sctx.save();
        sctx.globalCompositeOperation = "source-in";
        sctx.drawImage(barkTex, 0, 0, 1920, 1080);
        sctx.restore();
      }
      ctx.clearRect(0, 0, 1920, 1080);
      ctx.save();
      ctx.shadowColor = "rgba(70, 40, 25, 0.38)";
      ctx.shadowBlur = 7;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 4;
      ctx.drawImage(shape, 0, 0);
      ctx.restore();

      // the project name sits in the cut-away band, running along the trunk
      const tg = clamp01((t - trunk.start - 0.15) / 0.2);
      if (tg > 0) {
        const a0 = along(trunk.p, BAND[0] + 0.03);
        const a1 = along(trunk.p, BAND[1] - 0.03);
        const d = sub(a1, a0);
        ctx.save();
        ctx.globalAlpha = tg;
        ctx.translate(a0[0], a0[1]);
        ctx.rotate(Math.atan2(d[1], d[0]));
        ctx.font = "74px 'League Gothic'";
        ctx.textBaseline = "middle";
        const label = "LAUNCH VIDEO";
        const tw = ctx.measureText(label).width;
        ctx.scale(len(d) / tw, 1); // fill the band
        ctx.fillStyle = "#3b2419";
        ctx.fillText(label, 0, 2);
        ctx.restore();
      }
      drawFlora(t);
    };

    // yellow leaves drift down across the frame once the tree is in leaf
    const fall = document.querySelector("#t-fall").getContext("2d");
    const drifters = Array.from({ length: 22 }, (_, i) => ({
      x: hash(i, 1) * 2100 - 90,
      y: hash(i, 2) * 900 - 200,
      v: 90 + hash(i, 3) * 120,
      ph: hash(i, 4) * 6.28,
      size: 7 + hash(i, 5) * 9,
      at: 3.7 + hash(i, 6) * 0.9,
    }));
    const drawFall = (t) => {
      fall.clearRect(0, 0, 1920, 1080);
      drifters.forEach((d) => {
        const u = t - d.at;
        if (u <= 0) return;
        const x = d.x + 40 * Math.sin(1.8 * u + d.ph) + 30 * u;
        const y = d.y + d.v * u;
        fall.save();
        fall.globalAlpha = smooth(0, 0.3, u) * 0.85;
        fall.translate(x, y);
        fall.rotate(Math.sin(2.2 * u + d.ph) * 0.9);
        fall.fillStyle = "#e8d23c";
        fall.beginPath();
        fall.ellipse(0, 0, d.size, d.size * 0.45, 0, 0, 6.2832);
        fall.fill();
        fall.restore();
      });
    };

    const clock = { t: 0 };
    const render = (t) => {
      drawDecoys(t);
      drawTree(t);
      drawFall(t);
    };
    tl.fromTo(clock, { t: 0 }, { t: 5.34, duration: 5.34, ease: "none", onUpdate: () => render(clock.t) }, 0);

    // a white haze lifts as the shot opens
    tl.fromTo("#t-haze", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power1.out" }, 0);

    // the arranged labels drift in from the right with the camera's swing and surface in two waves:
    // about half of them first, the rest a moment later
    tl.set("#t-tree", { opacity: 1 }, 1.3);
    tl.fromTo("#t-tree", { x: 260, y: 0, scale: 1 }, { x: 0, duration: 0.75, ease: "power2.out" }, 1.3);
    gsap.utils.toArray(".t-lab").forEach((el, i) => {
      const t = (hash(i, 9) < 0.5 ? 1.3 : 1.62) + hash(i, 4) * 0.18;
      tl.fromTo(el, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power1.out" }, t);
    });
    tl.to("#t-tree", { x: -20, y: 10, scale: 1.02, duration: 3.2, ease: "none" }, 2.1);

    // shot 17: a focus pull — everything blurs as the dots flare, and the ground turns warm
    tl.fromTo("#t-tree", { filter: "blur(0px)" }, { filter: "blur(8px)", duration: 0.12, ease: "power1.in" }, 3.55);
    tl.to("#t-tree", { filter: "blur(0px)", duration: 0.25, ease: "power1.out" }, 3.72);
    tl.fromTo(".t-lab", { "--glow": 0 }, { "--glow": 1, duration: 0.12 }, 3.55);
    tl.to(".t-lab", { "--glow": 0, duration: 0.3 }, 3.75);
    tl.to("#t-warm", { opacity: 0.5, duration: 0.5, ease: "power1.inOut" }, 3.6);
    tl.to("#t-warm-grain", { opacity: 0.6, duration: 0.5, ease: "power1.inOut" }, 3.6);

    window.__timelines["tree"] = tl;
  </script>
</template>

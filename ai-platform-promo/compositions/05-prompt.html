  <script>
    const tl = gsap.timeline({ paused: true });

    // shot 9: the coast resolves out of a blur; the question lands, then the bar
    tl.to("#p-all", { opacity: 1, duration: 0.08 }, 0);
    tl.to("#p-photo", { "--hf-color-grading-blur": 0, duration: 0.38, ease: "power2.inOut" }, 0.08);
    // a cyan print-dot screen with a fine mosaic covers the coast, then clears from the centre outward
    tl.to("#p-fx", { opacity: 1, duration: 0.05 }, 0.11);
    tl.to("#p-fx", { "--r": "1400px", duration: 0.7, ease: "power1.out" }, 0.12);
    // the question arrives bent on an upward arc, like text on the inside of a lens, and flattens out:
    // each letter starts lifted, turned and enlarged by its distance from the centre
    const title = document.querySelector("#p-title");
    const chars = [...title.textContent].map((ch) => {
      const span = document.createElement("span");
      span.className = "p-ch";
      span.textContent = ch;
      return span;
    });
    title.replaceChildren(...chars);
    const box = title.getBoundingClientRect();
    const cx = box.left + box.width / 2;
    const half = chars.reduce((m, el) => {
      const r = el.getBoundingClientRect();
      return Math.max(m, Math.abs(r.left + r.width / 2 - cx));
    }, 1);
    const ARC = 120; // lift of the outermost letters, px
    chars.forEach((el) => {
      const r = el.getBoundingClientRect();
      const u = (r.left + r.width / 2 - cx) / half; // -1 … 1
      const slope = (-2 * ARC * u) / half;
      tl.fromTo(
        el,
        { y: -ARC * u * u, rotation: (Math.atan(slope) * 180) / Math.PI, scale: 1 + 0.45 * u * u },
        { y: 0, rotation: 0, scale: 1, duration: 0.55, ease: "expo.out" },
        0.06,
      );
    });
    tl.fromTo(
      "#p-title",
      { scale: 1.5, y: -130, filter: "blur(7px)" },
      { scale: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" },
      0.06,
    );
    tl.fromTo("#p-bar", { opacity: 0, scale: 1.12, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.14);

    // the request types in while the camera eases forward

    tl.fromTo("#p-cam", { x: 0, y: 0, scale: 1 }, { x: -38, y: -22, scale: 1.04, duration: 0.95, ease: "none" }, 0.3);

    // push in to the send button, hold on it, and the arrow turns as it fires

  <script>
    const tl = gsap.timeline({ paused: true });

    // shot 9: the phone rises in fast and settles, the headline flips up line by line; the pointer
    // taps "Apply", the screen switches to Spark applying the reference with its timecode running,
    // then the whole frame whips out to the left
    tl.fromTo("#root", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 0);
    // the orange page clears to light first; only then does the phone rise
    tl.fromTo("#r-phone", { y: 1560 }, { y: 0, duration: 0.8, ease: "power3.out" }, 0.17);
    tl.fromTo("#r-content", { y: 40 }, { y: -20, duration: 1.0, ease: "power2.out" }, 0.25);

    gsap.utils.toArray("#r-head span").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 50, rotationX: -70 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.6, ease: "expo.out" }, 0.25 + i * 0.16);
    });

    // the pointer glides in from the lower right and taps the button
    tl.set("#r-cursor", { x: 1010, y: 860 }, 0);
    tl.to("#r-cursor", { opacity: 1, duration: 0.15 }, 0.3);
    tl.to("#r-cursor", { x: 505, y: 368, duration: 0.6, ease: "power3.inOut" }, 0.3);
    tl.to("#r-cursor", { scale: 0.82, duration: 0.08, ease: "power2.in" }, 0.86);
    tl.to("#r-cursor", { scale: 1, duration: 0.18, ease: "back.out(3)" }, 0.94);
    tl.to("#r-apply", { backgroundColor: "rgba(255,255,255,0.32)", duration: 0.08 }, 0.86);

    // screen 2 takes over, and the pointer drifts down onto the note
    tl.to("#r-s1", { opacity: 0, y: -16, duration: 0.18, ease: "power1.in" }, 1.0);
    tl.fromTo("#r-s2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 1.08);
    tl.to("#r-cursor", { x: 560, y: 560, duration: 0.6, ease: "power2.inOut" }, 1.15);

    // timecode runs at 24 fps from 00:00:12:04
    const tc = { f: 12 * 24 + 4 };
    const pad = (n) => String(n).padStart(2, "0");
    tl.fromTo(
      tc,
      { f: 12 * 24 + 4 },
      {
        f: 12 * 24 + 4 + 40,
        duration: 1.0,
        ease: "none",
        onUpdate: () => {
          const f = Math.round(tc.f);
          document.querySelector("#r-tc").textContent = `00:00:${pad(Math.floor(f / 24))}:${pad(f % 24)}`;
        },
      },
      1.1,
    );

    // exit: a whip to the left
    tl.to("#r-scene", { x: -1900, filter: "blur(14px)", duration: 0.26, ease: "power3.in" }, 1.96);

    window.__timelines["references"] = tl;
  </script>

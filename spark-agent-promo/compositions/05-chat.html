  <script>
    const tl = gsap.timeline({ paused: true });

    // shot 7: each message grows out of its avatar's lower corner, small to full size, and the
    // whole thread keeps drifting up so the newest message lands in the lower half; when the
    // third message arrives the thread turns into perspective (near on the left, receding to
    // the right) and holds that angle while the camera keeps pushing in
    const pop = (sel, t, fromRight) =>
      tl
        .fromTo(sel, { scale: 0.42, x: fromRight ? 60 : -60, y: 130 }, { scale: 1, x: 0, y: 0, duration: 0.55, ease: "expo.out" }, t)
        .fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, t);
    pop("#c-m1", 0.05, false);
    pop("#c-m2", 0.8, true);
    pop("#c-m3", 1.5, false);
    pop("#c-m4", 2.85, true);

    // the camera: a slow push-in and a steady rise for the whole shot
    tl.fromTo("#c-stage", { y: 130, scale: 1 }, { y: -470, scale: 1.12, duration: 3.85, ease: "power1.in" }, 0);
    // turning the plane swings its near (left) edge toward the frame edge, so the camera eases right
    tl.fromTo("#c-stage", { x: 0 }, { x: 170, duration: 0.5, ease: "power3.inOut" }, 1.42);
    tl.to("#c-stage", { x: 230, duration: 0.93, ease: "none" }, 1.92);
    // the turn into perspective is quick but eased at both ends so it reads as calm
    tl.fromTo("#c-stage", { rotationY: 0, rotationX: 0, rotationZ: 0 }, { rotationY: 26, rotationX: 9, rotationZ: 0, duration: 0.5, ease: "power3.inOut" }, 1.42);
    // depth of field: the user's bubbles sit on the far right, so they soften slightly
    // (blur the message, not the bubble: a filter on the bubble would lift its glow above it)
    tl.to(".c-msg.me", { filter: "blur(0.9px)", duration: 0.5, ease: "power1.inOut" }, 1.42);
    // with the last reply the plane swings back square, then the whole thread rises and fades
    tl.to("#c-stage", { rotationY: 0, rotationX: 0, x: 0, duration: 0.6, ease: "power2.inOut" }, 2.85);
    tl.to(".c-msg.me", { filter: "blur(0px)", duration: 0.4, ease: "power1.inOut" }, 2.85);
    tl.to("#c-cam", { y: -360, opacity: 0, duration: 0.6, ease: "power1.in" }, 3.25);

    // Spark's sphere is alive: the colour swirl keeps turning, the hot core wanders and the glow breathes
    tl.fromTo(".c-swirl", { rotation: 0 }, { rotation: 400, duration: 3.85, ease: "none" }, 0);
    tl.fromTo(".c-core", { x: -4, y: 6 }, { x: 8, y: -4, duration: 0.95, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
    tl.fromTo(".c-ball", { boxShadow: "0 6px 14px rgba(242, 106, 27, 0.32)" }, { boxShadow: "0 6px 24px rgba(255, 140, 40, 0.7)", duration: 0.64, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);

    // Spark's status lines get a soft sweep while it reads the site
    tl.fromTo(".c-note", { "--s": "-30%" }, { "--s": "130%", duration: 0.7, ease: "power1.inOut", stagger: 0.08 }, 1.6);
    tl.fromTo(".c-check", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, 1.75);

    // the question types on in place: each new letter lands pale, then settles to ink
    const q = document.getElementById("c-q");
    const chars = [...q.dataset.text].map((c) => {
      const sp = document.createElement("span");
      sp.textContent = c;
      q.append(sp);
      return sp;
    });
    chars.forEach((sp, i) => {
      const t = 1.95 + (0.45 * i) / chars.length;
      tl.fromTo(sp, { opacity: 0 }, { opacity: 0.35, duration: 0.03, ease: "none" }, t);
      tl.to(sp, { opacity: 1, duration: 0.12, ease: "none" }, t + 0.06);
    });

    window.__timelines["chat"] = tl;
  </script>

    <div data-hf-id="hf-ze0g" id="x-word">
      <span data-hf-id="hf-hhg2" id="x-w0"><span data-hf-id="hf-m8dd" id="x-base">Is Your Launch Video</span><span data-hf-id="hf-chkb" id="x-jug"></span><i data-hf-id="hf-1q0h" id="x-caret"></i></span>
      <span data-hf-id="hf-y5gn">Scripts</span>

      <span data-hf-id="hf-swcn" style="font-size: 42px">Too Many “Make It Pop”s?</span>
    </div>

  <script>
    // all motion lives in `tl`; the links are redrawn after it on every frame (see the end)
    const tl = gsap.timeline();

    // the camera starts close on the centre, pulls back quickly as the first cards slide in, then keeps
    // easing back slowly until the whole web of work is in frame
    tl.fromTo("#x-world", { scale: 1.75 }, { scale: 1.3, duration: 2.0, ease: "power2.inOut" }, 0);
    tl.to("#x-world", { scale: 1.0, duration: 4.3, ease: "power1.inOut" }, 2.0);

    // cards slide in from the side they sit on, in groups: middle pair, lower row, top row, then the edge
    const enter = (sel, t, gap) => {
      gsap.utils.toArray(sel).forEach((el, i) => {
        const r = el.getBoundingClientRect();
        const dx = (r.left + r.width / 2 - 960) * 0.18;
        const dy = (r.top + r.height / 2 - 540) * 0.18;
        tl.fromTo(el, { opacity: 0, x: dx, y: dy, filter: "blur(6px)" }, { opacity: 1, x: 0, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, t + i * gap);
      });
    };
    enter(".g-mid", 0.05, 0.05);
    enter(".g-low", 0.5, 0.08);
    enter(".g-top", 0.95, 0.1);
    enter(".g-out", 2.6, 0.12);

    // every card, avatar and icon keeps a gentle float of its own once it has landed; it moves on
    // percent offsets and rotation so it never fights the entry slide, and the links follow it live
    gsap.utils.toArray("#x-world > .x-float, #x-world > .x-badge, #x-world > .x-ava, #x-world > .x-tool").forEach((el, i) => {
      const w = el.offsetWidth || 100;
      const h = el.offsetHeight || 100;
      const amp = 9 + (i % 3) * 3; // px
      const period = 2.2 + (i % 4) * 0.35;
      const sx = i % 2 ? 1 : -1;
      tl.fromTo(
        el,
        { xPercent: 0, yPercent: 0, rotation: 0 },
        { xPercent: (sx * amp * 0.6 * 100) / w, yPercent: (-amp * 100) / h, rotation: sx * 1.2, duration: period / 2, ease: "sine.inOut", repeat: Math.ceil(6.6 / (period / 2)), yoyo: true },
        0.4 + (i % 5) * 0.15,
      );
    });
    tl.fromTo("#x-orbit path", { strokeDashoffset: 0 }, { strokeDashoffset: -160, duration: 4.0, ease: "none" }, 2.6);

    // connection dots sit on the card edges and arrive with their cards; each link then grows out of
    // its source dot and reaches the next card's dot (traced from the reference frame by frame)
    // each link grows out of its source dot and lands exactly on the next card's dot
    const LINKS = [
      // [link, from dot, to dot, leave direction, arrive direction, start, duration]
      ["#l-cal", "#d-cal", "#d-mail-in", [1, 0], [-1, 0], 0.9, 0.7], // calendar → mail
      ["#l-script", "#d-script", "#d-time", [0.35, 1], [1, -0.2], 1.25, 0.8], // script → timeline
      ["#l-mail", "#d-mail-out", "#d-chat", [1, 0], [-1, 0], 1.6, 0.7], // mail → team chat
      ["#l-feed", "#d-rev", "#d-feed", [-0.35, 1], [-1, -0.2], 1.75, 0.8], // revisions → feedback
    ].map(([id, a, b, da, db, t, d]) => {
      const g = { v: 0 };
      tl.fromTo(g, { v: 0 }, { v: 1, duration: d, ease: "power1.inOut" }, t);
      return { el: document.querySelector(id), grad: document.querySelector(id.replace("#l-", "#g-")), a: document.querySelector(a), b: document.querySelector(b), da, db, g };
    });

    // the right chart's curves fade in left to right behind a soft edge: a third first, the rest later
    tl.fromTo("#x-feedsvg", { "--p": "-20%" }, { "--p": "125%", duration: 3.6, ease: "sine.inOut" }, 0.2);
    // the top-right chart fades in from the top down once its card is in
    tl.fromTo("#x-revsvg", { "--p": "-20%" }, { "--p": "125%", duration: 3.2, ease: "sine.inOut" }, 1.5);
    const rv = { v: 12 };
    tl.fromTo(rv, { v: 12 }, { v: 37, duration: 2.6, ease: "power1.in", onUpdate: () => (document.querySelector("#x-revnum").textContent = Math.round(rv.v)) }, 1.4);

    // the timeline plays; the script fills in and feeds it
    tl.fromTo("#x-play", { x: 0 }, { x: 320, duration: 5.6, ease: "none" }, 0.3);
    gsap.utils.toArray(".x-ln i").forEach((el, i) => tl.to(el, { width: "100%", duration: 0.3, ease: "power1.out" }, 1.9 + i * 0.15));
    // storyboard frames fill in one by one while a selection hops across them
    gsap.utils.toArray(".x-frame img").forEach((el, i) => tl.to(el, { opacity: 1, duration: 0.2 }, 1.9 + i * 0.12));
    tl.set("#x-sel", { opacity: 1 }, 1.9);
    [0, 1, 2, 3, 4, 5].forEach((k) => tl.set("#x-sel", { x: (k % 3) * 100, y: Math.floor(k / 3) * 60 }, 1.9 + k * 0.12));

    // launch day is set, the client mails to push it, the team reacts
    tl.fromTo("#x-day", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(3)" }, 0.9);
    const mail = "Can we push launch a week? Logo bigger?";
    const m = { n: 0 };
    tl.fromTo(m, { n: 0 }, { n: mail.length, duration: 0.9, ease: "none", onUpdate: () => (document.querySelector("#x-mailtext").textContent = mail.slice(0, Math.round(m.n))) }, 1.7);
    tl.to("#x-day", { y: 44, duration: 0.35, ease: "power2.inOut" }, 2.7); // the launch slips a week
    gsap.utils.toArray(".x-cm").forEach((el, i) => tl.fromTo(el, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(2)" }, 3.1 + i * 0.4));
    // the edge cards keep moving too
    gsap.utils.toArray(".x-row").forEach((el, i) => tl.fromTo(el, { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.25 }, 3.2 + i * 0.35));
    const boxes = gsap.utils.toArray(".x-box b");
    boxes.forEach((el, i) => tl.to(el, { opacity: 1, duration: 0.15 }, 3.2 + i * 0.3));
    tl.set(boxes[2], { background: "#e0453a" }, 4.8);

    // the opening line rises in large and grey, darkens and settles to size, then "Juggling" types on
    const words = gsap.utils.toArray("#x-word > span");
    tl.set("#x-w0", { opacity: 1 }, 0);
    tl.fromTo("#x-base", { y: 34, opacity: 0, color: "#9a9ea8" }, { y: 0, opacity: 1, color: "#1b1d22", duration: 0.35, ease: "power3.out" }, 0.05);
    tl.fromTo("#x-w0", { scale: 1.3 }, { scale: 1, duration: 0.6, ease: "power2.inOut" }, 0.35);
    const jug = " Juggling";
    const typed = { n: 0 };
    tl.fromTo(typed, { n: 0 }, { n: jug.length, duration: 0.45, ease: "none", onUpdate: () => (document.querySelector("#x-jug").textContent = jug.slice(0, Math.round(typed.n))) }, 1.0);
    tl.set("#x-caret", { opacity: 0 }, 0);
    tl.set("#x-caret", { opacity: 1 }, 0.25);
    tl.set("#x-caret", { opacity: 0 }, 1.5);
    // every later word rises up into the window from below
    [1.7, 2.3, 2.9, 3.8, 5.2].forEach((t, i) => {
      tl.set(words[i + 1], { opacity: 0, y: 70 }, 0);
      tl.set(words[i], { opacity: 0 }, t);
      tl.set(words[i + 1], { opacity: 1 }, t);
      tl.to(words[i + 1], { y: 0, duration: 0.3, ease: "power3.out" }, t);
    });

    // everything blurs out into the next shot
    // exit: the camera keeps pulling back, then the whole frame melts into a blur
    tl.to("#x-world", { scale: 0.8, duration: 0.95, ease: "power2.in" }, 6.3);
    tl.to("#x-word", { scale: 0.82, duration: 0.95, ease: "power2.in" }, 6.3);
    tl.to(["#x-world", "#x-word"], { filter: "blur(22px)", duration: 0.45, ease: "power1.in" }, 6.8);
    tl.to(["#x-world", "#x-word"], { opacity: 0.4, duration: 0.3, ease: "power1.in" }, 6.95);

    // after every frame of `tl`, re-route each link between the live positions of its two dots
    const world = document.querySelector("#x-world");
    const center = (el) => {
      const w = world.getBoundingClientRect();
      const k = w.width / 1920;
      const r = el.getBoundingClientRect();
      return [(r.left + r.width / 2 - w.left) / k, (r.top + r.height / 2 - w.top) / k];
    };
    // dashed ties between neighbouring items, routed centre to centre underneath the cards so each one
    // meets an edge; a tie shows once both of its ends have arrived
    const ties = gsap.utils.toArray("#x-orbit path").map((el, i) => ({
      el,
      a: document.getElementById(el.dataset.a),
      b: document.getElementById(el.dataset.b),
      bow: i % 2 ? 0.18 : -0.18,
    }));
    const drawTies = () => {
      ties.forEach((T) => {
        const A = center(T.a);
        const B = center(T.b);
        const n = [-(B[1] - A[1]) * T.bow, (B[0] - A[0]) * T.bow];
        const M = [(A[0] + B[0]) / 2 + n[0], (A[1] + B[1]) / 2 + n[1]];
        T.el.setAttribute("d", `M${A[0]} ${A[1]} Q ${M[0]} ${M[1]}, ${B[0]} ${B[1]}`);
        T.el.style.opacity = Math.min(+gsap.getProperty(T.a, "opacity"), +gsap.getProperty(T.b, "opacity")) * 0.75;
      });
    };
    // the links behave like soft cords: their handles swing on slow waves of their own, a little out of
    // step with each other, so the line ripples gently between the dots while the cards drift
    const drawLinks = (time) => {
      LINKS.forEach((L, k) => {
        const A = center(L.a);
        const B = center(L.b);
        const len = Math.hypot(B[0] - A[0], B[1] - A[1]);
        const reach = Math.max(90, len * 0.5);
        const n = [-(B[1] - A[1]) / (len || 1), (B[0] - A[0]) / (len || 1)];
        const amp = Math.min(58, len * 0.15);
        const w1 = amp * Math.sin(0.85 * time + k * 1.7);
        const w2 = amp * Math.sin(0.85 * time + k * 1.7 + 1.9);
        const c1 = [A[0] + L.da[0] * reach + n[0] * w1, A[1] + L.da[1] * reach + n[1] * w1];
        const c2 = [B[0] + L.db[0] * reach + n[0] * w2, B[1] + L.db[1] * reach + n[1] * w2];
        L.el.setAttribute("d", `M${A[0]} ${A[1]} C ${c1[0]} ${c1[1]}, ${c2[0]} ${c2[1]}, ${B[0]} ${B[1]}`);
        // the colour runs from deep orange at the source dot to a pale gold at the far end
        L.grad.setAttribute("x1", A[0]);
        L.grad.setAttribute("y1", A[1]);
        L.grad.setAttribute("x2", B[0]);
        L.grad.setAttribute("y2", B[1]);
        L.el.style.strokeDashoffset = 1 - L.g.v;
      });
    };

    const main = gsap.timeline({ paused: true });
    main.add(tl, 0);
    const clock = { t: 0 };
    main.fromTo(clock, { t: 0 }, { t: 1, duration: tl.duration(), ease: "none", onUpdate: () => (drawLinks(clock.t * tl.duration()), drawTies()) }, 0);

    window.__timelines["chaos"] = main;
  </script>

  <script>
    const tl = gsap.timeline({ paused: true });
    const D = 3.75;

    // shot 20: the export panel settles; the format rows lift off the table one after another and
    // drop back; the camera closes in on the button as the pointer arrives, and the click sets off
    // a burst of firework sparks
    // match cut: the orange page folds down into the export button, uncovering the panel around it,
    // its colour settling to the button's own as it lands; then the real button takes over
    const BTN = { x: 1375, y: 891, w: 276, h: 66, r: 18 };
    tl.fromTo(
      "#x-morph",
      { clipPath: "inset(0px 0px 0px 0px round 0px)" },
      {
        clipPath: `inset(${BTN.y}px ${1920 - BTN.x - BTN.w}px ${1080 - BTN.y - BTN.h}px ${BTN.x}px round ${BTN.r}px)`,
        duration: 0.6,
        ease: "power3.inOut",
      },
      0,
    );
    tl.to("#x-morph i", { opacity: 1, duration: 0.25, ease: "none" }, 0.35);
    tl.to("#x-morph", { opacity: 0, duration: 0.12, ease: "none" }, 0.62);
    tl.fromTo("#x-win", { opacity: 0.6 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.1);

    // the format rows come up from below the frame and each hovers just above its own slot, lifted
    // with a soft shadow, all in line; then they are pressed into place one at a time, top to bottom
    const LIFT = 0; // float in place over the slot, never up into the header
    gsap.utils.toArray(".x-row:not(.x-head)").forEach((row, i) => {
      const up = 0.76 + i * 0.05;
      const place = 1.4 + i * 0.1;
      tl.fromTo(row, { opacity: 0 }, { opacity: 1, duration: 0.01 }, up); // hidden until it comes up
      tl.fromTo(
        row,
        { y: 760, scale: 1.035, boxShadow: "0 0 0 1.5px #f0f1f4, 0 22px 30px -14px rgba(40, 50, 80, 0.22)" },
        { y: LIFT, duration: 0.5, ease: "power3.out" },
        up,
      );
      tl.to(row, { scale: 1.045, duration: place - up - 0.5, ease: "sine.inOut" }, up + 0.5); // the hover
      tl.to(row, { y: 0, scale: 1, boxShadow: "0 0 0 1.5px #f0f1f4, 0 0 0 0 rgba(40, 50, 80, 0)", duration: 0.28, ease: "power2.inOut" }, place);
    });

    tl.set("#x-cursor", { x: 1100, y: 700, opacity: 0 }, 0);
    tl.to("#x-cursor", { opacity: 1, duration: 0.2 }, 1.6);
    tl.to("#x-cursor", { x: 1520, y: 920, duration: 0.75, ease: "power2.inOut" }, 1.65);
    tl.to("#x-zoom", { scale: 2.2, x: -150, y: -300, duration: 0.7, ease: "power2.inOut" }, 2.0);
    tl.to("#x-title", { opacity: 0, duration: 0.3 }, 2.0);
    tl.to("#x-cursor", { scale: 0.82, duration: 0.07, ease: "power2.in" }, 2.75);
    tl.to("#x-cursor", { scale: 1, duration: 0.16, ease: "back.out(3)" }, 2.82);
    tl.to("#x-btn", { scale: 0.96, duration: 0.07 }, 2.75);
    tl.to("#x-btn", { scale: 1, duration: 0.16, ease: "back.out(3)" }, 2.82);
    tl.to("#x-b1", { opacity: 0, duration: 0.12 }, 2.85);
    tl.to("#x-b2", { opacity: 1, duration: 0.15 }, 2.9);

    // sparks: a seeded generator keeps every render identical
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
    const COLORS = ["#ffd56a", "#ffb23e", "#f7862e", "#ef6a1c", "#fff3d1", "#ff8a5c"];
    const fx = document.getElementById("x-fx");
    const ORIGIN = { x: 1360, y: 615 }; // the button, on screen after the push-in
    const sparks = Array.from({ length: 90 }, () => {
      const el = document.createElement("i");
      fx.append(el);
      const ang = rnd() * Math.PI * 2;
      const speed = 500 + rnd() * 1300;
      const len = 18 + rnd() * 34;
      el.style.width = `${len}px`;
      el.style.background = `linear-gradient(90deg, rgba(255,255,255,0), ${COLORS[Math.floor(rnd() * COLORS.length)]})`;
      el.style.boxShadow = "0 0 10px rgba(255, 170, 60, 0.6)";
      return { el, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed - 250, len, delay: rnd() * 0.12, life: 0.9 + rnd() * 0.5 };
    });
    const BURST = 2.85;
    const clock = { t: 0 };
    tl.fromTo(
      clock,
      { t: 0 },
      {
        t: D,
        duration: D,
        ease: "none",
        onUpdate: () => {
          sparks.forEach((p) => {
            const a = clock.t - BURST - p.delay;
            if (a <= 0) {
              p.el.style.opacity = 0;
              return;
            }
            const drag = 1 - Math.exp(-2.2 * a); // air slows the spark
            const x = ORIGIN.x + (p.vx / 2.2) * drag;
            const y = ORIGIN.y + (p.vy / 2.2) * drag + 420 * a * a; // gravity
            const vx = p.vx * Math.exp(-2.2 * a);
            const vy = p.vy * Math.exp(-2.2 * a) + 840 * a;
            const rot = (Math.atan2(vy, vx) * 180) / Math.PI;
            const fade = Math.max(0, 1 - a / p.life);
            p.el.style.opacity = fade;
            p.el.style.transform = `translate(${x - p.len}px, ${y}px) rotate(${rot}deg)`;
            p.el.style.transformOrigin = "100% 50%";
          });
        },
      },
      0,
    );

    window.__timelines["export"] = tl;
  </script>

  <style>

      font-family: "DM Sans";

  <div id="root" data-composition-id="answer" data-width="1920" data-height="1080">
    <div id="n-cam" data-layout-allow-overflow data-layout-allow-overlap>
      <div id="n-stage">
        <div class="n-msg me" id="n-q" style="right: 160px; top: 270px">
          <img class="n-me" src="assets/images/fb-02.png" alt="" />
          <div class="n-bub">Hey Spark, why does this transition feel cheap?</div>
        </div>
        <div class="n-msg" id="n-a" style="left: 150px; top: 520px">
          <div class="n-ball"><b id="n-swirl"></b><b class="n-glass"></b></div>
          <div class="n-bub" id="n-text">The ease is linear and everything enters at once. Try <code>power3.out</code> with an 80 ms stagger. Want me to apply it?</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });

    // shot 18: the sent question arrives small in the distance and the camera closes in on it;
    // Spark's answer grows out of its sphere and its words come into focus one by one
    tl.fromTo("#n-stage", { scale: 0.32, x: 120, y: -60 }, { scale: 1, x: 0, y: 0, duration: 0.7, ease: "power3.out" }, 0);
    tl.fromTo("#n-stage", { rotationY: 0, rotationZ: 0 }, { rotationY: 8, rotationZ: -1.5, duration: 1.75, ease: "sine.inOut" }, 0);

    tl.fromTo("#n-a", { opacity: 0, scale: 0.45, y: 60 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.62);
    tl.fromTo("#n-swirl", { rotation: 0 }, { rotation: 160, duration: 1.75, ease: "none" }, 0);

    // split the answer into words (keeping the code span whole) and bring each into focus
    const box = document.getElementById("n-text");
    const parts = [];
    [...box.childNodes].forEach((node) => {
      if (node.nodeType === 3) {
        node.textContent.split(/(\s+)/).forEach((w) => {
          if (!w) return;
          if (/^\s+$/.test(w)) parts.push(document.createTextNode(w));
          else {
            const s = document.createElement("i");
            s.textContent = w;
            parts.push(s);
          }
        });
      } else parts.push(node);
    });
    box.textContent = "";
    parts.forEach((p) => box.append(p));
    const words = parts.filter((p) => p.nodeType === 1);
    words.forEach((w, i) => {
      const t = 0.72 + i * 0.024;
      const isCode = w.tagName === "CODE";
      tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, t);
      // plain words land warm and cool to ink; the code keeps its own colour
      if (!isCode) tl.fromTo(w, { color: "#f7a23a" }, { color: "#1b1d22", duration: 0.22, ease: "none" }, t + 0.12);
    });

    window.__timelines["answer"] = tl;
  </script>

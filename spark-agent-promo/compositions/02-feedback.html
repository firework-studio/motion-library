  <script>
    const tl = gsap.timeline({ paused: true });

    // shot 2: the frame resolves out of the previous blur onto a wall of feedback
    tl.to("#root", { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 0); // the blurred wall shows through as this fades up
    // the panel rises up into the middle of the frame, flat and a little large
    tl.fromTo("#f-group", { opacity: 0, x: 330, y: 300, scale: 1.12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.05);
    // its people slide up into place one after another, in a staggered order
    gsap.utils.toArray(".f-chip").forEach((el, i) => {
      const order = i; // row by row, left to right
      tl.fromTo(el, { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.25 + order * 0.09);
    });
    // then it settles to the left and turns into perspective as the title arrives
    tl.to("#f-group", { x: 0, scale: 1, duration: 0.7, ease: "power3.inOut" }, 0.75);
    tl.fromTo("#f-group .f-panel", { rotationY: 0, rotationX: 0, rotationZ: 0 }, { rotationY: 16, rotationX: 8, rotationZ: -1, duration: 0.7, ease: "power3.inOut" }, 0.75);
    // lines flip up one by one; with `drift`, they land a little apart and then ease together
    // over the given [start, duration], in step with the chart floating up below them
    const flipIn = (sel, t, drift) =>
      gsap.utils.toArray(sel + " .f-ln").forEach((el, i) => {
        if (!drift) {
          tl.fromTo(el, { opacity: 0, y: 50, rotationX: -80 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.85, ease: "expo.out" }, t + i * 0.22);
          return;
        }
        // flip and fade quickly, but rise on the chart's own long curve: the lower line starts
        // further down, so the two close up exactly as the chart floats into place
        tl.fromTo(el, { opacity: 0, rotationX: -80 }, { opacity: 1, rotationX: 0, duration: 0.85, ease: "expo.out" }, t + i * 0.22);
        tl.fromTo(el, { y: i ? 120 : 70 }, { y: 0, duration: drift, ease: "power2.out" }, t);
      });
    flipIn("#f-t1", 1.15);
    tl.fromTo("#f-cam", { x: 0 }, { x: -60, duration: 3.6, ease: "none" }, 0);

    // shot 3: the group rises out of the way and softens, the revenue-style bar chart rises below
    // the first title drifts up and fades away, line by line
    gsap.utils.toArray("#f-t1 .f-ln").forEach((el, i) => tl.to(el, { y: -50, opacity: 0, duration: 0.32, ease: "power2.in" }, 2.95 + i * 0.06));
    tl.to("#f-group", { x: -130, y: -170, scale: 0.9, filter: "blur(4px)", duration: 0.6, ease: "power3.inOut" }, 3.20);
    tl.to("#f-group .f-panel", { rotationY: 24, rotationX: 14, rotationZ: -2, duration: 0.6, ease: "power3.inOut" }, 3.20);
    // the new title flips up line by line together with the chart coming up from below
    flipIn("#f-t2", 3.30, 2.6); // rises on the same curve as the chart
    // the chart floats up slowly from below and keeps hovering upward until the cut
    tl.fromTo("#f-chart", { y: 320 }, { y: 0, duration: 2.6, ease: "power2.out" }, 3.30);
    tl.fromTo("#f-chart", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 3.30);
    // the bars never sit still: every bar wanders on slow waves of its own and settles into the final
    // profile, while the total counts up
    const bars = gsap.utils.toArray(".f-bar");
    const FINAL = [0.86, 0.9, 0.88, 0.78, 0.84, 0.88, 0.82, 0.96, 0.86, 0.8, 0.84, 0.62, 0.6, 0.64, 0.66, 0.62, 0.66, 0.58, 0.56, 0.52, 0.56, 0.44, 0.46, 0.42];
    const wobble = (i, t) => 0.5 + 0.28 * Math.sin(2.1 * t + i * 0.9) + 0.16 * Math.sin(3.7 * t + i * 2.3);
    const barClock = { t: 0 };
    tl.fromTo(
      barClock,
      { t: 0 },
      {
        t: 2.8,
        duration: 2.8,
        ease: "none",
        onUpdate: () => {
          const t = barClock.t;
          const grow = gsap.parseEase("power2.out")(Math.min(1, t / 0.6)); // bars rise out of the axis
          const settle = gsap.parseEase("sine.inOut")(Math.min(1, Math.max(0, (t - 0.4) / 2.2))); // live data calms to the final shape
          bars.forEach((b, i) => {
            const h = wobble(i, t) * (1 - settle) + FINAL[i] * settle;
            b.style.height = `${(Math.max(0.04, h * grow) * 100).toFixed(2)}%`; // height, not scale, keeps the round caps
          });
        },
      },
      3.4,
    );
    const n = { v: 0 };
    tl.fromTo(n, { v: 0 }, { v: 248.6, duration: 2.6, ease: "power1.out", onUpdate: () => (document.querySelector("#f-num").textContent = `${n.v.toFixed(1)}K`) }, 3.5);
    tl.to("#f-cam", { x: -260, duration: 1.9, ease: "sine.inOut" }, 3.20);
    // exit: everything is pushed out to the left along the cards' lean, the cards a beat faster
    tl.to("#f-cam", { x: -1500, duration: 0.42, ease: "power3.in" }, 5.12);
    tl.to(["#f-group", "#f-chart"], { xPercent: -22, duration: 0.42, ease: "power3.in" }, 5.12);
    tl.to("#f-cam", { filter: "blur(6px)", duration: 0.2, ease: "power1.in" }, 5.34);

    window.__timelines["feedback"] = tl;
  </script>

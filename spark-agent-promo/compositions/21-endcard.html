    const tl = gsap.timeline({ paused: true });

    // shot 23: the mark turns in out of its glow and settles sharp; the letters arrive out of

    // Launch. and lands on Motion, by Example.; the studio credit sits quietly at the bottom
    tl.fromTo("#root", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 0);
    tl.fromTo("#e-mark", { scale: 0.6, rotation: -60, filter: "blur(14px)" }, { scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.9, ease: "power3.out" }, 0.1);

    const letters = gsap.utils.toArray("#e-word span");
    [2, 3, 1, 4, 0].forEach((k, n) => {
      tl.fromTo(letters[k], { opacity: 0, x: -30, scale: 0.7 }, { opacity: 1, x: k * 30, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 0.35 + n * 0.09);
      tl.to(letters[k], { x: 0, duration: 0.6, ease: "power2.inOut" }, 0.9);
    });
    tl.fromTo("#e-by", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.6);

    const tags = gsap.utils.toArray("#e-tag > span");
    tags.forEach((el, i) => {
      const t = [1.25, 2.0, 2.75, 3.65][i]; // on the words of the voiceover
      tl.fromTo(el, { opacity: 0, y: 18, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, t);
      if (i < tags.length - 1) tl.to(el, { opacity: 0, y: -14, filter: "blur(6px)", duration: 0.2, ease: "power1.in" }, t + 0.55);
    });

    tl.fromTo("#e-all", { scale: 1 }, { scale: 1.025, duration: 6.6, ease: "none" }, 0);

    window.__timelines["endcard"] = tl;

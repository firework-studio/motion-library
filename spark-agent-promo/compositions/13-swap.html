  <script>
    const tl = gsap.timeline({ paused: true });

    // shot 15: the board pushes in from the right as the close-up leaves; the "Card vortex" block
    // lifts off its row, glides down onto the Product row and replaces the hard cut there; then the
    // board turns into perspective and the camera leans in
    tl.fromTo("#w-scene", { x: 1100 }, { x: 0, duration: 0.6, ease: "power3.out" }, 0);

    // lift, carry, drop: the lifted block casts a long warm shadow
    tl.to("#w-move", { x: 34, y: -64, scale: 1.04, boxShadow: "0 22px 30px -8px rgba(239, 106, 28, 0.45)", duration: 0.2, ease: "power2.out" }, 0.3);
    tl.to("#w-move", { x: 244, y: 172, duration: 0.4, ease: "power2.inOut" }, 0.7);
    tl.to("#w-old", { opacity: 0, duration: 0.15, ease: "power1.in" }, 0.78); // gone before the new block arrives
    tl.to("#w-move", { scale: 1, boxShadow: "0 0 0 rgba(239, 106, 28, 0)", duration: 0.2, ease: "power2.in" }, 1.05);

    // drag trail: the block is pulled up out of its slot, and a soft shape joins the block to the
    // slot it came from, strongest at the block and fading out toward the slot; it stretches as the
    // block is carried away and fades once the block lands
    const move = document.getElementById("w-move");
    const poly = document.getElementById("w-trail-p");
    const grad = document.getElementById("w-trail-g");
    const SLOT = { x: 530, y: 77, w: 400, h: 60 };
    const hull = (pts) => {
      pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
      const half = (list) => {
        const out = [];
        for (const p of list) {
          while (out.length >= 2 && cross(out[out.length - 2], out[out.length - 1], p) <= 0) out.pop();
          out.push(p);
        }
        return out.slice(0, -1);
      };
      return half(pts).concat(half(pts.slice().reverse()));
    };
    const corners = (r) => [[r.x, r.y], [r.x + r.w, r.y], [r.x + r.w, r.y + r.h], [r.x, r.y + r.h]];
    const clamp01 = (v) => Math.min(1, Math.max(0, v));
    // runs after every tween on this timeline has updated, so it is right on any frame
    tl.eventCallback("onUpdate", () => {
      const t = tl.time();
      const a = clamp01((t - 0.3) / 0.12) * (1 - clamp01((t - 1.0) / 0.2));
      poly.style.opacity = a;
      if (a <= 0) return;
      const x = gsap.getProperty(move, "x");
      const y = gsap.getProperty(move, "y");
      const sc = gsap.getProperty(move, "scale");
      const cur = { x: SLOT.x + x - (SLOT.w * (sc - 1)) / 2, y: SLOT.y + y - (SLOT.h * (sc - 1)) / 2, w: SLOT.w * sc, h: SLOT.h * sc };
      poly.setAttribute("points", hull(corners(SLOT).concat(corners(cur))).map((p) => p.join(",")).join(" "));
      // shade from the slot's lower-left corner (clear) to the block's far corner (strongest)
      grad.setAttribute("x1", SLOT.x);
      grad.setAttribute("y1", SLOT.y + SLOT.h);
      grad.setAttribute("x2", cur.x + cur.w * 0.75 + 0.01);
      grad.setAttribute("y2", cur.y + 0.01);
    });

    // the board turns into perspective as the camera leans in; the title steps aside
    tl.to("#w-board", { rotationY: 18, rotationX: 10, rotationZ: -3, scale: 1.25, duration: 0.85, ease: "power2.inOut" }, 1.0);
    tl.to("#w-title", { opacity: 0, y: -20, duration: 0.3, ease: "power1.in" }, 1.05);

    window.__timelines["swap"] = tl;
  </script>

  <script>
    const tl = gsap.timeline({ paused: true });

    // shot 12, one thing at a time: the backdrop clears, the timeline card settles in under its
    // title; comment pins travel along their tracks to where they land; the title changes and
    // a soft orange wave runs through its letters; the first comment reaches the playhead, the
    // ring turns green and the fix is noted, while the camera pushes into that spot
    tl.fromTo("#root", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 0);
    tl.fromTo("#k-card", { opacity: 0, y: 30, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power2.out" }, 0.15);
    tl.fromTo("#k-t1", { opacity: 0, color: "#9a9ea8" }, { opacity: 1, color: "#1b1d22", duration: 0.4, ease: "power1.out" }, 0.2);

    // pins: [id, trail id, start x (card px), end x, start time, duration]
    const pins = [
      ["#k-p1", "#k-tr1", 1150, 640, 0.3, 1.9],
      ["#k-p2", "#k-tr2", 1330, 980, 0.35, 1.6],
      ["#k-p3", "#k-tr3", 200, 420, 0.4, 1.5],
      ["#k-p4", "#k-tr4", 1360, 1120, 0.45, 1.4],
    ];
    pins.forEach(([pin, trail, from, to, t, d]) => {
      const dx = from - to;
      tl.fromTo(pin, { x: dx, opacity: 0 }, { x: 0, opacity: 1, duration: d, ease: "power1.inOut" }, t);
      // the trail always runs from the start point to the pin
      const left = Math.min(from, to);
      tl.set(trail, { left, width: 0 }, 0);
      if (from > to) tl.fromTo(trail, { x: dx, width: 0 }, { x: 0, width: dx, duration: d, ease: "power1.inOut" }, t);
      else tl.fromTo(trail, { width: 0 }, { width: -dx, duration: d, ease: "power1.inOut" }, t);
    });

    // title change with an orange wave through the letters
    const t2 = document.getElementById("k-t2");
    const letters = [..."Spark Fixes Them One by One"].map((c) => {
      const s = document.createElement("i");
      s.textContent = c;
      t2.append(s);
      return s;
    });
    tl.to("#k-t1", { opacity: 0, y: -14, duration: 0.25, ease: "power1.in" }, 1.1);
    tl.fromTo("#k-t2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 1.25);
    letters.forEach((s, i) => {
      tl.fromTo(s, { color: "#1b1d22" }, { keyframes: [{ color: "#f26a1b", duration: 0.12 }, { color: "#1b1d22", duration: 0.3 }], ease: "none" }, 1.4 + i * 0.025);
    });

    // the first comment arrives: the ring turns green and the fix is noted
    tl.to("#k-ring", { backgroundColor: "rgba(60, 200, 110, 0.35)", boxShadow: "0 0 0 3px rgba(34, 170, 90, 0.9)", duration: 0.25, ease: "power1.inOut" }, 2.2);
    tl.fromTo("#k-ring", { scale: 1 }, { keyframes: [{ scale: 1.08, duration: 0.15 }, { scale: 1, duration: 0.3 }], ease: "sine.inOut" }, 2.2);
    tl.fromTo("#k-fixed", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 2.35);

    // camera pushes into the ring; the title steps aside
    tl.to("#k-title", { opacity: 0, duration: 0.3, ease: "power1.in" }, 2.0);
    tl.to("#k-card", { scale: 1.75, y: 120, duration: 1.3, ease: "power2.inOut" }, 2.0);

    window.__timelines["comments"] = tl;
  </script>

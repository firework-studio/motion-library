  <script>
    const tl = gsap.timeline({ paused: true });

    // shot 5: the lockup holds still in the centre. The mark turns in where it sits, out of a soft
    // blur and a small warm glow; then the letters slide out from behind it in reading order and
    // land straight in place; the whole lockup eases back very slightly while it holds
    tl.fromTo("#b-mark-wrap", { scale: 0.7, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.8, ease: "power3.out" }, 0.0);
    tl.fromTo("#b-mark", { opacity: 0, filter: "blur(14px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power2.out" }, 0.0);
    tl.fromTo("#b-glow", { opacity: 0.8, scale: 0.9 }, { opacity: 0, scale: 1.15, duration: 0.9, ease: "power1.out" }, 0.05);
    const letters = gsap.utils.toArray("#b-word span");
    letters.forEach((el, i) => {
      tl.fromTo(
        el,
        { opacity: 0, x: -26, filter: "blur(6px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" },
        0.35 + i * 0.06,
      );
    });
    tl.fromTo("#b-logo", { scale: 1 }, { scale: 0.97, duration: 1.25, ease: "sine.inOut" }, 0.35); // ends as the move takes over

    // shot 6: the lockup settles on the left and stays put; the tagline flips up below it; the page
    // and the wide panel above it slide in from the right and then drift up together
    // the lockup clears to the left first, so the page never slides in underneath it
    // long enough that no frame jumps too far: about 60 px per frame at the fastest
    tl.to("#b-logo", { x: -540, y: -115, scale: 0.5, duration: 0.85, ease: "power2.inOut" }, 1.6);
    gsap.utils.toArray("#b-tag .f-ln").forEach((el, i) => {
      tl.fromTo(el, { opacity: 0, y: 46, rotationX: -80 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.7, ease: "expo.out" }, 2.25 + i * 0.16);
    });
    tl.fromTo("#b-by", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.6);
    tl.fromTo("#b-app", { x: 900, rotationY: -22, opacity: 0 }, { x: 0, rotationY: -10, opacity: 1, duration: 1.0, ease: "power3.out" }, 2.2);
    tl.fromTo("#b-float", { x: 700, rotationY: -22, opacity: 0 }, { x: 0, rotationY: -10, opacity: 1, duration: 1.0, ease: "power3.out" }, 2.3);
    // the drift lives on the wrapper so it never fights the slide-in tweens on the same properties

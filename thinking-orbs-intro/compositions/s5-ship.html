  <script src="assets/lib/thinking-orbs-engine.js"></script>

  <script src="assets/lib/film.js"></script>
  <script src="assets/lib/captions.js"></script>
  <script>
    (function () {
      const O = window.OrbView;
      // scene time 0 is film time 28.9; constants below are film time, converted with T()
      const START = 28.9, DURATION = 11.3;
      const T = (film) => film - START;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const lerp = (a, b, k) => a + (b - a) * k;
      const easeInOut = (x) => { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

      // the first lines of the project's own LICENSE, typed out while "The whole set is MIT licensed" plays
      const BODY = [
        "Permission is hereby granted, free of charge, to any person obtaining a copy",
        "of this software and associated documentation files (the \"Software\"), to deal",
        "in the Software without restriction, including without limitation the rights",
        "to use, copy, modify, merge, publish, distribute, sublicense, and/or sell",
      ].join("\n");
      const TYPE = { from: 29.3, to: 31.0 };
      const body = document.getElementById("s5-body");

      // the Ship button is clicked on "ship"
      const CLICK = 31.68;
      const btn = document.getElementById("s5-btn");
      const buildCtx = O.fit(document.querySelector("#s5-build canvas"), 56, 56);
      const cardCtx = O.fit(document.getElementById("s5-card-orb"), 120, 120);
      const END_CARD = "#s5-card";
      const cursor = document.getElementById("s5-cursor");
      // the button is the last of three items in a centred row: 400 + 16 + price + 16 + 220
      const BTN_AT = { x: 1270, y: 676 }, CUR_FROM = { x: 1500, y: 960 };

      function render(t) {
        const n = Math.round(BODY.length * clamp((t - TYPE.from) / (TYPE.to - TYPE.from), 0, 1));
        body.textContent = BODY.slice(0, n);
        // ship row
        O.clear(buildCtx);
        O.drawState(buildCtx, "working", t, 56, 28, 28, 1);
        const shipped = clamp((t - CLICK) / 0.2, 0, 1);
        btn.style.background = `rgb(${Math.round(lerp(242, 38, shipped))},${Math.round(lerp(242, 38, shipped))},${Math.round(lerp(242, 38, shipped))})`;
        document.getElementById("s5-btn-a").style.color = "#111111";
        document.getElementById("s5-btn-a").style.opacity = 1 - shipped;
        document.getElementById("s5-btn-b").style.color = "#ededed";
        document.getElementById("s5-btn-b").style.opacity = shipped;
        document.getElementById("s5-build-a").style.opacity = 1 - shipped;
        document.getElementById("s5-build-b").style.opacity = shipped;
        const k = easeInOut((t - 31.2) / (CLICK - 0.08 - 31.2));
        const press = t >= CLICK && t < CLICK + 0.12 ? 0.85 : 1;
        cursor.style.transform = `translate(${lerp(CUR_FROM.x, BTN_AT.x, k)}px, ${lerp(CUR_FROM.y, BTN_AT.y, k)}px) scale(${press})`;
        cursor.style.opacity = clamp((t - 31.2) / 0.2, 0, 1) * (1 - clamp((t - 32.4) / 0.25, 0, 1));
        // the closing card's orb
        O.clear(cardCtx);
        O.drawState(cardCtx, "searching", t, 120, 60, 60, 1);
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: DURATION, duration: DURATION, ease: "none", onUpdate: () => render(START + clock.t) }, 0);
      tl.fromTo("#s5-license", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: true }, T(29.02));
      tl.fromTo("#s5-shiprow", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: true }, T(31.2));
      tl.fromTo("#s5-perm", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: true }, T(33.0));
      tl.fromTo("#s5-strike", { width: 0 }, { width: "calc(100% + 8px)", duration: 0.35, ease: "power2.inOut", immediateRender: true }, T(33.27));
      tl.fromTo("#s5-needed", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out", immediateRender: true }, T(33.66));
      // everything clears for the repo card on "The repo's on screen"
      tl.to(["#s5-license", "#s5-shiprow", "#s5-perm"], { opacity: 0, y: -16, duration: 0.3, ease: "power2.in", stagger: 0.04 }, T(34.3));
      tl.fromTo(END_CARD, { opacity: 0, y: 24, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out", immediateRender: true }, T(34.75));
      tl.fromTo("#s5-by", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: true }, T(35.3));

      const caps = document.getElementById("s5-caps");
      if (FILM.lang === "en") {
        window.Captions.build(caps, tl, [
          { lines: [[77, 80]], shown: true },
          { lines: [[81, 83], [84, 86]], pills: [[85, 85]] },
          { lines: [[87, 91], [92, 95]], pills: [[90, 90]] },
          { lines: [[96, 98]] },
          { lines: [[99, 102]], pills: [[100, 100]] },
          { lines: [[103, 104], [105, 106]] },
        ], { offset: START });
      }
      FILM.localize(document);
      render(START);
      FILM.scene("s5-ship", tl, START, DURATION);
    })();
  </script>

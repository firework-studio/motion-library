<template>
  <style>

    /* captions */

  </style>
  <div id="root" data-composition-id="s4-light" data-width="1920" data-height="1080">
    <div id="s4-fps"><b id="s4-num">0</b><span>fps</span></div>
    <svg id="s4-graph" viewBox="0 0 1920 1080">
      <path id="s4-line" fill="none" stroke="#e8e8e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
      <circle id="s4-head" r="7" fill="#f5f5f5"></circle>
    </svg>
    <div id="s4-chips"><span>canvas 2D</span><span>no WebGL</span><span>no filters</span><span>DPR × 2</span><span>pauses offscreen</span><span>one shared clock</span></div>
    <canvas id="s4-row"></canvas>
    <div id="s4-rm"><span>Reduce motion</span><div id="s4-switch"><div id="s4-knob"></div></div></div>
    <div id="s4-rm-tags"><span>prefers-reduced-motion: reduce</span><span>static frame</span></div>
    <svg id="s4-cursor" viewBox="0 0 24 24">
      <path d="M4 2 L4 19 L8.6 14.9 L11.6 21.6 L14.6 20.3 L11.6 13.7 L17.8 13.7 Z" fill="#f5f5f5" stroke="#111111" stroke-width="1.4" stroke-linejoin="round" />
    </svg>
    <div id="s4-caps"></div>
  </div>
  <script src="assets/lib/thinking-orbs-engine.js"></script>
  <script src="assets/lib/orb-view.js"></script>
  <script src="assets/data/vo-words.js"></script>
  <script src="assets/lib/film.js"></script>
  <script src="assets/lib/captions.js"></script>
  <script>
    (function () {
      const O = window.OrbView;
      // scene time 0 is film time 22.3; constants below are film time, converted with T()
      const START = 22.3, DURATION = 6.6;
      const T = (film) => film - START;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const lerp = (a, b, k) => a + (b - a) * k;
      const easeOut = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
      const easeInOut = (x) => { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

      const STATES = ["working", "searching", "solving", "listening", "connecting", "weaving", "composing", "breathing", "shaping"];
      // the switch is clicked on "reduced"; from then on every orb holds the component's own reduced-motion frame (engine time 0.6)
      const CLICK = 26.97, STATIC_FRAME = 0.6;

      // ---------- the frame-time line: drawn left to right, flat at 60 fps with a faint jitter ----------
      const LINE = { x0: 460, x1: 1460, y: 575, from: 22.55, to: 24.3 };
      const lineY = (x) => LINE.y + Math.sin(x * 0.045) * 2.2 + Math.sin(x * 0.11 + 1.3) * 1.4;
      const line = document.getElementById("s4-line"), head = document.getElementById("s4-head");
      function drawLine(t) {
        const k = easeInOut((t - LINE.from) / (LINE.to - LINE.from));
        if (k <= 0) { line.setAttribute("d", ""); head.setAttribute("opacity", 0); return; }
        const xe = lerp(LINE.x0, LINE.x1, k);
        let d = `M ${LINE.x0} ${lineY(LINE.x0).toFixed(2)}`;
        for (let x = LINE.x0 + 6; x < xe; x += 6) d += ` L ${x} ${lineY(x).toFixed(2)}`;
        d += ` L ${xe.toFixed(2)} ${lineY(xe).toFixed(2)}`;
        line.setAttribute("d", d);
        head.setAttribute("cx", xe); head.setAttribute("cy", lineY(xe)); head.setAttribute("opacity", 1);
      }

      // ---------- nine orbs in a row ----------
      const ROW = { y: 760, size: 84, gap: 120 };
      const row = document.getElementById("s4-row"), rctx = O.fit(row, 1920, 1080);
      const num = document.getElementById("s4-num");
      const cursor = document.getElementById("s4-cursor"), knob = document.getElementById("s4-knob"), sw = document.getElementById("s4-switch");
      // the switch sits at the right end of the 520 px bar centred at x 960
      const SWITCH = { x: 960 + 260 - 22 - 44, y: 860 + 42 };
      const CUR_FROM = { x: 1380, y: 1010 };

      function render(t) {
        drawLine(t);
        num.textContent = String(Math.round(60 * easeOut((t - 22.6) / 0.8)));
        O.clear(rctx);
        const reduce = clamp((t - CLICK) / 0.15, 0, 1);
        STATES.forEach((s, i) => {
          const x = 960 + (i - 4) * ROW.gap;
          const a = clamp((t - (24.29 + i * 0.05)) / 0.3, 0, 1);
          // live until the click, then the component's static reduced-motion frame
          O.drawState(rctx, s, t, ROW.size, x, ROW.y, a * (1 - reduce));
          O.drawState(rctx, s, t, ROW.size, x, ROW.y, a * reduce, STATIC_FRAME);
        });
        // cursor glides to the switch and clicks it on "reduced"
        const k = easeInOut((t - 26.3) / (CLICK - 0.08 - 26.3));
        const press = t >= CLICK && t < CLICK + 0.12 ? 0.85 : 1;
        cursor.style.transform = `translate(${lerp(CUR_FROM.x, SWITCH.x, k)}px, ${lerp(CUR_FROM.y, SWITCH.y, k)}px) scale(${press})`;
        cursor.style.opacity = clamp((t - 26.25) / 0.2, 0, 1) * (1 - clamp((t - 27.8) / 0.25, 0, 1));
        const on = easeInOut((t - CLICK) / 0.22);
        knob.style.transform = `translateX(${40 * on}px)`;
        sw.style.background = `rgb(${Math.round(lerp(58, 235, on))},${Math.round(lerp(58, 235, on))},${Math.round(lerp(58, 235, on))})`;
        knob.style.background = on > 0.5 ? "#111111" : "#f5f5f5";
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: DURATION, duration: DURATION, ease: "none", onUpdate: () => render(START + clock.t) }, 0);
      tl.fromTo("#s4-fps", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: true }, T(22.5));
      // the six facts come in on "2D canvas"
      tl.fromTo("#s4-chips span", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", stagger: 0.12, immediateRender: true }, T(23.27));
      tl.fromTo("#s4-rm", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: true }, T(26.2));
      tl.fromTo("#s4-rm-tags span", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", stagger: 0.1, immediateRender: true }, T(27.32));
      // everything steps aside before "The whole set"
      tl.to(["#s4-fps", "#s4-graph", "#s4-chips", "#s4-row", "#s4-rm", "#s4-rm-tags"], { opacity: 0, y: -16, duration: 0.3, ease: "power2.in", stagger: 0.03 }, T(28.6));

      const caps = document.getElementById("s4-caps");
      if (FILM.lang === "en") {
        window.Captions.build(caps, tl, [
          { lines: [[56, 58], [59, 61]], shown: true },
          { lines: [[62, 64], [65, 65]], pills: [[65, 65]] },
          { lines: [[66, 68], [69, 71]] },
          { lines: [[72, 74], [75, 76]], pills: [[75, 76]] },
          { lines: [[77, 80]] },
        ], { offset: START });
      }
      FILM.localize(document);
      render(START);
      FILM.scene("s4-light", tl, START, DURATION);
    })();
  </script>

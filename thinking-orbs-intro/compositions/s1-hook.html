  <script>
    (function () {
      const O = window.OrbView;
      const DURATION = 7.6;
      const W = 1920, H = 1080;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const ease = (x) => { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

      // ---------- the centre orb: one state per beat of the voiceover ----------
      // the shaping state is steered so its outline turns from circle to triangle on "open source"
      const morphTime = (t) => (t < 3.6 ? 0.5 + (t - 3.0) * 1.5 : t < 4.15 ? 1.4 + ((t - 3.6) / 0.55) * 0.9 : 2.3 + (t - 4.15) * 0.8);
      const SCHEDULE = [
        { at: 0.2, state: "searching" },
        { at: 0.5, state: "listening" },
        { at: 0.86, state: "weaving" },
        { at: 1.31, state: "connecting" },
        { at: 1.95, state: "solving" },
        { at: 2.63, state: "searching" },
        { at: 3.0, state: "shaping", time: morphTime },
        { at: 4.9, state: "composing" },
        { at: 5.45, state: "searching" },
      ];
      const stage = document.getElementById("s1-stage");
      const sctx = O.fit(stage, W, H);
      // the orb holds the middle, then moves left and shrinks to make room for the title
      const orbBox = (t) => {
        const k = ease((t - 5.2) / 0.55);
        return { cx: 960 - 340 * k, cy: 610 + 30 * k, size: 520 - 80 * k };
      };
      const grow = (t) => 0.85 + 0.15 * ease((t - 0.2) / 0.35);
      const appear = (t) => clamp((t - 0.2) / 0.2, 0, 1);

      const chips = [0, 1, 2, 3].map((i) => {
        const el = document.getElementById("s1-chip-" + i);
        return { ctx: O.fit(el.querySelector("canvas"), 64, 64), state: ["working", "searching", "listening", "solving"][i] };
      });

      function render(t) {
        O.clear(sctx);
        const box = orbBox(t), s = box.size * grow(t);
        for (const { s: st, a } of O.scheduleAt(SCHEDULE, t)) {
          O.drawState(sctx, st.state, t, s, box.cx, box.cy, a * appear(t), st.time ? st.time(t) : undefined);
        }
        for (const c of chips) {
          O.clear(c.ctx);
          O.drawState(c.ctx, c.state, t, 64, 32, 32, 1);
        }
      }

      // ---------- title: typed one letter at a time on "Thinking Orbs" ----------
      const title = document.getElementById("s1-title");
      const letters = "Thinking orbs".split("").map((ch) => {
        const i = document.createElement("i");
        i.textContent = ch === " " ? " " : ch;
        title.appendChild(i);
        return i;
      });

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: DURATION, duration: DURATION, ease: "none", onUpdate: () => render(clock.t) }, 0);
      // the four corner states come in on "every", and clear with the repo card before the title
      [0, 1, 2, 3].forEach((i) => {
        tl.fromTo("#s1-chip-" + i, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: true }, 1.93 + i * 0.08);
        tl.to("#s1-chip-" + i, { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" }, 4.85 + i * 0.03);
      });
      tl.fromTo("#s1-repo", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: true }, 3.9);
      tl.to("#s1-repo", { opacity: 0, y: -10, duration: 0.25, ease: "power2.in" }, 5.2);
      letters.forEach((el, i) => tl.to(el, { opacity: 1, duration: 0.05, ease: "none" }, 5.94 + i * 0.045));
      tl.fromTo("#s1-sub", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: true }, 6.45);
      tl.fromTo("#s1-tags span", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", stagger: 0.1, immediateRender: true }, 6.7);

      const caps = document.getElementById("s1-caps");
      if (FILM.lang === "en") {
        window.Captions.build(caps, tl, [
          { lines: [[0, 2], [3, 5]] },
          { lines: [[6, 8], [9, 11]], pills: [[8, 8]] },
          { lines: [[12, 13], [14, 15]], pills: [[14, 15]] },
          { lines: [[16, 16], [17, 18]], pills: [[17, 18]] },
        ]);
      }
      FILM.localize(document);
      render(0);
      FILM.scene("s1-hook", tl, 0, DURATION);
    })();
  </script>

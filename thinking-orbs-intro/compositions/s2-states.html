  <script src="assets/lib/thinking-orbs-engine.js"></script>

  <script>
    (function () {
      const O = window.OrbView;
      // scene time 0 is film time 7.6; every constant below is film time, converted with T()
      const START = 7.6, DURATION = 7.25;
      const T = (film) => film - START;
      const W = 1920, H = 1080;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const lerp = (a, b, k) => a + (b - a) * k;
      const easeOut = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
      const easeInOut = (x) => { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

      const STATES = ["working", "searching", "solving", "listening", "connecting", "weaving", "composing", "breathing", "shaping"];
      const SEED = 1; // "searching" is the title orb that splits into the nine
      const TITLE_ORB = { x: 620, y: 640, size: 440 };

      // ---------- where each orb is ----------
      // 1. the title orb bursts into a ring of nine on "nine"; each orb flies out in the direction of its grid cell
      // 2. the ring settles into a 3x3 grid on "states", every orb moving straight out to its cell
      // 3. while "one for every moment ..." plays, the outer eight step one cell clockwise, twice; the centre holds
      // 4. on "ready" the grid tightens and slides left to make room for the two cards
      const EXIT = 14.45;
      const SPLIT = [7.72, 8.42], GRID = [8.55, 9.1], TURNS = [10.0, 11.0], TURN_LEN = 0.5, TIGHT = [12.19, 12.75];
      const RIM = [0, 1, 2, 5, 8, 7, 6, 3]; // the outer cells, clockwise from the top left
      const grid = (t) => {
        const k = easeInOut((t - TIGHT[0]) / (TIGHT[1] - TIGHT[0]));
        return { cx: lerp(960, 560, k), cy: lerp(640, 650, k), sx: lerp(330, 250, k), sy: lerp(250, 215, k), size: lerp(170, 140, k) };
      };
      const cellPos = (c, g) => ({ x: g.cx + ((c % 3) - 1) * g.sx, y: g.cy + (Math.floor(c / 3) - 1) * g.sy });
      const turned = (t) => TURNS.reduce((s, at) => s + easeInOut((t - at) / TURN_LEN), 0);
      function gridPos(i, t) {
        const g = grid(t);
        if (i === 4) return cellPos(4, g);
        const f = RIM.indexOf(i) + turned(t), a = Math.floor(f), u = f - a;
        const pa = cellPos(RIM[a % 8], g), pb = cellPos(RIM[(a + 1) % 8], g);
        return { x: lerp(pa.x, pb.x, u), y: lerp(pa.y, pb.y, u) };
      }
      function ringPos(i) {
        if (i === 4) return { x: 960, y: 640 };
        const c = cellPos(i, { cx: 960, cy: 640, sx: 1, sy: 1 }), a = Math.atan2(c.y - 640, c.x - 960);
        return { x: 960 + Math.cos(a) * 290, y: 640 + Math.sin(a) * 250 };
      }
      function place(i, t) {
        const r = ringPos(i), gp = gridPos(i, t), g = grid(t);
        const kg = easeInOut((t - GRID[0]) / (GRID[1] - GRID[0]));
        const settled = { x: lerp(r.x, gp.x, kg), y: lerp(r.y, gp.y, kg), size: lerp(160, g.size, kg) };
        const ks = easeOut((t - SPLIT[0]) / (SPLIT[1] - SPLIT[0]));
        const from = { x: TITLE_ORB.x, y: TITLE_ORB.y, size: i === SEED ? TITLE_ORB.size : 120 };
        return {
          x: lerp(from.x, settled.x, ks), y: lerp(from.y, settled.y, ks), size: lerp(from.size, settled.size, ks),
          alpha: i === SEED ? 1 : clamp(ks * 3, 0, 1),
        };
      }

      const stage = document.getElementById("s2-stage");
      const sctx = O.fit(stage, W, H);
      const labels = Array.from(document.querySelectorAll(".s2-label"));

      // ---------- the two cards: a generic spinner, then an orb takes its place ----------
      const pills = [
        { ctx: O.fit(document.querySelector("#s2-card-app canvas"), 56, 56), state: "breathing", swap: 13.33, a: "#s2-app-a", b: "#s2-app-b" },
        { ctx: O.fit(document.querySelector("#s2-card-site canvas"), 56, 56), state: "searching", swap: 13.78, a: "#s2-site-a", b: "#s2-site-b" },
      ];
      function spinner(ctx, t, alpha) {
        if (alpha <= 0) return;
        ctx.save();
        ctx.setTransform(O.DPR, 0, 0, O.DPR, 0, 0);
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = "#9a9a9a";
        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        const a = t * Math.PI * 2 * 1.3;
        ctx.beginPath(); ctx.arc(28, 28, 17, a, a + Math.PI * 1.5); ctx.stroke();
        ctx.restore();
      }

      function render(film) {
        O.clear(sctx);
        STATES.forEach((state, i) => {
          if (film < SPLIT[0] && i !== SEED) return;
          const p = place(i, film);
          // the grid shrinks away with the cards before "Swap"
          const out = easeInOut((film - EXIT) / 0.35);
          p.alpha *= 1 - out;
          p.size *= 1 - 0.25 * out;
          O.drawState(sctx, state, film, p.size, p.x, p.y, p.alpha);
          const l = labels[i];
          l.style.transform = `translate(${p.x}px, ${p.y + p.size * 0.56 + 6}px)`;
          l.style.opacity = clamp((film - 8.95) / 0.3, 0, 1) * (1 - out);
        });
        for (const p of pills) {
          O.clear(p.ctx);
          const k = clamp((film - p.swap) / 0.2, 0, 1);
          spinner(p.ctx, film, 1 - k);
          O.drawState(p.ctx, p.state, film, 56, 28, 28, k);
        }
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: DURATION, duration: DURATION, ease: "none", onUpdate: () => render(START + clock.t) }, 0);
      // the title card blurs away as the orb splits
      tl.to("#s2-titlecard", { opacity: 0, filter: "blur(16px)", y: 20, duration: 0.2, ease: "power2.in" }, T(7.64));
      // cards rise in on "ready"; each pill swaps its text as its orb arrives
      ["#s2-card-app", "#s2-card-site"].forEach((id, i) => {
        tl.fromTo(id, { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: true }, T(12.3 + i * 0.1));
      });
      tl.to(["#s2-card-app", "#s2-card-site"], { opacity: 0, y: -20, duration: 0.3, ease: "power2.in", stagger: 0.05 }, T(EXIT));
      for (const p of pills) {
        tl.to(p.a, { opacity: 0, y: -12, duration: 0.2, ease: "power2.in" }, T(p.swap));
        tl.fromTo(p.b, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", immediateRender: true }, T(p.swap + 0.08));
      }

      const caps = document.getElementById("s2-caps");
      if (FILM.lang === "en") {
        window.Captions.build(caps, tl, [
          { lines: [[16, 16], [17, 18]], pills: [[17, 18]], shown: true },
          { lines: [[19, 20], [21, 21]], pills: [[19, 19]] },
          { lines: [[22, 24], [25, 27]] },
          { lines: [[28, 29], [30, 30]] },
          { lines: [[31, 33], [34, 38]], pills: [[33, 33]] },
        ], { offset: START });
      }
      FILM.localize(document);
      render(START);
      FILM.scene("s2-states", tl, START, DURATION);
    })();
  </script>

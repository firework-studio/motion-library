          ? [[15, 2.74], [16, 2.785], [17, 2.835], [18, 2.89], [19, 2.95], [20, 3.02], [21, 3.1], [22, 3.18], [23, 3.26], [24, 3.36]]
          : [[15, 2.735], [16, 2.77], [17, 2.8], [18, 2.835], [19, 2.855], [20, 2.87], [21, 2.89], [22, 2.905]]),
      ];
      let prev = [0.35, 1.12];
      for (const [n, t] of UNITS) {
        const gap = t - prev[1];
        const start = gap > 0.15 ? t - Math.min(0.22, gap * 0.75) : prev[1];
        roll(units, "#blur-units-fx", prev[0], n, start, t, gap > 0.08 ? "power2.inOut" : "power1.inOut");
        prev = [n, t];
      }
      roll(tensD, "#blur-tens-fx", 0, 1, 1.72, 2.52, "none");
      if (ENDING) roll(tensD, "#blur-tens-fx", 1, 2, 2.86, 3.02, "power1.inOut");
      else roll(tensD, "#blur-tens-fx", 1, 2, 2.72, 2.9, "power1.in");

      // 2.25–3.3 s: icons gather toward the text line and settle
      // Full-film mode uses the reference's gather distance; the standalone cut uses 55% so the icons don't cover the text once settled
      const K = ENDING ? 0.55 : 1;
      const DRIFT = [
        ["#t-ring", 0, 175 * K],
        ["#t-sail", 0, 210 * K],
        ["#t-ps", 56 * K, ENDING ? 70 : 325],
        ["#t-ae", 12 * K, 42 * K],
        ["#t-jit", 0, 64 * K],
        ["#t-fig", 0, 44 * K],
      ];
      for (const [sel, dx, dy] of DRIFT) {
        if (ENDING) tl.to(sel, { x: dx, y: dy, duration: 1.05, ease: "power2.inOut" }, 2.25);
        else tl.to(sel, { x: dx, y: dy, duration: 0.68, ease: "power3.in" }, 2.25);
      }

      // Ending: the top dot grid fades in
      tl.to("#dots", { opacity: 1, duration: 0.63, ease: "power2.in" }, 2.3);

      if (ENDING) {
        // Outro: at 3.6 s the camera whips down and the content drops out of frame with the top dot grid
        tl.to(["#stage", "#dots"], { y: 1400, duration: 0.3, ease: "power3.in" }, 3.6);

        // End card: each letter of Firework flies back in from its own side to assemble at the center, then the Studio tag slides up from below
        // [direction angle (0° = right, 90° = down), distance in px, initial rotation]
        const PIECES = [
          [180, 820, -18], [225, 760, 12], [125, 780, -10], [270, 700, 16],
          [90, 700, -14], [305, 760, 10], [55, 780, -16], [330, 820, 14],
        ];
        gsap.set("#end-title", { opacity: 1 });
        gsap.utils.toArray("#end-title .ch").forEach((el, i) => {
          const [deg, dist, rot] = PIECES[i];
          const a = (deg * Math.PI) / 180;
          const at = 3.78 + i * 0.05;
          tl.fromTo(
            el,
            { x: Math.cos(a) * dist, y: Math.sin(a) * dist, rotation: rot, scale: 0.7 },
            { x: 0, y: 0, rotation: 0, scale: 1, duration: 0.9, ease: "expo.out", immediateRender: true },
            at,
          );
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none", immediateRender: true }, at);
        });
        gsap.set("#end-pill", { transformOrigin: "0% 50%" });
        tl.fromTo(
          "#end-pill",
          { y: 420, scale: 0.9, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: 0.85, ease: "expo.out", immediateRender: true },
          4.08,
        );
        gsap.set("#dots-end", { y: -200 });
        tl.to("#dots-end", { opacity: 1, duration: 0.4, ease: "power1.out" }, 3.75);
        tl.to("#dots-end", { y: 0, duration: 1.0, ease: "expo.out" }, 3.75);

      }

      tl.set({}, {}, ENDING ? 5.6 : 2.933);
      window.__timelines = window.__timelines || {};
      window.__timelines["opening"] = tl;
    })();
  </script>
</template>

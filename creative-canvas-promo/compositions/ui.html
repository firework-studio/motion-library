      // Coordinates are measured frame by frame from the reference (converted to the prompt shot's world space, so the hand drifts with the panel after stopping)
      const HAND = [[10.233, 1904, 1035], [10.3, 1771, 899], [10.367, 1665, 803], [10.433, 1618, 761],

      for (let i = 1; i < HAND.length; i++) {
        tl.to("#cursor", { x: HAND[i][1], y: HAND[i][2], duration: HAND[i][0] - HAND[i - 1][0], ease: "none" }, at(HAND[i - 1][0]));

      tl.to("#cursor", { scale: 1, duration: 0.2, ease: "power2.out" }, at(10.7));

      // Closing whip: the panel keeps accelerating upward, vertical blur builds over the last 0.15 s, cutting to the end card
      tl.to("#whipB-fx", { attr: { stdDeviation: "0 10" }, duration: 0.15, ease: "power2.in" }, at(10.85));

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const T0 = 4.767; // Start of this shot in the full film; all times below are full-film times
      const at = (t) => t - T0;

      // Camera: horizontal pan only, rebuilt segment by segment from the x position of the yellow icon in the reference (zeroed at 5.833 s)
      const PAN = [
        [4.767, -162], [4.9, -134], [5.033, -88], [5.167, -58], [5.3, -40], [5.433, -26], [5.567, -18],
        [5.7, -10], [5.833, 0], [5.967, 14], [6.1, 32], [6.233, 62], [6.367, 118], [6.467, 200],
      ];
      gsap.set("#world", { x: PAN[0][1] });
      for (let i = 1; i < PAN.length; i++) {
        tl.to("#world", { x: PAN[i][1], duration: PAN[i][0] - PAN[i - 1][0], ease: "none" }, at(PAN[i - 1][0]));
      }

      // First line: "You ask" types out letter by letter with a trailing cursor; text fades from light gray to black
      const chars = gsap.utils.toArray("#say1 .ch");
      const say1 = document.getElementById("say1");
      const cursorX = (n) => {
        let w = 0;
        for (let i = 0; i < n; i++) w += chars[i].getBoundingClientRect().width;
        return 659 + w + 22;
      };
      gsap.set("#cursor", { x: cursorX(1) });
      chars.forEach((el, i) => {
        const t = 4.767 + i * 0.03;
        tl.set(el, { opacity: 1 }, at(t));
        tl.set("#cursor", { x: cursorX(i + 1) }, at(t));
      });
      tl.fromTo(say1, { color: "#a0a0a0" }, { color: "#0a0a0a", duration: 1.4, ease: "power1.out" }, at(4.85));

      // Second line: slides in from the left at 5.3 s and indents to the right; the spinner keeps turning; a dark sheen sweeps left to right
      // Horizontal offset of the second line relative to the first, rebuilt segment by segment from the reference (zeroed at 5.833 s)
      const SLIDE = [[5.27, -250], [5.3, -210], [5.433, -100], [5.567, -45], [5.7, -14], [5.833, 0],
        [5.967, 14], [6.1, 34], [6.233, 56], [6.367, 82], [6.467, 100]];
      gsap.set("#line2", { x: SLIDE[0][1], opacity: 0 });
      tl.to("#line2", { opacity: 1, duration: 0.1, ease: "none" }, at(5.27));
      for (let i = 1; i < SLIDE.length; i++) {
        tl.to("#line2", { x: SLIDE[i][1], duration: SLIDE[i][0] - SLIDE[i - 1][0], ease: "none" }, at(SLIDE[i - 1][0]));
      }
      // The arc orbits clockwise along an ellipse, about one turn every 0.7 s
      tl.fromTo("#spin-arc", { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -170 }, duration: 6.467 - 5.27, ease: "none" }, at(5.27));
      tl.fromTo("#say2", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 0.75, ease: "power1.inOut" }, at(5.5));

      tl.set({}, {}, at(6.467));
      window.__timelines = window.__timelines || {};
      window.__timelines["you-ask"] = tl;
    })();
  </script>

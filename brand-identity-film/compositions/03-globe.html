<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #ecebe5;
    }
    .abs {
      position: absolute;
    }
    #g-cv {
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
    #g-grain {
      inset: 0;
      opacity: 0.12;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
  </style>
  <div id="root" data-composition-id="globe" data-width="1920" data-height="1080">
    <canvas id="g-cv" class="abs" width="1920" height="1080"></canvas>
    <div id="g-grain" class="abs"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const clamp01 = (v) => Math.min(1, Math.max(0, v));
    const smoothKeys = (K) => {
      const n = K.length, d = [], m = [];
      for (let i = 0; i < n - 1; i++) d.push((K[i + 1][1] - K[i][1]) / (K[i + 1][0] - K[i][0]));
      m.push(d[0]);
      for (let i = 1; i < n - 1; i++) m.push(d[i - 1] * d[i] <= 0 ? 0 : (2 * d[i - 1] * d[i]) / (d[i - 1] + d[i]));
      m.push(d[n - 2]);
      return (t) => {
        if (t <= K[0][0]) return K[0][1];
        if (t >= K[n - 1][0]) return K[n - 1][1];
        let i = 0;
        while (K[i + 1][0] < t) i++;
        const h = K[i + 1][0] - K[i][0], u = (t - K[i][0]) / h, u2 = u * u, u3 = u2 * u;
        return (2 * u3 - 3 * u2 + 1) * K[i][1] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * K[i + 1][1] + (u3 - u2) * h * m[i + 1];
      };
    };

    // ---------------------------------------------------------------- the pixel globe
    // It grows out of the cube grid, with no cut: at 0 s the cells sit exactly where the cubes of the last shot are
    // (205 px across, 249 px down, 58 px cubes), every one of them sea. The grid then tightens to a fine square grid
    // (40 px pitch, 32 px cells) as the camera keeps pulling back, new cells coming in from the edges, and as it
    // tightens the continents are cut out of it and the globe's rim comes in from the frame edge.
    // Then the globe turns and draws in; at the end its rim squares off into a soft rounded square and the land fills
    // with dots, so it reads as one tile again. Sea is a square, a coast or the rim is a dot, land is paper.
    const sm = (u) => { u = clamp01(u); return u * u * (3 - 2 * u); };
    const TIGHT = (t) => sm(t / 0.62);                  // 0 -> 1: the cube grid becomes the fine grid
    const PX = (t) => 205.2 + (40 - 205.2) * TIGHT(t), PY = (t) => 248.5 + (40 - 248.5) * TIGHT(t);
    const CELLS = (t) => 57.8 + (32 - 57.8) * TIGHT(t);
    // the land is carved out in a wave from the centre outward once the grid is fine enough to draw it
    const REVEAL = (t) => sm((t - 0.42) / 0.38);
    const RADIUS = smoothKeys([[0, 1700], [0.35, 1250], [0.7, 860], [1.0, 640], [1.3, 500], [1.6, 400], [1.85, 340], [2.0, 330]]);
    const SQUARE = (t) => sm((t - 1.45) / 0.5);         // the rim squares off: superellipse exponent 2 -> 4.5
    // the land fills in dot by dot: each land cell has its own moment (a fixed hash, biased so the fill works in from
    // the coasts), and its dot grows from nothing over a few frames. Spread over 1.2-1.95 s, so it reads as pixels
    // arriving, not a switch
    const hash = (i, j) => { const v = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return v - Math.floor(v); };
    const FILL_AT = (i, j, coast) => 1.15 + 0.68 * (0.55 * hash(i, j) + 0.45 * (1 - coast));
    const SPIN = (t) => 0.42 + 0.2 * t;
    const TILT = 0.36;
    const CX = 960, CY = 540;
    const cv = document.getElementById("g-cv");
    const g = cv.getContext("2d");
    let land = null, LW = 0, LH = 0;
    const img = new Image();
    img.src = "assets/images/land-mask.png";
    const ready = img.decode().then(() => {
      const c = document.createElement("canvas");
      LW = img.naturalWidth; LH = img.naturalHeight;
      c.width = LW; c.height = LH;
      const x = c.getContext("2d");
      x.drawImage(img, 0, 0);
      land = x.getImageData(0, 0, LW, LH).data;
    });
    // sea (1) or land (0) at a screen point; off the globe is -1
    const sea = (sx, sy, R, spin, ex) => {
      const dx = (sx - CX) / R, dy = (sy - CY) / R;
      if (Math.pow(Math.abs(dx), ex) + Math.pow(Math.abs(dy), ex) >= 1) return -1;
      const rr = Math.min(0.999, dx * dx + dy * dy);
      const nx = dx, ny = -dy, nz = Math.sqrt(1 - rr);
      const ct = Math.cos(TILT), st = Math.sin(TILT);
      const y2 = ny * ct + nz * st, z2 = -ny * st + nz * ct;
      const lat = Math.asin(Math.max(-1, Math.min(1, y2)));
      const lon = Math.atan2(nx, z2) + spin;
      const u = ((lon / (2 * Math.PI)) % 1 + 1.5) % 1, v = 0.5 - lat / Math.PI;
      const px = Math.min(LW - 1, (u * LW) | 0), py = Math.min(LH - 1, (v * LH) | 0);
      return land[(py * LW + px) * 4] > 127 ? 0 : 1;
    };
    // 2.0-2.45 s: the tile of dots gathers into one square: every cell slides in to the centre, and a single lit square
    // grows there to 153 px, exactly the square the next shot's cube starts from
    const GATHER = (t) => sm((t - 2.0) / 0.42);
    const draw = (t) => {
      g.clearRect(0, 0, 1920, 1080);
      if (!land) return;
      const ga = GATHER(Math.max(t, 2.0));
      t = Math.min(t, 2.0);   // the globe itself holds its last state while it gathers
      const R = RADIUS(t), spin = SPIN(t), ex = 2 + 2.5 * SQUARE(t), rev = REVEAL(t);
      const px = PX(t), py = PY(t), cell = CELLS(t), q = cell * 0.3;
      g.fillStyle = "#1c4035";
      // columns sit half a pitch off the centre (as the cubes do); rows sit on it
      const ix = Math.ceil(960 / px) + 1, iy = Math.ceil(540 / py) + 1;
      for (let j = -iy; j <= iy; j++) {
        const y = CY + j * py;
        for (let i = -ix; i <= ix; i++) {
          const x = CX + (i + 0.5) * px;
          let n = 0, inside = 0;
          for (const [ox, oy] of [[-q, -q], [q, -q], [-q, q], [q, q]]) {
            const v = sea(x + ox, y + oy, R, spin, ex);
            if (v >= 0) { inside++; n += v; }
          }
          // before the land is revealed every cell on the globe is sea; the fill brings dots back into the land
          // a cell shows its land once the reveal wave has passed it (no half states, so no stray dots)
          const shown = Math.hypot(x - CX, y - CY) < rev * 1150;
          if (inside === 0) continue;
          const k = shown ? n : inside;
          const gx = x + (CX - x) * ga, gy = y + (CY - y) * ga, gc = cell * (1 - 0.6 * ga);
          if (k >= inside - 0.25 && inside === 4) { g.fillRect(gx - gc / 2, gy - gc / 2, gc, gc); continue; }
          if (k >= 1) { g.beginPath(); g.arc(gx, gy, gc / 2, 0, Math.PI * 2); g.fill(); continue; }
          // a land cell: a dot grows in when its moment comes (coast cells, with some sea around, go first)
          const coast = n / Math.max(1, inside);
          const u = sm((t - FILL_AT(i, j, coast)) / 0.18);
          if (u > 0.02) { g.beginPath(); g.arc(gx, gy, (gc / 2) * u, 0, Math.PI * 2); g.fill(); }
        }
      }
      if (ga > 0) {
        // the one square they gather into, lit like the cubes (upper left lighter), with the cubes' small corner round
        const sq = 153 * sm((ga - 0.35) / 0.65), c = 0.05 * sq;
        if (sq > 1) {
          const gr = g.createLinearGradient(CX - sq / 2, CY - sq / 2, CX + sq / 2, CY + sq / 2);
          gr.addColorStop(0, "#2b5545"); gr.addColorStop(0.55, "#1c4135"); gr.addColorStop(1, "#16382d");
          g.fillStyle = gr;
          g.beginPath(); g.roundRect(CX - sq / 2, CY - sq / 2, sq, sq, c); g.fill();
          g.fillStyle = "#1c4035";
        }
      }
    };
    const clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, { t: 2.45, duration: 2.45, ease: "none", immediateRender: false, onUpdate: () => draw(clock.t) }, 0);
    window.__hf = window.__hf || {};
    window.__hf.buildReady = window.__hf.buildReady || {};
    window.__hf.buildReady["globe-land"] = ready.then(() => draw(clock.t));

    window.__timelines["globe"] = tl;
  </script>
</template>

<template>
  <style>
    @font-face {
      font-family: "Space Grotesk";
      font-weight: 300 700;
      src: url("assets/fonts/SpaceGrotesk-Variable.ttf") format("truetype");
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #ecebe5;
    }
    .abs {
      position: absolute;
    }
    #s-cv {
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
    #s-grain {
      inset: 0;
      opacity: 0.12;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
  </style>
  <div id="root" data-composition-id="slogan" data-width="1920" data-height="1080">
    <canvas id="s-cv" class="abs" width="1920" height="1080"></canvas>
    <div id="s-grain" class="abs"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const smoothKeys = (K) => {
      const n = K.length, d = [], m = [];
      for (let i = 0; i < n - 1; i++) d.push((K[i + 1][1] - K[i][1]) / (K[i + 1][0] - K[i][0]));
      m.push(d[0]);
      for (let i = 1; i < n - 1; i++) m.push(d[i - 1] * d[i] <= 0 ? 0 : (2 * d[i - 1] * d[i]) / (d[i - 1] + d[i]));
      m.push(d[n - 2]);
      return (t) => {
        if (t <= K[0][0]) return K[0][1];
        if (t >= K[n - 1][0]) return K[n - 1][1];
        let i = 0;
        while (K[i + 1][0] < t) i++;
        const h = K[i + 1][0] - K[i][0], u = (t - K[i][0]) / h, u2 = u * u, u3 = u2 * u;
        return (2 * u3 - 3 * u2 + 1) * K[i][1] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * K[i + 1][1] + (u3 - u2) * h * m[i + 1];
      };
    };

    // ---------------------------------------------------------------- the slogan, set solid
    // A hard cut from the cells to the slogan in the bold face, leaning like an italic (Space Grotesk has none, so it is
    // sheared 11 degrees). As measured on the reference: it opens widely tracked, the tracking closes up to nothing
    // and then a little past it, while the type grows by a fifth and falls back, and the leading tightens with it.
    const LINES = ["MAKE", "SHAPE", "SHIP"], SIZE = 254, SLANT = Math.tan((11 * Math.PI) / 180);
    const SCALE = smoothKeys([[0, 1], [0.15, 1.1], [0.43, 1.21], [0.65, 1.17], [0.93, 1.05]]);
    const TRACK = smoothKeys([[0, 0.3], [0.2, 0.14], [0.43, 0.03], [0.7, -0.005], [0.93, -0.035]]);   // em
    const LEAD = smoothKeys([[0, 0.93], [0.43, 0.82], [0.93, 0.78]]);   // line pitch, em
    const cv = document.getElementById("s-cv");
    const g = cv.getContext("2d");
    const draw = (t) => {
      g.clearRect(0, 0, 1920, 1080);
      const size = SIZE * SCALE(t), tr = TRACK(t) * size, lead = LEAD(t) * size;
      g.font = `700 ${size}px "Space Grotesk"`;
      g.textBaseline = "alphabetic";
      g.fillStyle = "#1c4135";
      // a hair heavier than the face's Bold, closer to the reference's black weight: a thin stroke in the same colour
      g.strokeStyle = "#1c4135"; g.lineJoin = "round"; g.lineWidth = size * 0.022;
      const cap = size * 0.7;
      LINES.forEach((line, i) => {
        const chars = [...line], ws = chars.map((c) => g.measureText(c).width);
        const w = ws.reduce((a, b) => a + b, 0) + tr * (chars.length - 1);
        const base = 540 + (i - 1) * lead + cap / 2;
        let x = 960 - w / 2;
        chars.forEach((c, k) => {
          // shear about the line's own baseline mid-height, so the lean does not push the line sideways
          g.save();
          g.setTransform(1, 0, -SLANT, 1, SLANT * (base - cap / 2), 0);
          g.fillText(c, x, base);
          g.strokeText(c, x, base);
          g.restore();
          x += ws[k] + tr;
        });
      });
    };
    const clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, { t: 0.93, duration: 0.93, ease: "none", immediateRender: false, onUpdate: () => draw(clock.t) }, 0);
    window.__hf = window.__hf || {};
    window.__hf.buildReady = window.__hf.buildReady || {};
    window.__hf.buildReady["slogan-font"] = document.fonts.load('700 254px "Space Grotesk"').then(() => draw(clock.t));

    window.__timelines["slogan"] = tl;
  </script>
</template>

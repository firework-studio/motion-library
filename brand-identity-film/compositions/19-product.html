<template>
  <style>
    @font-face {
      font-family: "Space Grotesk";
      font-weight: 300 700;
      src: url("assets/fonts/SpaceGrotesk-Variable.ttf") format("truetype");
    }
    @font-face {
      font-family: "Plex Mono";
      font-weight: 400;
      src: url("assets/fonts/IBMPlexMono-Regular.ttf") format("truetype");
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #0d1a16;
    }
    #pd-cv {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
    #pd-grain {
      position: absolute;
      inset: 0;
      opacity: 0.1;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
  </style>
  <div id="root" data-composition-id="product" data-width="1920" data-height="1080">
    <canvas id="pd-cv" width="1920" height="1080"></canvas>
    <div id="pd-grain"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const clamp01 = (v) => Math.min(1, Math.max(0, v));
    const smoother = (u) => { u = clamp01(u); return u * u * u * (u * (u * 6 - 15) + 10); };
    const lerp = (a, b, u) => a + (b - a) * u;
    const hash = (n) => { const v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
    const FR = 30;
    const cv = document.getElementById("pd-cv");
    const g = cv.getContext("2d");
    const INK = "#0d1a16", PINE = "#1c4135", PINE_L = "#2b5545", VERD = "#4f8a78", CELADON = "#a9c4b6", MIST = "#dde5df";
    const BONE = "#ecebe5", PAPER = "#f6f5f1", GREY = "#8a938f", LINE = "#d9dcd6", BRASS = "#c49a5a", COPPER = "#b8704a";
    const SANS = (w, s) => `${w} ${s}px "Space Grotesk"`, MONO = (s) => `400 ${s}px "Plex Mono"`;
    const T63 = 1.0, T64 = 2.0, END = 3.0;
    const IMGS = {};
    const load = (n) => new Promise((res) => { const im = new Image(); im.onload = () => { IMGS[n] = im; res(); }; im.src = `assets/images/${n}.jpg`; });
    const tilePath = (x, y, a) => { g.beginPath(); g.moveTo(x, y + a); g.lineTo(x, y); g.lineTo(x + a / 2, y); g.arc(x + a / 2, y + a / 2, a / 2, -Math.PI / 2, 0); g.lineTo(x + a, y + a); g.closePath(); };
    // One set of rules for every notched tile in these shots, so they read as one family:
    // - a tile keeps its round corner where it is unless it is deliberately turning, and then it turns in whole
    //   quarter turns about its own centre (or rolls round a corner);
    // - a tile arrives by growing from its centre with a small overshoot (never by fading or squashing);
    // - its colours step along the patina, pine -> verdigris -> brass -> copper -> pine.
    const PATINA = ["#1c4135", "#4f8a78", "#c49a5a", "#b8704a"];
    const backOut = (u) => { u = clamp01(u); const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
    const tileAt = (cx, cy, a, col, grow = 1, turn = 0) => {
      if (grow <= 0) return;
      const s2 = a * backOut(grow);
      g.save(); g.translate(cx, cy); g.rotate(turn); g.fillStyle = col; tilePath(-s2 / 2, -s2 / 2, s2); g.fill(); g.restore();
    };
    const text = (s, x, y, font, col, align = "left") => { g.font = font; g.fillStyle = col; g.textAlign = align; g.fillText(s, x, y); g.textAlign = "left"; };
    const cover = (im, x, y, w, h) => { if (!im) return; const s = Math.max(w / im.width, h / im.height), sw = w / s, sh = h / s; g.drawImage(im, (im.width - sw) / 2, (im.height - sh) / 2, sw, sh, x, y, w, h); };

    // ---------------------------------------------------------------- the product's cards (Tilo, a tool for making things
    // out of modules). Each card is drawn at its own size in local units and is alive: its numbers tick, its charts grow.
    // Every card keeps moving for the whole shot, each on its own phase (t here is the shot time plus a per-card
    // offset), so the wall, seen whole, is alive in every cell.
    const loop = (t, period) => ((t / period) % 1 + 1) % 1;
    const CARDS = {
      // a bar chart: the bars rise in a wave, one after another, and keep breathing; a highlight walks along them and
      // its value pops above it; the total ticks up
      bars: (w, h, t) => {
        g.fillStyle = PAPER; g.fillRect(0, 0, w, h);
        text("Tiles placed this week", 24, 40, SANS(500, 18), INK);
        text("Fewer steps from idea to built.", 24, 64, SANS(400, 13), GREY);
        text((12480 + Math.floor(t * 900)).toLocaleString("en-US"), 24, 116, SANS(600, 38), INK);
        const n = 12, bw = (w - 48) / n, hi = Math.floor(loop(t, 1.2) * n);
        for (let k = 0; k < n; k++) {
          const grow = smoother(t * 2.5 - k * 0.1), breathe = 1 + 0.1 * Math.sin(t * 6 + k * 0.7);
          const hh = (h - 190) * (0.35 + 0.6 * hash(k * 7)) * grow * breathe;
          g.fillStyle = k === hi ? PINE : CELADON; g.fillRect(24 + k * bw + 3, h - 30 - hh, bw - 6, hh);
          if (k === hi && grow > 0.9) { g.fillStyle = INK; g.beginPath(); g.roundRect(24 + k * bw - 10, h - 62 - hh, bw + 20, 22, 6); g.fill(); text(`${Math.round(hh * 4)}`, 24 + k * bw + bw / 2, h - 46 - hh, MONO(11), BONE, "center"); }
        }
      },
      // a dark card: the line chart scrolls left like a live feed, a dot rides its head with a ring pulsing out, the
      // time ticks down, the Ship button lights up in turn
      build: (w, h, t) => {
        g.fillStyle = INK; g.fillRect(0, 0, w, h);
        text("tılo studio", 24, 40, SANS(600, 16), BONE);
        text("Build time", 24, 80, SANS(400, 15), CELADON);
        text(`${(1.8 - 0.1 * (Math.floor(t * 4) % 5)).toFixed(1)}s`, 24, 128, SANS(600, 44), BONE);
        text("▼ 42% this month", 24, 156, SANS(500, 14), VERD);
        const sh = t * 6, yAt = (k) => h - 96 - (k / 40) * 60 + 20 * Math.sin((k + sh) * 0.55) * (0.5 + 0.5 * hash(Math.floor(k + sh)));
        g.strokeStyle = BONE; g.lineWidth = 2.5; g.beginPath();
        for (let k = 0; k <= 40; k++) { const x = 24 + (k / 40) * (w - 48); k ? g.lineTo(x, yAt(k)) : g.moveTo(x, yAt(k)); }
        g.stroke();
        const hx = w - 24, hy = yAt(40), pr = loop(t, 0.6);
        g.fillStyle = VERD; g.beginPath(); g.arc(hx, hy, 5, 0, 7); g.fill();
        g.strokeStyle = VERD; g.globalAlpha = 1 - pr; g.lineWidth = 2; g.beginPath(); g.arc(hx, hy, 5 + 16 * pr, 0, 7); g.stroke(); g.globalAlpha = 1;
        const on = Math.floor(loop(t, 0.8) * 2);
        [0, 1].forEach((k) => { g.fillStyle = k === on ? VERD : PINE_L; g.beginPath(); g.roundRect(24 + k * (12 + (w - 60) / 2), h - 56, (w - 60) / 2, 34, 8); g.fill(); });
        text("Make", 24 + (w - 60) / 4, h - 33, SANS(500, 14), BONE, "center"); text("Ship", 36 + (3 * (w - 60)) / 4, h - 33, SANS(500, 14), BONE, "center");
      },
      // a composition card: the tile stands upright (round corner top right, never tilted) on a corner of the grey
      // square, half over it. It rests, then slides straight along an edge to the next corner clockwise, rests again.
      // The label follows the corner it is on.
      shape: (w, h, t) => {
        g.fillStyle = INK; g.fillRect(0, 0, w, h);
        const sq = [w * 0.24, h * 0.24, w * 0.52, h * 0.52];
        g.fillStyle = "#e4e6e2"; g.fillRect(...sq);
        const a = w * 0.3;
        const C4 = [[sq[0], sq[1]], [sq[0] + sq[2], sq[1]], [sq[0] + sq[2], sq[1] + sq[3]], [sq[0], sq[1] + sq[3]]];
        const q = loop(t, 2.4) * 4, k = Math.floor(q), u = smoother((q - k - 0.6) / 0.4);
        const [x0, y0] = C4[k % 4], [x1, y1] = C4[(k + 1) % 4];
        g.fillStyle = PINE_L; tilePath(lerp(x0, x1, u) - a / 2, lerp(y0, y1, u) - a / 2, a); g.fill();
        text(`${20 + (k % 4) * 20}%`, sq[0] + 10, sq[1] + sq[3] - 10, MONO(11), GREY);
      },
      // a kit strip: the four kit tiles flip one after another to their other colour, and a count ticks
      kits: (w, h, t) => {
        g.fillStyle = PAPER; g.fillRect(0, 0, w, h);
        text("Your kits", 24, 38, SANS(500, 16), INK);
        // each kit tile in turn, upright throughout, dips and grows back one step further along the patina
        ["Grid", "Studio", "Lab", "Ship"].forEach((n, k) => {
          const x = 24 + k * ((w - 48) / 4), q = t / 0.3 - k * 0.5, step = Math.max(0, Math.floor(q)), f = q - step;
          const dip = q > 0 && f < 0.3 ? f / 0.3 : 1, col = PATINA[(k + step + (q > 0 && f >= 0.15 ? 1 : 0)) % 4];
          tileAt(x + 20, 78, 40, col, q > 0 && f < 0.15 ? 1 - f / 0.15 * 0.6 : q > 0 && f < 0.3 ? 0.4 + 0.6 * ((f - 0.15) / 0.15) : 1);
          text(n, x, 120, SANS(400, 13), INK);
        });
        // a build in progress: a grid of small tiles placed one by one, row by row, then cleared and begun again
        const gc = 8, gr = 4, cs = (w - 48) / gc, placed = Math.floor(loop(t, 1.6) * (gc * gr + 6));
        for (let k = 0; k < gc * gr; k++) {
          const x = 24 + (k % gc) * cs, y = 146 + Math.floor(k / gc) * cs;
          g.fillStyle = "#ebebe6"; tilePath(x + 3, y + 3, cs - 6); g.fill();
          const grow = clamp01((loop(t, 1.6) * (gc * gr + 6) - k) / 1.5);
          tileAt(x + cs / 2, y + cs / 2, cs - 6, PATINA[(k + Math.floor(k / gc)) % 4], k < placed + 1 ? grow : 0);
        }
        // a progress bar filling and restarting
        const pr = loop(t, 0.9);
        g.fillStyle = LINE; g.fillRect(24, h - 60, w - 48, 6); g.fillStyle = PINE; g.fillRect(24, h - 60, (w - 48) * pr, 6);
        text(`${3 + Math.floor(t * 3)} releases shipped`, 24, h - 24, MONO(12), GREY);
      },
      // a gauge: the needle sweeps up, settles and wobbles; the arc fills behind it; the score counts
      gauge: (w, h, t) => {
        g.fillStyle = PAPER; g.fillRect(0, 0, w, h);
        text("Fit score", 24, 38, SANS(500, 16), INK);
        const u = clamp01(0.3 + 0.6 * smoother(t * 1.5) + 0.04 * Math.sin(t * 9));
        g.lineWidth = 14; g.strokeStyle = LINE; g.beginPath(); g.arc(w / 2, h * 0.68, w * 0.3, Math.PI, 0); g.stroke();
        g.strokeStyle = VERD; g.beginPath(); g.arc(w / 2, h * 0.68, w * 0.3, Math.PI, Math.PI * (1 + u)); g.stroke();
        const na = Math.PI * (1 + u); g.strokeStyle = INK; g.lineWidth = 3; g.beginPath(); g.moveTo(w / 2, h * 0.68); g.lineTo(w / 2 + Math.cos(na) * w * 0.22, h * 0.68 + Math.sin(na) * w * 0.22); g.stroke();
        g.fillStyle = INK; g.beginPath(); g.arc(w / 2, h * 0.68, 6, 0, 7); g.fill();
        text(`${Math.round(u * 100)}`, w / 2, h * 0.68 + 52, SANS(600, 30), INK, "center");
      },
    };
    const card = (name, x, y, w, h, t) => { g.save(); g.translate(x, y); g.beginPath(); g.roundRect(0, 0, w, h, 14); g.clip(); CARDS[name](w, h, t); g.restore(); };

    // ---------------------------------------------------------------- 62 (0-1.0 s): the card wall
    // A hard cut to a single bar-chart card filling much of the frame; the cards round it are laid in (a beat apart,
    // from the middle out) and then the camera pulls back on the whole wall, every card still ticking.
    const WALL = [];
    { const names = ["build", "shape", "bars", "kits", "gauge"]; for (let r = -3; r <= 3; r++) for (let c = -4; c <= 4; c++) WALL.push({ r, c, name: r === 0 && c === 0 ? "bars" : names[(((c * 3 + r * 7) % 5) + 5) % 5] }); }
    const shot62 = (t) => {
      g.fillStyle = "#e7e8e4"; g.fillRect(0, 0, 1920, 1080);
      const z = lerp(1.9, 0.62, smoother((t - 0.25) / 0.75)), cw = 420, chh = 400, gap = 26;
      g.save(); g.translate(960, 540); g.scale(z, z);
      WALL.forEach((it) => {
        const d = Math.hypot(it.c, it.r);
        const show = it.r === 0 && it.c === 0 ? 1 : smoother((t - 0.05 - d * 0.045) / 0.12);
        if (show <= 0) return;
        g.globalAlpha = show;
        card(it.name, it.c * (cw + gap) - cw / 2, it.r * (chh + gap) - chh / 2 + (1 - show) * 30, cw, chh, t + hash(it.r * 9 + it.c));
        g.globalAlpha = 1;
      });
      g.restore();
    };

    // ---------------------------------------------------------------- 63-64 (1.0-3.0 s): two phones
    // Ink ground, two phones side by side. Left: a white screen with one tile in the middle that changes colour every
    // four frames (pine, brass, verdigris, pine...) while the app loads; at 2.0 s it opens on Home. Right: the Studio
    // feed scrolling steadily, posts of made things passing under the header.
    const PW = 380, PH = 800, PX = [960 - PW - 40, 960 + 40], PY = 140;
    const phone = (x, draw) => {
      g.fillStyle = "#26302d"; g.beginPath(); g.roundRect(x - 10, PY - 10, PW + 20, PH + 20, 54); g.fill();
      g.save(); g.beginPath(); g.roundRect(x, PY, PW, PH, 46); g.clip();
      g.fillStyle = PAPER; g.fillRect(x, PY, PW, PH);
      g.translate(x, PY); draw(); g.restore();
      text("9:41", x + 34, PY + 36, SANS(600, 15), INK);
    };
    const home = (t) => {
      text("Home", 24, 90, SANS(600, 26), INK);
      text("Your kits", 24, 140, SANS(500, 15), GREY);
      [PINE, VERD, BRASS, COPPER, PINE].forEach((c, k) => tileAt(49 + k * 66, 181, 50, c, (t - 0.04 * k) / 0.22));
      text("Recent builds", 24, 260, SANS(500, 15), GREY);
      ["Shelf, 48 tiles", "Lamp base, 12 tiles", "Wall grid, 120 tiles"].forEach((n, k) => {
        const y = 280 + k * 66;
        g.fillStyle = [MIST, "#efe4d6", MIST][k]; g.beginPath(); g.roundRect(24, y, PW - 48, 54, 12); g.fill();
        tileAt(52, y + 27, 32, [PINE, BRASS, VERD][k], (t - 0.2 - 0.05 * k) / 0.22);
        text(n, 82, y + 33, SANS(500, 15), INK);
      });
      text("Credits", 24, 520, SANS(500, 15), GREY);
      text((1250 + Math.floor(t * 40)).toLocaleString("en-US"), 24, 566, SANS(600, 40), INK);
      g.fillStyle = PINE; g.beginPath(); g.roundRect(24, 600, (PW - 60) / 2, 46, 23); g.fill();
      g.fillStyle = MIST; g.beginPath(); g.roundRect(36 + (PW - 60) / 2, 600, (PW - 60) / 2, 46, 23); g.fill();
      text("Make", 24 + (PW - 60) / 4, 629, SANS(600, 15), BONE, "center"); text("Ship", 36 + (3 * (PW - 60)) / 4, 629, SANS(600, 15), INK, "center");
      g.strokeStyle = LINE; g.lineWidth = 1; g.beginPath(); g.moveTo(0, PH - 70); g.lineTo(PW, PH - 70); g.stroke();
      for (let k = 0; k < 5; k++) tileAt(36 + k * ((PW - 72) / 4), PH - 40, 20, k === 0 ? PINE : CELADON, (t - 0.1) / 0.2);
    };
    const POSTS = [
      { who: "Mara", what: "A better way to make starts here.", img: "art-1" },
      { who: "Jun", what: "Sphere, 640 tiles. Took a weekend.", img: "art-2" },
      { who: "Ola", what: "The ring is finally glazed.", img: "art-3" },
      { who: "Sam", what: "Colour study for the hallway.", img: "art-4" },
      { who: "Ira", what: "Type case, rebuilt in tiles.", img: "art-5" },
    ];
    // The feed scrolls the way a thumb does: a flick, a coast that slows, a rest, another flick (four flicks over the two
    // seconds), with a short rubber-band at each stop. On the way: images fade and sharpen in as they enter, likes
    // count up with a heart pop when a post settles, a "new posts" pill drops in and away, the header's tab underline
    // slides between Discover and Following, and the first post's image is a gallery that pages sideways.
    const FLICKS = [[0.05, 300], [0.55, 380], [1.05, 260], [1.5, 420]];
    const SCROLL = (t) => FLICKS.reduce((y, [t0, d]) => { const u = (t - t0) / 0.45; if (u <= 0) return y; const e = 1 - Math.pow(1 - clamp01(u), 3); const over = u > 0.7 && u < 1.15 ? -10 * Math.sin(((u - 0.7) / 0.45) * Math.PI) : 0; return y + d * e + over; }, 0);
    const feed = (t) => {
      const scroll = SCROLL(t), PITCH = 340;
      g.save(); g.beginPath(); g.rect(0, 118, PW, PH - 188); g.clip();
      POSTS.concat(POSTS).forEach((p, k) => {
        const y = 128 + k * PITCH - scroll;
        if (y > PH || y < -PITCH) return;
        g.fillStyle = [PINE, VERD, BRASS, COPPER, PINE_L][k % 5]; g.beginPath(); g.arc(44, y + 22, 18, 0, 7); g.fill();
        text(p.who, 74, y + 20, SANS(600, 15), INK); text(`${2 + k}m`, 74, y + 38, MONO(11), GREY);
        text(p.what, 24, y + 74, SANS(500, 16), INK);
        // the image comes in from a soft blur and a little scale as it enters the screen
        const enter = smoother((PH - 120 - y) / 260), iy = y + 90;
        g.save(); g.beginPath(); g.roundRect(24, iy, PW - 48, 190, 14); g.clip();
        if (k % 5 === 0) {
          // a gallery: pages sideways once, dots below show which
          const page = smoother((t - 0.8) / 0.3), w = PW - 48;
          cover(IMGS[p.img], 24 - page * w, iy, w, 190); cover(IMGS["art-6"], 24 + w - page * w, iy, w, 190);
        } else {
          g.filter = enter < 1 ? `blur(${((1 - enter) * 6).toFixed(1)}px)` : "none";
          const z = 1.06 - 0.06 * enter; g.translate(24 + (PW - 48) / 2, iy + 95); g.scale(z, z); g.translate(-(24 + (PW - 48) / 2), -(iy + 95));
          cover(IMGS[p.img], 24, iy, PW - 48, 190); g.filter = "none";
        }
        g.restore();
        if (k % 5 === 0) { const page = smoother((t - 0.8) / 0.3); [0, 1].forEach((d) => { g.fillStyle = Math.round(page) === d ? INK : LINE; g.beginPath(); g.arc(PW / 2 - 6 + d * 12, iy + 204, 3, 0, 7); g.fill(); }); }
        // likes count up and the heart pops once the post sits in the middle of the screen
        const mid = clamp01(1 - Math.abs(y + 160 - PH / 2) / 180), likes = 24 + k * 7 + Math.floor(mid * (8 + k));
        const pop = 1 + 0.35 * Math.sin(clamp01(mid) * Math.PI) * (mid > 0.2 ? 1 : 0);
        g.save(); g.translate(30, y + 300); g.scale(pop, pop); text("♥", -6, 6, SANS(600, 15), mid > 0.5 ? COPPER : GREY); g.restore();
        text(`${likes}   ↻ ${3 + k}   ↗`, 44, y + 306, MONO(12), GREY);
      });
      g.restore();
      // header with tabs; the underline slides from Discover to Following and back
      g.fillStyle = PAPER; g.fillRect(0, 0, PW, 118);
      text("Studio", 24, 86, SANS(600, 26), INK);
      text("Discover", 24, 110, SANS(500, 13), INK); text("Following", 104, 110, SANS(500, 13), GREY);
      const tab = smoother((t - 0.3) / 0.25) - smoother((t - 1.25) / 0.25);
      g.fillStyle = PINE; g.fillRect(lerp(24, 104, tab), 114, lerp(58, 64, tab), 3);
      // a "new posts" pill drops in, sits, and leaves
      const pill = smoother((t - 1.2) / 0.2) - smoother((t - 1.75) / 0.2);
      if (pill > 0.01) {
        const py = lerp(90, 136, pill);
        g.globalAlpha = pill; g.fillStyle = PINE; g.beginPath(); g.roundRect(PW / 2 - 64, py, 128, 30, 15); g.fill();
        text("↑ 3 new posts", PW / 2, py + 20, SANS(600, 13), BONE, "center"); g.globalAlpha = 1;
      }
    };
    const LOAD = [PATINA[0], PATINA[1], PATINA[2], PATINA[3]];
    const shot63 = (t) => {
      g.fillStyle = INK; g.fillRect(0, 0, 1920, 1080);
      const tt = t - T63;
      phone(PX[0], () => {
        if (t < T64) {
          // the loader opens large and draws in as the app loads (240 -> 52 px), easing out, changing colour every four
          // frames; each colour change gives it a small push of scale that settles
          const a = lerp(240, 52, smoother(tt / 0.85)), k = (tt * FR / 4) % 1, pulse = 1 + 0.06 * (1 - k) * (1 - k);
          const s2 = a * pulse;
          g.fillStyle = LOAD[Math.floor(tt * FR / 4) % LOAD.length]; tilePath(PW / 2 - s2 / 2, PH / 2 - s2 / 2, s2); g.fill();
        }
        else home(t - T64);
      });
      phone(PX[1], () => feed(tt));
    };

    const draw = (t) => {
      g.clearRect(0, 0, 1920, 1080);
      if (t < T63) shot62(t); else shot63(t);
    };
    const clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, { t: END, duration: END, ease: "none", immediateRender: false, onUpdate: () => draw(clock.t) }, 0);
    window.__hf = window.__hf || {};
    window.__hf.buildReady = window.__hf.buildReady || {};
    window.__hf.buildReady["product"] = Promise.all([document.fonts.load('600 20px "Space Grotesk"'), document.fonts.load('400 20px "Space Grotesk"'), document.fonts.load('400 20px "Plex Mono"'), ...["art-1", "art-2", "art-3", "art-4", "art-5", "art-6"].map(load)]).then(() => draw(clock.t));

    window.__timelines["product"] = tl;
  </script>
</template>

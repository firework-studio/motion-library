<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #ecebe5;
    }
    .abs {
      position: absolute;
    }
    /* Patina paper: bone with a whisper of grain */
    #t-grain {
      inset: 0;
      opacity: 0.12;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    #t-svg {
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
  </style>
  <div id="root" data-composition-id="tile" data-width="1920" data-height="1080">
    <svg id="t-svg" class="abs" viewBox="0 0 1920 1080">
      <defs>
        <!-- pine, lit from the upper left; the stops match how the 3D cube of the next shot is lit, so the hand-over keeps its colour -->
        <linearGradient id="t-pine" gradientUnits="objectBoundingBox" x1="0.1" y1="0" x2="0.9" y2="1">
          <stop offset="0" stop-color="#2b5545" />
          <stop offset="0.55" stop-color="#1c4135" />
          <stop offset="1" stop-color="#16382d" />
        </linearGradient>
        <linearGradient id="t-cu" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#d89a72" />
          <stop offset="0.45" stop-color="#b8704a" />
          <stop offset="1" stop-color="#8a4c2f" />
        </linearGradient>
      </defs>
      <g id="t-shape">
        <path id="t-body" fill="url(#t-pine)" fill-rule="evenodd" />
        <rect id="t-slit" fill="#ecebe5" />
        <path id="t-inner" fill="url(#t-cu)" />
      </g>
    </svg>
    <div id="t-grain" class="abs"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    // a monotone cubic through measured keys, so speeds change without kinks (Fritsch-Carlson)
    const smoothKeys = (K) => {
      const n = K.length, d = [], m = [];
      for (let i = 0; i < n - 1; i++) d.push((K[i + 1][1] - K[i][1]) / (K[i + 1][0] - K[i][0]));
      m.push(d[0]);
      for (let i = 1; i < n - 1; i++) m.push(d[i - 1] * d[i] <= 0 ? 0 : (2 * d[i - 1] * d[i]) / (d[i - 1] + d[i]));
      m.push(d[n - 2]);
      return (t) => {
        if (t <= K[0][0]) return K[0][1];
        if (t >= K[n - 1][0]) return K[n - 1][1];
        let i = 0;
        while (K[i + 1][0] < t) i++;
        const h = K[i + 1][0] - K[i][0], u = (t - K[i][0]) / h, u2 = u * u, u3 = u2 * u;
        return (2 * u3 - 3 * u2 + 1) * K[i][1] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * K[i + 1][1] + (u3 - u2) * h * m[i + 1];
      };
    };
    const clamp01 = (v) => Math.min(1, Math.max(0, v));

    // a square of side s centred on (cx, cy), each corner with its own radius, as a path (clockwise from top-left)
    const rr = (cx, cy, s, [tl_, tr, br, bl]) => {
      const x = cx - s / 2, y = cy - s / 2;
      return `M${x + tl_},${y} H${x + s - tr} A${tr},${tr} 0 0 1 ${x + s},${y + tr} V${y + s - br} A${br},${br} 0 0 1 ${x + s - br},${y + s} ` +
             `H${x + bl} A${bl},${bl} 0 0 1 ${x},${y + s - bl} V${y + tl_} A${tl_},${tl_} 0 0 1 ${x + tl_},${y} Z`;
    };

    // ---------------------------------------------------------------- measured on the reference, frame by frame
    // 0-1.97 s: a disc with one seam, shrinking steadily, turns a quarter turn (starting at 0.33 s, fastest
    // around 1.0 s) and squares off; here it squares off into the Tilo tile: three corners tighten, one stays round
    const SIZE1 = smoothKeys([[0, 493], [0.333, 451], [0.667, 420], [1.0, 385], [1.2, 361], [1.4, 333], [1.6, 298], [1.7, 276], [1.8, 251], [1.867, 229], [1.933, 201], [1.967, 181]]);
    const ROT = smoothKeys([[0, 0], [0.333, 0], [0.5, 4.6], [0.667, 10.5], [0.8, 18.7], [0.9, 28.9], [1.0, 45], [1.1, 61.1], [1.2, 71.4], [1.3, 77.9], [1.4, 82.2], [1.5, 85.1], [1.6, 87.2], [1.7, 88.5], [1.8, 89.4], [1.9, 90]]);
    // corner radius as a share of the side, from the measured fill (a disc is 0.5); the round corner keeps 0.5
    const RAD = smoothKeys([[0, 0.5], [0.4, 0.49], [0.6, 0.44], [0.8, 0.37], [0.9, 0.32], [1.0, 0.27], [1.1, 0.2], [1.2, 0.156], [1.35, 0.12], [1.5, 0.1], [1.7, 0.07], [1.9, 0.035]]);
    const SLIT = smoothKeys([[0, 1], [0.6, 0.62], [0.8, 0.42], [0.9, 0.26], [1.0, 0]]);   // the seam's width, closing
    // 1.85-3.0 s: no cut. The tile swells and a window opens inside it, a gap widening around a square core;
    // the frame then draws in (measured sizes from 2.0 s on) while the core grows, and at 3.0 s frame, window and
    // core meet, so the frame is simply gone and the core is the solid square of the next beat. One colour, one object.
    const OUT2 = smoothKeys([[1.85, 240], [1.93, 430], [2.0, 560], [2.067, 588], [2.133, 562], [2.2, 542], [2.333, 512], [2.467, 486], [2.6, 460],
                             [2.733, 430], [2.8, 414], [2.867, 384], [2.933, 330], [3.0, 243]]);
    const HOLE = smoothKeys([[1.85, 150], [1.93, 300], [2.0, 420], [2.067, 410], [2.133, 397], [2.267, 374], [2.4, 360], [2.533, 350], [2.667, 342],
                             [2.8, 336], [2.867, 318], [2.933, 290], [3.0, 243]]);
    const HOLER = smoothKeys([[1.85, 0.12], [2.0, 0.5], [2.4, 0.49], [2.6, 0.46], [2.733, 0.42], [2.867, 0.32], [2.933, 0.18], [3.0, 0]]);
    const INNER = smoothKeys([[1.85, 150], [2.0, 144], [2.133, 128], [2.267, 124], [2.4, 124], [2.533, 130], [2.667, 144], [2.8, 167], [2.867, 186],
                              [2.933, 212], [3.0, 243]]);
    const FRAMER = smoothKeys([[1.85, 0.5], [2.0, 0.08], [2.8, 0.07], [3.0, 0]]);    // the tile's round corner settles to a frame corner
    // 3.0-4.2 s: a solid square: it swells to 339 by 3.4 s, holds, then draws in faster and faster
    const SIZE3 = smoothKeys([[3.0, 243], [3.067, 277], [3.133, 303], [3.2, 319], [3.267, 329], [3.333, 337], [3.4, 339], [3.5, 339], [3.567, 335],
                              [3.633, 329], [3.7, 323], [3.767, 313], [3.833, 299], [3.9, 281], [3.967, 251], [4.033, 205], [4.1, 170], [4.2, 153], [4.3, 153]]);   // it comes to rest at 4.2 s, so the cube takes over from stillness

    const body = document.getElementById("t-body");
    const slit = document.getElementById("t-slit");
    const inner = document.getElementById("t-inner");
    const shape = document.getElementById("t-shape");
    const CX = 960, CY = 540;
    const place = (t) => {
      if (t < 1.85) {
        const s = SIZE1(t), r = RAD(t) * s;
        // start with the round corner at the top left, so a quarter turn brings it to the top right
        body.setAttribute("d", rr(CX, CY, s, [s / 2, r, r, r]));
        const w = SLIT(t) * s * 0.045;
        slit.setAttribute("x", CX - s / 2 - 2); slit.setAttribute("y", CY - w / 2);
        slit.setAttribute("width", s / 2 + 2); slit.setAttribute("height", w);
        slit.setAttribute("opacity", w > 0.3 ? 1 : 0);
        inner.setAttribute("d", "");
        shape.setAttribute("transform", `rotate(${ROT(t)} ${CX} ${CY})`);
      } else if (t < 3.0) {
        const s = OUT2(t), h = Math.min(HOLE(t), s), hr = HOLER(t) * h;
        const k = Math.min(0.07, FRAMER(t)) * s, kr = FRAMER(t) * s, q = Math.min(INNER(t), h);
        // frame with its window, and the core, all pine; the window shows the paper between them
        body.setAttribute("d", rr(CX, CY, s, [k, kr, k, k]) + " " + rr(CX, CY, h, [hr, hr, hr, hr]) + " " + rr(CX, CY, q, [0, 0, 0, 0]));
        slit.setAttribute("opacity", 0);
        inner.setAttribute("d", "");
        shape.setAttribute("transform", "");
      } else {
        // the last shape is a plain square, as the reference: the grid that follows is built from squares
        const s = SIZE3(t);
        // its corners carry the same small round as the cube's bevelled edges in the next shot
        const c = 0.05 * s;
        body.setAttribute("d", rr(CX, CY, s, [c, c, c, c]));
        inner.setAttribute("d", "");
        slit.setAttribute("opacity", 0);
        shape.setAttribute("transform", "");
      }
    };
    const clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, { t: 4.2, duration: 4.2, ease: "none", immediateRender: false, onUpdate: () => place(clock.t) }, 0);
    place(0);

    window.__timelines["tile"] = tl;
  </script>
</template>

<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #ecebe5;
    }
    #co-cv {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
    #co-grain {
      position: absolute;
      inset: 0;
      opacity: 0.12;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
  </style>
  <div id="root" data-composition-id="colour" data-width="1920" data-height="1080">
    <canvas id="co-cv" width="1920" height="1080"></canvas>
    <div id="co-grain"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const clamp01 = (v) => Math.min(1, Math.max(0, v));
    const smoother = (u) => { u = clamp01(u); return u * u * u * (u * (u * 6 - 15) + 10); };
    const lerp = (a, b, u) => a + (b - a) * u;
    const hash = (n) => { const v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
    const cv = document.getElementById("co-cv");
    const g = cv.getContext("2d");

    // ---------------------------------------------------------------- the palette (brand sheet v3, "Patina")
    // brand sheet v3 only; the thread through 41-43 is copper, the metal the patina grows from
    const C = {
      ink: "#0d1a16", pine: "#1c4135", spruce: "#22503f", verdigris: "#4f8a78", celadon: "#a9c4b6", mist: "#dde5df",
      lichen: "#7e968c", slate: "#5c6f70", copper: "#b8704a", brass: "#c49a5a", oxide: "#a85d48",
    };
    const CUT42 = 1.07, CUT43 = 2.1, END = 3.13;
    // a module: the opening tiles' material: lit from the upper left (a gentle gradient, lighter to darker), a 5 %
    // corner, no shadow
    const shade = (hex, k) => {
      const n = parseInt(hex.slice(1), 16), f = (v) => Math.round(Math.min(255, Math.max(0, k > 0 ? v + (255 - v) * k : v * (1 + k))));
      return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
    };
    const block = (x, y, s, rot, col) => {
      g.save();
      g.translate(x, y); g.rotate(rot);
      const gr = g.createLinearGradient(-s / 2, -s / 2, s / 2, s / 2);
      gr.addColorStop(0, shade(col, 0.14)); gr.addColorStop(0.55, col); gr.addColorStop(1, shade(col, -0.12));
      g.fillStyle = gr;
      g.beginPath(); g.roundRect(-s / 2, -s / 2, s, s, s * 0.05); g.fill();
      g.restore();
    };

    // ---------------------------------------------------------------- the specks, through all three shots
    // Small squares in the palette fall in toward the centre as if drawn into a black hole: each starts beyond the
    // frame edge and comes in on a slowly tightening spiral, faster and faster (r = R(1-p)^0.55, so the speed keeps
    // rising), shrinking and turning as it nears, and is gone behind the subject; new ones keep coming from outside.
    // Every speck has its own period and phase, so the stream is steady and never in step.
    const SPECK = [C.pine, C.brass, C.copper, C.verdigris, C.lichen, C.oxide, C.ink, C.slate, C.celadon];
    const specks = (t) => {
      for (let i = 0; i < 34; i++) {
        const h = (k) => hash(i * 13 + k);
        const period = 1.3 + 1.2 * h(1), p = ((t + h(2) * period) / period) % 1;
        const R = 1150 + 250 * h(3), r = R * Math.pow(1 - p, 0.55);
        if (r < 60) continue;
        const a = h(4) * Math.PI * 2 + 0.9 * Math.pow(1 - r / R, 2);   // the spiral tightens as it falls in
        const x = 960 + Math.cos(a) * r, y = 540 + Math.sin(a) * r * 0.9;
        const s = (8 + 18 * h(5)) * Math.pow(r / R, 0.45);
        g.save();
        g.translate(x, y); g.rotate(h(6) * 3 + 2.5 * p);
        g.fillStyle = SPECK[i % SPECK.length];
        g.fillRect(-s / 2, -s / 2, s, s);
        g.restore();
      }
    };

    // ---------------------------------------------------------------- 41 (0-1.07 s): one pine block
    // A hard cut to a large pine block (830 px) centred; it draws in (to 650 px) and slowly turns clockwise (16 degrees).
    const shot41 = (t) => {
      const u = smoother(t / 1.07);
      block(960, 540, lerp(830, 650, u), lerp(0, 0.28, smoother((t - 0.15) / 0.92)), C.copper);
    };

    // ---------------------------------------------------------------- 42 (1.07-2.1 s): the neutrals
    // As the reference: a hard cut to four blocks that keep the big block's clockwise lean, strung down a diagonal
    // (celadon top left, mist top right and higher, pine under the celadon, ink low right). Each straightens
    // (anticlockwise) as it slides to its place in a loose, upright 2 x 2: pine out to the right, ink across to the
    // lower left (their paths never cross), each a beat behind the last. They rest, then the group turns clockwise
    // again, into the cut.
    const LEAN = 0.36;
    // spaced so that no two ever touch while they move (centres at least a block and a bit apart); their centre of
    // mass sits on the frame centre at the end, so the group turns about the middle and hands over to a centred 43
    const N4 = [
      { col: C.slate, a: [-130, -200], b: [-190, -178] },
      { col: C.mist, a: [140, -240], b: [190, -193] },
      { col: C.copper, a: [-70, 70], b: [175, 67] },
      { col: C.ink, a: [150, 330], b: [-175, 312] },
    ];
    // One turn runs through 42 and 43 without a break, so the cut hides inside the motion: the group starts turning
    // clockwise late in 42, gathering speed (ease-in), is at full speed at the cut, and 43 carries straight on at
    // that speed, letting it die away (exponential). The scale likewise runs on across the cut.
    const SPIN0 = CUT42 + 0.45, SPINA = CUT43 - SPIN0, V0 = (2 * 0.3) / SPINA, TAU = 0.28;
    const SPIN1 = CUT43 + 0.6;
    const GRP = (t) => t < SPIN0 ? 0 : t < CUT43 ? 0.3 * Math.pow((t - SPIN0) / SPINA, 2)
      : 0.3 + V0 * TAU * (1 - Math.exp(-(t - CUT43) / TAU)) + (t > SPIN1 ? 0.3 * Math.pow((t - SPIN1) / (END - SPIN1), 2) : 0);
    const Z42 = 0.92, ZOOM = (t) => (t < CUT43 ? 1 - (1 - Z42) * smoother((t - CUT42) / (CUT43 - CUT42)) : Z42);
    const shot42 = (t) => {
      const tt = t - CUT42, grp = GRP(t), z = ZOOM(t);
      const c = Math.cos(grp), s = Math.sin(grp);
      N4.forEach((m, k) => {
        const u = smoother((tt - 0.04 * k) / 0.5);
        const x = lerp(m.a[0], m.b[0], u) * z, y = lerp(m.a[1], m.b[1], u) * z;
        // until it has straightened, a block leans with the shot's opening lean; after, with the group
        const lean = LEAN * (1 - u);
        const cx = lerp(Math.cos(LEAN) * x - Math.sin(LEAN) * y, x, u), cy = lerp(Math.sin(LEAN) * x + Math.cos(LEAN) * y, y, u);
        block(960 + cx * c - cy * s, 540 + cx * s + cy * c, 230 * z, grp + lean, m.col);
      });
    };

    // ---------------------------------------------------------------- 43 (2.1-3.13 s): the whole palette
    // Built from the reference, tracked block by block (32.47-33.47 s there). Two layers:
    // - the group: a scale curve (1 -> 0.65 -> 0.36, quickening at the end) and a turn that first carries the
    //   neutrals' clockwise momentum (about 10 degrees, slowing to a stop by 0.37 s) and from 0.57 s turns clockwise
    //   again, faster and faster (to +40 degrees), into the cut;
    // - the blocks: each slides from its start spot to its end spot in the group's frame over its first half second,
    //   some outward (rose right, terracotta left, sage up), some inward (jade left, ochre up), so the cluster
    //   reshuffles as it turns and recedes. Spots are in block units (one unit = the block's size at the cut),
    //   measured on the reference. The cluster is centred throughout, like the neutrals before it.
    const P8 = [
      { col: C.copper, a: [1.82, -0.06], b: [1.04, -0.19], d: 0.45 },
      { col: C.oxide, a: [1.51, -1.28], b: [2.8, -0.48], d: 0.34, arc: -0.35 },
      { col: C.verdigris, a: [0.88, 1.97], b: [0.97, 1.97], d: 0.4 },
      { col: C.lichen, a: [-2.1, 0.72], b: [-2.07, 1.04], d: 0.42 },
      { col: C.brass, a: [-0.09, 1.5], b: [-0.02, 0.88], d: 0.38 },
      { col: C.pine, a: [-1.12, -1.82], b: [-2.35, -1.07], d: 0.36 },
      { col: C.celadon, a: [-0.18, -1.13], b: [0.77, -2.08], d: 0.43 },
      { col: C.slate, a: [-0.73, 0.1], b: [-1.13, -0.08], d: 0.37 },
    ];
    // the reference's curves, one value per frame from the cut (30 fps)
    const S8 = [1, .988, .972, .956, .942, .924, .903, .879, .857, .837, .817, .794, .771, .749, .725, .701, .68, .663, .648, .636, .624, .603, .588, .571, .553, .532, .509, .484, .454, .415, .363];
    const B8 = [172, 171, 170, 168, 167, 166, 165, 164, 162, 161, 159, 158, 156, 154, 152, 150, 148, 145, 143, 140, 137, 134, 131, 127, 123, 119, 114, 108, 101, 93, 82].map((v) => v / 172);
    const curve = (arr, tt) => { const f = clamp01(tt / 1.0) * (arr.length - 1), i = Math.min(arr.length - 2, Math.floor(f)); return lerp(arr[i], arr[i + 1], f - i); };
    const out3 = (u) => 1 - Math.pow(1 - clamp01(u), 3);
    const ROT8 = (tt) => GRP(CUT43) + 0.175 * (1 - Math.exp(-tt / 0.13)) + 0.52 * Math.pow(clamp01((tt - 0.57) / 0.46), 2);
    const shot43 = (t) => {
      // the spots were measured in screen axes, so the layout only takes the turn added after the cut; the blocks
      // themselves keep their full lean, continuous with the neutrals
      const tt = t - CUT43, U = 172, rot = ROT8(tt), sc = curve(S8, tt), bs = curve(B8, tt);
      const lr = rot - GRP(CUT43), c = Math.cos(lr), s = Math.sin(lr);
      // as the reference: the cluster is centred from the first frame (its spots average to the origin); what carries
      // across the cut is the turn, not a block's position
      const cx = 960, cy = 540;
      P8.forEach((m, k) => {
        const u = out3(tt / m.d);
        // the layout is opened 12 % beyond the reference's and the rose arcs up round the jade, so no two modules
        // ever touch (checked frame by frame: the smallest gap is 0.04 of a block)
        const lx = lerp(m.a[0], m.b[0], u) * U * sc * 1.12, ly = (lerp(m.a[1], m.b[1], u) + (m.arc || 0) * Math.sin(Math.PI * u)) * U * sc * 1.12;
        const sz = U * bs;
        block(cx + lx * c - ly * s, cy + lx * s + ly * c, sz, rot, m.col);
      });
    };

    const draw = (t) => {
      g.clearRect(0, 0, 1920, 1080);
      specks(t);
      if (t < CUT42) shot41(t);
      else if (t < CUT43) shot42(t);
      else shot43(t);
    };
    const clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, { t: END, duration: END, ease: "none", immediateRender: false, onUpdate: () => draw(clock.t) }, 0);
    draw(0);

    window.__timelines["colour"] = tl;
  </script>
</template>

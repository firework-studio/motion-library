    };

    const pilcrow = el("path", { fill: BONE });

    // the &: built from strokes so its top loop can really open (proportions measured on the reference). A round

      const free = JA - Math.PI * 2 + Math.PI * 0.72 * open;   // closed: a full turn back to J; open: at mid right, where the stroke is vertical and the cut lies flat

      const cb = (p0, p1, p2, p3, v) => p0.map((_, i) => Math.pow(1 - v, 3) * p0[i] + 3 * Math.pow(1 - v, 2) * v * p1[i] + 3 * (1 - v) * v * v * p2[i] + v * v * v * p3[i]);

    };

    // the rest of the wall

    const textStyle = (size, ss) => `font-family:'Space Grotesk';font-weight:700;font-size:${size}px;${ss ? `font-feature-settings:'${ss}';` : ""}`;

    const TS = 0.8 * U;
    const digs = DIG.map((d) => {

    });
    const wall = (t) => {
      const o = OPEN(t), cp = (1.27 + 0.6 * o) * U, rp = (1.32 + 0.45 * o) * U, mid = ROW0.indexOf("@");
      cam.setAttribute("transform", `translate(960 540) scale(${(CAMH(t) / U).toFixed(5)})`);

    // ---------------------------------------------------------------- 33 (2.0-3.15 s): the character set

    const TROWS = ["ĆĈĊČĎĐÈÉÊËĒĔĖĘĚĜĞĠĢĤĦĨĪĬĮ", "ĹĻĽĿŁÑŃŅŇŊÒÓÔÕÖØŌŎŐŒŔŖŘŚŜ", "ÙÚÛÜŨŪŬŮŰŲŴẀẂẄŶŸỲÝŹŻŽÀÁÂÃ", "ćĉċčďđèéêëēĕėęěĝğġģĥħĩīĭį", "ĺļľŀłñńņňŋòóôõöøōŏőœŕŗřśŝ", "ùúûüũūŭůűųŵẁẃẅŷÿỳýźżžàáâã", "ħĥhḥmnńņňñŋrŕřŗuúùûüűūůųw", "9012345678901234567890123", "½⅓⅔¼¾⅛⁰¹²³⁴⁵⁶⁷⁸⁹₀₁₂₃₄₅₆₇₈", "!¡?¿.,:;…·•*#/\\|¦‹›«»“”‘’", "()[]{}§¶©®™°†‡ℓ№℮ΩΔπµ$¢£¥", "€₹₺₽₿₩₦₫₭₱₲₵₡₣₤₧+-×÷=<>±%", "%‰←↑→↓↔↕↖↗↘ƒɑəȷıĳŀßþðæœ&@", "ǍǎǏǐǑǒǓǔǕǖǗǘǙǚǛǜǦǧǪǫǺǻǼǽǾ", "ȘșȚțḌḍḤḥḶḷṂṃṄṅṆṇṚṛṢṣṬṭẞẠạ", "ẢảẤấẦầẨẩẪẫẬậẮắẰằẸẹẺẻẼẽẾếỀ"].map((r) => [...r]);
    const TC = 25, TR = 16, AC = 11, AR = 6.5;                 // the anchor: between the r (row 6) and the 0 (row 7)
    const A0 = [902, 432], A1 = [960 + (AC - 12) * 69, 30 + AR * 70];
    const FR = 30;
    const cellsT = [];

    // 34 (from 1.15 s after the cut, 1.0 s): the camera keeps pulling back (pitch 69 -> 31 px) and the table turns

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const T0 = 31.0;   // this composition starts at 31.0 s on the root; times below are written as root seconds - T0
    const smoothKeys = (K) => {
      const n = K.length, d = [], m = [];
      for (let i = 0; i < n - 1; i++) d.push((K[i + 1][1] - K[i][1]) / (K[i + 1][0] - K[i][0]));
      m.push(d[0]);
      for (let i = 1; i < n - 1; i++) m.push(d[i - 1] * d[i] <= 0 ? 0 : (2 * d[i - 1] * d[i]) / (d[i - 1] + d[i]));
      m.push(d[n - 2]);
      return (t) => {
        if (t <= K[0][0]) return K[0][1];
        if (t >= K[n - 1][0]) return K[n - 1][1];
        let i = 0;
        while (K[i + 1][0] < t) i++;
        const h = K[i + 1][0] - K[i][0], u = (t - K[i][0]) / h, u2 = u * u, u3 = u2 * u;
        return (2 * u3 - 3 * u2 + 1) * K[i][1] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * K[i + 1][1] + (u3 - u2) * h * m[i + 1];
      };
    };
    const col = (K, i) => smoothKeys(K.map((k) => [k[0], k[i]]));
    const clamp01 = (v) => Math.min(1, Math.max(0, v));
    const ease01 = (v) => { const u = Math.min(1, Math.max(0, v)); return u * u * (3 - 2 * u); };

    // ---------------------------------------------------------------- the camera, measured on the reference
    // [time, scale, screen x of the reply's centre, screen y of the reply's top]: it pulls back from the reply to the
    // whole conversation (31.0-32.2 s), then the conversation slides up and away until only the input is left
    const CAM = [[31.0, 0.855, 991, 362], [31.067, 0.847, 986, 360], [31.233, 0.813, 978, 340], [31.4, 0.751, 960, 292],
                 [31.567, 0.613, 926, 192], [31.733, 0.521, 898, 120], [31.9, 0.471, 886, 92], [32.067, 0.438, 882, 72],
                 [32.233, 0.425, 876, 60], [32.567, 0.408, 876, 64], [32.9, 0.4, 876, 40], [33.233, 0.397, 876, -8],
                 [33.567, 0.394, 874, -194], [33.733, 0.392, 873, -226], [33.9, 0.39, 873, -238], [34.067, 0.39, 873, -246], [34.5, 0.39, 873, -246]];
    const cS = col(CAM, 1), cX = col(CAM, 2), cY = col(CAM, 3);
    // the planet rises in behind it, fading up (its top edge, px)
    const PLANET = smoothKeys([[32.75, 150], [33.3, 90], [34.0, 62], [34.5, 58], [35.7, 52]]);
    const planetOp = (t) => clamp01((t - 32.75) / 0.5);
    // the conversation fades from the top down as it leaves: [element, fade start]
    const FADES = [["#k-card", 33.0], ["#k-m1", 33.2], ["#k-m2", 33.35], ["#k-m3", 33.48], ["#k-chips", 33.55], ["#k-panel", 33.35]];

    // ---------------------------------------------------------------- the planet (WebGL), the same moon as before
    const pc = document.getElementById("k-planet");
    const pgl = pc.getContext("webgl", { premultipliedAlpha: true, preserveDrawingBuffer: true, antialias: true });
    let pReady = false, uTime, uC, uR;
    (function build() {
      const vs = "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
      const fs = `
        precision highp float;
        uniform float time; uniform vec2 C; uniform float R;
        mat3 tr3(mat3 m) { return mat3(m[0][0], m[1][0], m[2][0], m[0][1], m[1][1], m[2][1], m[0][2], m[1][2], m[2][2]); }
        float h3(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
        float n3(vec3 x) {
          vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
          return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),
                     mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z);
        }
        float fbm(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 6; i++) { s += a * n3(p); p *= 2.03; a *= 0.5; } return s; }
        float craters(vec3 p) {
          vec3 i = floor(p), f = fract(p); float c = 0.0;
          for (int z = -1; z <= 1; z++) for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
            vec3 o = vec3(float(x), float(y), float(z));
            vec3 j = vec3(h3(i + o), h3(i + o + 7.1), h3(i + o + 13.7));
            float r = 0.18 + 0.32 * h3(i + o + 3.3);
            float d = length(o + j - f) / r;
            if (d < 1.25) c += (smoothstep(1.0, 0.0, d) * -0.6 + smoothstep(0.85, 1.0, d) * smoothstep(1.25, 1.0, d) * 0.5) * step(0.45, h3(i + o + 5.5));
          }
          return c;
        }
        float surface(vec3 n) {
          float m = smoothstep(0.42, 0.62, fbm(n * 2.2));
          return -0.3 * m + 0.35 * fbm(n * 6.0) + 0.15 * fbm(n * 24.0) + 0.06 * craters(n * 5.0) + 0.03 * craters(n * 13.0);
        }
        void main() {
          vec2 sp = vec2(gl_FragCoord.x, 1080.0 - gl_FragCoord.y);
          vec2 d = (sp - C) / R;
          float rr = dot(d, d);
          if (rr > 1.0) discard;
          vec3 n = vec3(d.x, -d.y, sqrt(1.0 - rr));
          float a = time * 0.08;
          mat3 rot = mat3(cos(a), 0.0, -sin(a), 0.0, 1.0, 0.0, sin(a), 0.0, cos(a));
          vec3 q = rot * n;
          float e = 0.004;
          float h0 = surface(q);
          vec3 g = tr3(rot) * (vec3(surface(q + vec3(e,0,0)), surface(q + vec3(0,e,0)), surface(q + vec3(0,0,e))) - h0) / e;
          vec3 bn = normalize(n - (g - dot(g, n) * n) * 0.03);
          // lit from above and a little in front, so the upper face shows its surface and the limb glows faintly
          vec3 L = normalize(vec3(-0.25, 0.8, 0.25));
          float lit = max(dot(bn, L), 0.0);
          float albedo = 0.55 + 0.45 * (h0 + 0.35);
          // kept dark, as the reference: a dim surface, the light only really catching the upper limb
          vec3 col = vec3(0.86, 0.85, 0.9) * albedo * (pow(lit, 1.6) * 0.2 + 0.012);
          col += vec3(0.9, 0.88, 0.95) * pow(1.0 - n.z, 5.0) * smoothstep(0.1, 0.7, n.y) * 0.14;
          float edge = smoothstep(1.0, 0.993, rr);
          gl_FragColor = vec4(col * edge, edge);
        }`;
      const sh = (type, src) => { const o = pgl.createShader(type); pgl.shaderSource(o, src); pgl.compileShader(o); return o; };
      const prog = pgl.createProgram();
      pgl.attachShader(prog, sh(pgl.VERTEX_SHADER, vs)); pgl.attachShader(prog, sh(pgl.FRAGMENT_SHADER, fs));
      pgl.linkProgram(prog); pgl.useProgram(prog);
      const buf = pgl.createBuffer(); pgl.bindBuffer(pgl.ARRAY_BUFFER, buf);
      pgl.bufferData(pgl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), pgl.STATIC_DRAW);
      const loc = pgl.getAttribLocation(prog, "p"); pgl.enableVertexAttribArray(loc); pgl.vertexAttribPointer(loc, 2, pgl.FLOAT, false, 0, 0);
      uTime = pgl.getUniformLocation(prog, "time"); uC = pgl.getUniformLocation(prog, "C"); uR = pgl.getUniformLocation(prog, "R");
      pgl.viewport(0, 0, 1920, 1080);
      pReady = true;
    })();
    const R_PLANET = 824;
    const drawPlanet = (t) => {
      if (!pReady) return;
      pgl.clearColor(0, 0, 0, 0); pgl.clear(pgl.COLOR_BUFFER_BIT);
      pgl.uniform1f(uTime, t); pgl.uniform2f(uC, 960, PLANET(t) + R_PLANET); pgl.uniform1f(uR, R_PLANET);
      pgl.drawArrays(pgl.TRIANGLE_STRIP, 0, 4);
    };

    const INW = smoothKeys([[34.067, 738], [34.233, 420], [34.3, 327], [34.367, 234], [34.433, 189], [34.5, 163], [34.567, 147], [34.633, 137], [34.7, 131], [34.9, 132], [35.033, 138], [35.1, 144], [35.167, 154], [35.233, 175], [35.3, 205], [35.367, 220], [35.433, 228], [35.5, 234], [35.567, 238], [35.633, 242], [35.7, 244], [35.767, 246], [36.0, 248]]);
    const cam = document.getElementById("k-cam");
    const input = document.getElementById("k-input");
    const inner = document.getElementById("k-inputInner");
    const dot = document.getElementById("k-dot");
    const place = (lt) => {
      const t = lt + T0;
      const s = cS(t);
      // as the conversation leaves, ease the camera so the input lands exactly where the next shot's icon block sits
      // (960, 536); without this it hands over 8 px left and 6 px high and the block visibly jumps
      const k = ease01((t - 33.2) / 0.85);
      const ox = 8.4 * k, oy = 6.3 * k;
      gsap.set(cam, { scale: s, x: cX(t) - 1000.5 * s + ox, y: cY(t) - 369 * s + oy });
      // the panel round the conversation shows once the camera is far enough back to see its edges
      // the rest of the conversation comes up out of the dark as the camera pulls back (31.1-31.7 s); the card above
      // stays dim; then everything fades from the top down as it leaves
      const reveal = { "#k-card": 0.35, "#k-m1": 1 };
      FADES.forEach(([sel, f]) => {
        let o = 1 - clamp01((t - f) / 0.28);
        const r = sel in reveal ? reveal[sel] : 1;
        if (sel !== "#k-m1" && sel !== "#k-panel") { const u = clamp01((t - 31.1) / 0.6); o *= r * u * u * (3 - 2 * u); }
        if (sel === "#k-panel") o *= clamp01((t - 31.35) / 0.25);
        document.querySelector(sel).style.opacity = o;
      });
      lightSweep(t);
      // the planet stays under the icon, then fades away (35.3-35.65 s); the input hands over to the icon at 34.5 s
      document.getElementById("k-planet").style.opacity = planetOp(t) * (1 - clamp01((t - 35.3) / 0.35));
      cam.style.visibility = t < 34.5 ? "visible" : "hidden";
      dot.style.visibility = t < 34.5 ? "visible" : "hidden";
      drawPlanet(t);
      // the input empties (33.95 s), then draws in to a small rounded square (34.07-34.4 s)
      inner.style.opacity = (1 - clamp01((t - 33.92) / 0.12)) * (0.2 + 0.8 * clamp01((t - 31.1) / 0.6));
      input.style.opacity = 0.2 + 0.8 * clamp01((t - 31.1) / 0.6);
      // its screen width follows the reference frame by frame (the next shot carries on along the same curve);
      // it settles to the height of a square as it narrows
      const sw = INW(t), u = clamp01((t - 34.067) / 0.33), e = u * u * (3 - 2 * u);
      const w = sw / s, h = Math.min(284 + (338 - 284) * e, w);
      gsap.set(input, { width: w, height: h, x: (1892 - w) / 2, y: (284 - h) / 2, borderRadius: Math.min(142 - (142 - 70) * e, h / 2) });
      // a small dot settles in its middle as it squares off, the seed of what comes next
      const dx = cX(t) + (1202 - 1000.5) * s + ox, dy = cY(t) + (2358 - 369) * s + oy;
      gsap.set(dot, { x: dx, y: dy, opacity: 0 });   // (the next shot opens its own well in the block; a dot here only flickers)
    };
    // the quick actions sit inside the panel, spanning exactly the input's width (256-2148)
    const fitChips = () => {
      const c = document.getElementById("k-chips");
      c.style.transform = "none";
      c.style.transform = `scale(${Math.min(1, 1892 / c.scrollWidth)})`;
    };
    fitChips();
    window.__hf = window.__hf || {};
    window.__hf.buildReady = window.__hf.buildReady || {};
    window.__hf.buildReady["pullback-chips"] = document.fonts.load('500 84px "Inter"').then(fitChips);
    // ---------------------------------------------------------------- the light, in three passes (31.45-32.65 s)
    // as on the reference: first the right edge catches it, running down; then a slanted sheen crosses the face of
    // the screen from top to bottom; last the left edge lights, running up. Panel-local y of each band's centre.
    const pass = (t, t0, d, from, to) => {
      const u = clamp01((t - t0) / d), e = u * u * (3 - 2 * u);
      return { y: from + (to - from) * e, on: Math.sin(Math.PI * u) };
    };
    const BUBBLES = [...document.querySelectorAll("#k-cam .k-bub")];
    const lightSweep = (t) => {
      const R = pass(t, 31.45, 0.5, -400, 3600);
      const F = pass(t, 31.75, 0.5, -500, 3700);
      const L = pass(t, 32.1, 0.55, 3600, -400);
      gsap.set(["#k-edgeR", "#k-edgeRg"], { y: R.y - 750, opacity: R.on });
      gsap.set("#k-sheen", { y: F.y - 650, opacity: F.on });
      gsap.set(["#k-edgeL", "#k-edgeLg"], { y: L.y - 750, opacity: L.on });
      // each bubble's top edge and face catch the sheen as it passes over them
      BUBBLES.forEach((b) => {
        const by = b.offsetTop + 560;   // in panel coordinates
        const k = Math.exp(-Math.pow((by - F.y) / 420, 2)) * F.on;
        b.style.boxShadow = `inset 0 3px 0 rgba(255, 240, 228, ${0.08 + 0.45 * k}), inset 0 0 0 2px rgba(255, 210, 180, ${0.06 + 0.16 * k}), inset 0 120px 120px -80px rgba(255, 240, 228, ${0.1 * k})`;
      });
    };
    const clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, { t: 35.7 - T0, duration: 35.7 - T0, ease: "none", immediateRender: false, onUpdate: () => place(clock.t) }, 0);
    place(0);

    window.__timelines["pullback"] = tl;
  </script>
</template>

  <script>
    window.__timelines = window.__timelines || {};

    // The rim's corner in the reference, measured every frame (film time, x of the vertical edge, y of the bottom edge).
    // The rig is scaled about (1700, 0) so the bottom edge lands on y, then shifted so the side lands on x.
    const CAM = [
      [2.55, 560, 700], [2.567, 551, 713], [2.6, 536, 752], [2.633, 523, 793], [2.667, 513, 812], [2.7, 505, 834],
      [2.733, 498, 858], [2.767, 491, 871], [2.8, 485, 885], [2.833, 480, 898], [2.867, 475, 910], [2.9, 470, 920],

    tl.fromTo("#p-mod2", { opacity: 0, scale: 0.64 }, { opacity: 0.5, duration: 0.25, ease: "sine.out", immediateRender: false }, 1.3);

    tl.to("#p-mod3", { scale: 1, duration: 0.7, ease: "power2.out" }, 1.4);

    // ---------------------------------------------------------------- the lens opens and grows the icon
    // Everything grows at once and without stops, each on one long ease-out (sizes fitted to the reference frame by frame)
    gsap.set(["#p-plate", "#p-icon"], { svgOrigin: "0 0" });
    // housing: from nothing at 4.0 s, edge only at first, widening continuously until about 4.85 s
    tl.fromTo("#p-plate", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "sine.out", immediateRender: false }, 1.4);
    tl.fromTo("#p-plate", { scale: 0.42 }, { scale: 1, duration: 1.45, ease: "power2.out", immediateRender: false }, 1.4);
    tl.fromTo("#p-plateBase", { attr: { "fill-opacity": 0 } }, { attr: { "fill-opacity": 0.9 }, duration: 0.6, ease: "sine.inOut", immediateRender: false }, 1.6);
    // lens: a small ring at 4.1 s that opens into the dark disk, r 30 -> 165 on one curve (ref: 93 at 4.2, 124 at 4.4, 160 at 4.8)
    tl.fromTo("#p-lens", { attr: { r: 30, "fill-opacity": 0, "stroke-opacity": 0.7 } }, { attr: { r: 165 }, duration: 0.75, ease: "power2.out", immediateRender: false }, 1.85);
    tl.to("#p-lens", { attr: { "fill-opacity": 1, "stroke-opacity": 0.22 }, duration: 0.3, ease: "sine.inOut" }, 1.92);
    tl.to("#p-lens", { attr: { fill: "#ffd9c4", "fill-opacity": 0.05, "stroke-opacity": 0.4 }, duration: 0.45, ease: "sine.inOut" }, 2.35);

    // ---------------------------------------------------------------- wind-up and bloom into the next shot

    const fx = { streak: 0, streakY: -150 };

    tl.fromTo(fxNeon, { v: 0 }, { v: 0.75, duration: 0.45, ease: "sine.inOut", immediateRender: false }, 2.2);

    tl.to("#p-pixel", { opacity: 0, duration: 0.25, ease: "sine.in" }, 3.3);

    // the LED halo lights at the icon's edge (5.70 s) and spreads: r 260 -> 620 by 5.97 s, then floods
    // measured on the reference: the disc grows evenly from the icon's edge, slowly for the first 0.1 s, then at a steady
    // ~2600 px/s (r 260 -> 390 by 5.80 s -> 1160 by 6.10 s), until it fills the phone
    tl.fromTo(["#p-ledLayer", "#p-envLit"], { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "sine.out", immediateRender: false }, 3.15);
    tl.fromTo(["#p-ledGlow", "#p-ledReach"], { attr: { r: 260 } }, { attr: { r: 390 }, duration: 0.1, ease: "sine.in", immediateRender: false }, 3.15);
    tl.to(["#p-ledGlow", "#p-ledReach"], { attr: { r: 1160 }, duration: 0.3, ease: "none" }, 3.25);
    tl.to(["#p-ledGlow", "#p-ledReach"], { attr: { r: 1600 }, duration: 0.2, ease: "sine.out" }, 3.55);

    tl.fromTo("#p-shade", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none", immediateRender: false }, 3.35);


    // ---------------------------------------------------------------- the moon, drawn and slowly turning (WebGL)
    // a procedural moon behind the phone: lit from the upper right, craters and maria from noise, rotating
    const mc = document.getElementById("p-moon");
    const mgl = mc.getContext("webgl", { premultipliedAlpha: true, preserveDrawingBuffer: true, antialias: true });
    let moonReady = false, mTime;
    (function buildMoon() {
      const vs = "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
      const fs = `
        precision highp float;
        uniform float time;
        const vec2 C = vec2(480.0, 620.0);
        const float R = 505.0;
        mat3 tr3(mat3 m) { return mat3(m[0][0], m[1][0], m[2][0], m[0][1], m[1][1], m[2][1], m[0][2], m[1][2], m[2][2]); }
        float h3(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }

                     mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z);
        }
        float fbm(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 6; i++) { s += a * n3(p); p *= 2.03; a *= 0.5; } return s; }
        // craters: a jittered lattice of pits, each with a raised rim
        float craters(vec3 p) {
          vec3 i = floor(p), f = fract(p); float c = 0.0;
          for (int z = -1; z <= 1; z++) for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
            vec3 o = vec3(float(x), float(y), float(z));
            vec3 j = vec3(h3(i + o), h3(i + o + 7.1), h3(i + o + 13.7));
            float r = 0.18 + 0.32 * h3(i + o + 3.3);
            float d = length(o + j - f) / r;
            if (d < 1.25) c += (smoothstep(1.0, 0.0, d) * -0.6 + smoothstep(0.85, 1.0, d) * smoothstep(1.25, 1.0, d) * 0.5) * step(0.45, h3(i + o + 5.5));
          }
          return c;
        }
        float surface(vec3 n) {
          float m = smoothstep(0.42, 0.62, fbm(n * 2.2));              // dark maria
          return -0.3 * m + 0.35 * fbm(n * 6.0) + 0.15 * fbm(n * 24.0) + 0.06 * craters(n * 5.0) + 0.03 * craters(n * 13.0);
        }
        void main() {
          vec2 sp = vec2(gl_FragCoord.x, 1080.0 - gl_FragCoord.y);
          vec2 d = (sp - C) / R;
          float rr = dot(d, d);
          if (rr > 1.0) discard;
          vec3 n = vec3(d.x, -d.y, sqrt(1.0 - rr));                       // y up
          float a = time * 0.11;                                           // slow spin about the vertical axis
          mat3 rot = mat3(cos(a), 0.0, -sin(a), 0.0, 1.0, 0.0, sin(a), 0.0, cos(a));
          vec3 q = rot * n;
          float e = 0.004;
          float h0 = surface(q);
          vec3 g = tr3(rot) * (vec3(surface(q + vec3(e,0,0)), surface(q + vec3(0,e,0)), surface(q + vec3(0,0,e))) - h0) / e;
          vec3 bn = normalize(n - (g - dot(g, n) * n) * 0.03);            // bump-mapped normal
          vec3 L = normalize(vec3(-0.3, 0.55, -0.78));                       // grazing light from above and behind: only the upper limb catches it
          float lit = max(dot(bn, L), 0.0);
          float albedo = 0.55 + 0.45 * (h0 + 0.35);
          vec3 col = vec3(0.86, 0.85, 0.88) * albedo * (pow(lit, 0.9) * 0.5);   // a dim crescent, as in the reference

          gl_FragColor = vec4(col * edge, edge);

      const sh = (type, src) => { const o = mgl.createShader(type); mgl.shaderSource(o, src); mgl.compileShader(o); if (!mgl.getShaderParameter(o, mgl.COMPILE_STATUS)) console.error(mgl.getShaderInfoLog(o)); return o; };

      mgl.bufferData(mgl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), mgl.STATIC_DRAW);
      const loc = mgl.getAttribLocation(prog, "p"); mgl.enableVertexAttribArray(loc); mgl.vertexAttribPointer(loc, 2, mgl.FLOAT, false, 0, 0);
      mTime = mgl.getUniformLocation(prog, "time");

    })();
    function drawMoon(t) {
      if (!moonReady) return;
      mgl.clearColor(0, 0, 0, 0); mgl.clear(mgl.COLOR_BUFFER_BIT);

    }
    // ---------------------------------------------------------------- the icon as a block of glass (WebGL)
    // A rounded-square slab with a curved bevel, a domed bubble inside, colour living inside the glass and bent by
    // the bevel, a key light from the lower left, and the LED halo lighting the curved edges when it comes on.

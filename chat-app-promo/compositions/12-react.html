  </style>
  <div id="root" data-composition-id="react" data-width="1920" data-height="1080">
    <div id="x-cam" class="abs" data-layout-allow-overflow>
      <div id="x-chat" class="abs">
        <div id="x-bubble" class="abs">
          <div id="x-bubble-sheen" class="sheen"></div>
          <div id="x-text" class="abs">Shipped!<img src="assets/images/emoji/emoji_u1f680.svg" alt="" /></div>

        </div>

      </div>
      <div id="x-bar" class="abs">
        <div class="x-emo" style="left: 52px"><img src="assets/images/emoji/emoji_u2764.svg" alt="" /></div>
        <div class="x-emo" id="x-e-fire" style="left: 210px"><img src="assets/images/emoji/emoji_u1f525.svg" alt="" /></div>
        <div class="x-emo" style="left: 371px"><img src="assets/images/emoji/emoji_u1f44d.svg" alt="" /></div>
        <div class="x-emo" style="left: 534px"><img src="assets/images/emoji/emoji_u1f389.svg" alt="" /></div>
        <div class="x-emo" style="left: 693px"><img src="assets/images/emoji/emoji_u1f4aa.svg" alt="" /></div>
        <div class="x-emo" id="x-plus" style="left: 862px; top: 44px; width: 96px; height: 96px"><svg viewBox="0 0 80 80" width="96" height="96"><path d="M40 24 V56 M24 40 H56" stroke="#ffffff" stroke-width="5" stroke-linecap="round" /></svg></div>
      </div>
    </div>
    <div id="x-badge" class="abs"></div>
    <div id="x-fire" class="abs"><div id="x-fireGlow" class="abs"></div><img src="assets/images/emoji/emoji_u1f525.svg" alt="" /></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const T0 = 27.9;   // this composition starts at 27.9 s on the root; times below are written as root seconds - T0
    const at = (t) => t - T0;
    const smoothKeys = (K) => {
      const n = K.length, d = [], m = [];
      for (let i = 0; i < n - 1; i++) d.push((K[i + 1][1] - K[i][1]) / (K[i + 1][0] - K[i][0]));
      m.push(d[0]);
      for (let i = 1; i < n - 1; i++) m.push(d[i - 1] * d[i] <= 0 ? 0 : (2 * d[i - 1] * d[i]) / (d[i - 1] + d[i]));
      m.push(d[n - 2]);
      return (t) => {
        if (t <= K[0][0]) return K[0][1];
        if (t >= K[n - 1][0]) return K[n - 1][1];
        let i = 0;
        while (K[i + 1][0] < t) i++;
        const h = K[i + 1][0] - K[i][0], u = (t - K[i][0]) / h, u2 = u * u, u3 = u2 * u;
        return (2 * u3 - 3 * u2 + 1) * K[i][1] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * K[i + 1][1] + (u3 - u2) * h * m[i + 1];
      };
    };
    const col = (K, i) => smoothKeys(K.map((k) => [k[0], k[i]]));

    // ---------------------------------------------------------------- the camera, measured on the reference
    // [time, scale, screen x of the bubble's centre, screen y of its top]: it pushes in on the bar (28.2-28.6 s), eases
    // back a touch while the reactions play, then pulls right back out to the reply once one is chosen
    const CAM = [[27.9, 1, 1000.5, 369], [28.2, 1.0, 1000.5, 369], [28.3, 1.105, 978, 460], [28.433, 1.46, 940, 700], [28.567, 1.5, 928, 749],
                 [28.7, 1.517, 926, 763], [29.5, 1.47, 937, 755], [30.167, 1.42, 942, 747], [30.3, 1.4, 943, 742], [30.433, 1.27, 943, 661],
                 [30.567, 0.92, 998, 424], [30.7, 0.875, 1004, 379], [31.0, 0.855, 991, 362]];
    const cS = col(CAM, 1), cX = col(CAM, 2), cY = col(CAM, 3);
    // the bar opens from its left end: [time, width]
    const BARW = smoothKeys([[27.95, 140], [28.033, 544], [28.167, 764], [28.3, 887], [28.433, 937], [28.567, 1000], [28.7, 1026]]);
    const EMO_T = [28.4, 28.45, 28.5, 28.57, 28.63, 28.69];   // each pops in, left to right
    // the hover runs back from "+" to the fire, one every ~0.13 s, and the fire is kept: [time, index]
    const HOVER = [[29.1, 5], [29.3, 4], [29.43, 3], [29.57, 2], [29.7, 1]];
    // the fire, after the bar goes (30.23 s): [time, screen x, screen y, size scale, glow]
    // (size as a scale of its 106 px; the first key is filled in from where it sat in the bar)
    const FIRE = [[30.233, 0, 0, 1, 1], [30.3, 612, 544, 1.5, 1], [30.433, 600, 700, 1.0, 0.9], [30.567, 668, 705, 0.75, 0.7],
                  [30.7, 688, 662, 0.65, 0.75], [31.0, 692, 640, 0.6, 0.6]];

    const cam = document.getElementById("x-cam");
    const chat = document.getElementById("x-chat");
    const bar = document.getElementById("x-bar");
    const emos = [...document.querySelectorAll(".x-emo")];
    const fire = document.getElementById("x-fire");
    const badge = document.getElementById("x-badge");
    const toScreen = (x, y, t) => [cX(t) + (x - 1000.5) * cS(t), cY(t) + (y - 369) * cS(t)];

    const place = (lt) => {
      const t = lt + T0;
      const s = cS(t);
      gsap.set(cam, { scale: s, x: cX(t) - 1000.5 * s, y: cY(t) - 369 * s });
      // the exchange goes out of focus behind the bar, and comes back sharp when the camera pulls out
      // it stays out of focus until the fire has landed on it (~30.6 s), then sharpens
      const blur = t < 30.52 ? 9 * Math.min(1, Math.max(0, (t - 27.9) / 0.12)) : 9 * (1 - Math.min(1, (t - 30.52) / 0.18));
      gsap.set(chat, { filter: `blur(${blur}px) brightness(${1 - blur / 30})` });
      bar.style.opacity = t >= 27.95 && t < 30.233 ? 1 : 0;
      sheenAt(document.getElementById("x-bubble-sheen"), t);
      bar.style.width = BARW(t) + "px";
      emos.forEach((e, i) => {
        const u = Math.min(1, Math.max(0, (t - EMO_T[i]) / 0.2));
        let k = u < 0.6 ? (u / 0.6) * 1.15 : 1.15 - 0.15 * ((u - 0.6) / 0.4);
        // hovered: swells to 1.3 and back as the hover passes; the fire stays swollen
        HOVER.forEach(([h, idx], j) => {
          if (idx !== i) return;
          const end = j < HOVER.length - 1 ? HOVER[j + 1][0] : 99;
          const up = Math.min(1, Math.max(0, (t - h) / 0.08)), down = Math.min(1, Math.max(0, (t - end) / 0.1));
          k *= 1 + 0.32 * up * (1 - down);
        });
        e.style.transform = `scale(${k})`;
      });
      // the fire glows once chosen, then flies down to the bubble's corner and settles as a reaction badge
      const glowOn = Math.min(1, Math.max(0, (t - 30.05) / 0.12));
      const fe = document.querySelector("#x-e-fire img");
      fe.style.filter = `drop-shadow(0 0 ${18 * glowOn}px rgba(255,140,30,${0.9 * glowOn}))`;
      if (t >= 30.233) {
        // one continuous flight, no stops: from where it sat in the bar to its seat on the bubble's lower-left corner
        // (30.23-30.7 s, easing in and out, dipping slightly below the straight line as it drops)
        const p0 = toScreen(500 + 210 + 53, 132 + 39 + 53, 30.233);
        // (the seat is taken where it will be when the fire arrives, so the camera's fast pull-back does not bend
        // the flight; after landing it rides the bubble)
        const p1 = toScreen(599, 681, Math.max(t, 30.703));
        const u = Math.min(1, (t - 30.233) / 0.47), e3 = u * u * (3 - 2 * u);
        const fx = p0[0] + (p1[0] - p0[0]) * e3;
        const fy = p0[1] + (p1[1] - p0[1]) * e3 + 60 * Math.sin(Math.PI * e3);
        const sEnd = (64 / 106) * cS(t);   // its size on the bubble, as the next shot draws it
        const sBar = 1.32 * cS(30.233);
        // it swells a touch as it lifts off the bar, then shrinks to its seat
        const fsz = sBar + (sEnd - sBar) * e3 + 0.25 * Math.sin(Math.PI * Math.min(1, u * 1.6)) * (1 - e3);
        gsap.set(fire, { opacity: 1, x: fx, y: fy, scale: fsz });
        // its glow lingers as it lands and is gone by the cut
        document.getElementById("x-fireGlow").style.opacity = 1 - Math.min(1, Math.max(0, (t - 30.45) / 0.55));
        // the pill opens out from behind it as it lands: first a small round just behind it, then widening to
        // either side (30.33-30.53 s), easing out; once seated it is the size the next shot draws
        const b = Math.min(1, Math.max(0, (t - 30.33) / 0.2));
        const e = 1 - Math.pow(1 - b, 3);
        const k = fsz / (64 / 106);
        gsap.set(badge, { opacity: Math.min(1, b / 0.3), x: fx, y: fy, scaleY: k * (0.82 + 0.18 * e), scaleX: k * (0.55 + 0.45 * e), filter: `blur(${(1 - e) * 3}px)` });
      } else {
        gsap.set([fire, badge], { opacity: 0 });
      }
    };
    // a soft sheen sweeps across the bubble from the left just before it is set aside (27.78-28.15 s, as the reference)
    const sheenAt = (el, t) => {
      const u = (t - 27.78) / 0.37;
      el.style.opacity = u > 0 && u < 1 ? Math.sin(Math.PI * u) : 0;
      el.style.transform = `translateX(${-320 + u * 1300}px) skewX(-18deg)`;
    };
    const clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, { t: 31.0 - T0, duration: 31.0 - T0, ease: "none", immediateRender: false, onUpdate: () => place(clock.t) }, 0);
    place(0);

    window.__timelines["react"] = tl;
  </script>

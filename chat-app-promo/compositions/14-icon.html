        return (2 * u3 - 3 * u2 + 1) * K[i][1] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * K[i + 1][1] + (u3 - u2) * h * m[i + 1];
      };
    };
    const BOX = smoothKeys([[34.067, 738], [34.233, 420], [34.3, 327], [34.367, 234], [34.433, 189], [34.5, 163], [34.567, 147], [34.633, 137], [34.7, 131], [34.9, 132], [35.033, 138], [35.1, 144], [35.167, 154], [35.233, 175], [35.3, 205], [35.367, 220], [35.433, 228], [35.5, 234], [35.567, 238], [35.633, 242], [35.7, 244], [35.767, 246], [36.0, 248]]);
    // the icon starts small inside the block's dark lens and grows out through it, on past the block's edge
    const ICON = smoothKeys([[34.78, 84], [34.9, 100], [35.0, 122], [35.067, 140], [35.167, 156], [35.233, 175], [35.3, 205], [35.367, 220],
                            [35.433, 228], [35.5, 234], [35.567, 238], [35.633, 242], [35.7, 244], [35.767, 246], [36.0, 248]]);
    const draw = (t) => {
      // the block shrinks along the measured curve and then holds at ~131 px, waiting; the icon grows out of it
      const bw = Math.max(131, BOX(Math.min(t, 34.7)));
      const h = Math.min(132, bw);
      const sq = ease(clamp01((t - 34.5) / 0.25));
      gsap.set(shell, { width: bw, height: h, marginLeft: -bw / 2, marginTop: -h / 2, borderRadius: Math.max(27, bw * (128 / 430) * sq + 27 * (1 - sq)),
        opacity: 1 - clamp01((t - 35.1) / 0.2) });
      // the lens opens to exactly the glass icon's own inner ring, keeps that size as the icon grows out of it, and
      // dissolves into the glass as the colour comes up, so nothing pops: the dark of the block becomes the icon's well
      const ringD = 2 * 165 * (ICON(Math.max(t, 34.78)) / SLAB) * 1.35;   // soft edge: the gradient's 74 % sits on the ring
      // it opens from nothing (no dot first), softly, as the block squares off
      const opened = ease(clamp01((t - 34.5) / 0.32));
      const lr = ringD * opened;
      gsap.set(lens, { width: lr, height: lr, marginLeft: -lr / 2, marginTop: -lr / 2, opacity: opened * (1 - ease(clamp01((t - 34.82) / 0.35))) });
      const on = ease(clamp01((t - 34.78) / 0.15));
      document.getElementById("i-glass").style.opacity = on;
      const S = ICON(t) / SLAB;
      // the colour spreads from the lower-left corner over ~0.7 s, as measured
      const rev = 1 - Math.pow(1 - clamp01((t - 34.83) / 0.7), 2);
      const glow = clamp01((t - 35.35) / 0.3);
      const dim = 1 - 0.94 * ease(clamp01((t - 36.48) / 0.22));
      ggl.clearColor(0, 0, 0, 0); ggl.clear(ggl.COLOR_BUFFER_BIT);
      ggl.uniform2f(GU.C, CX, CY);
      ggl.uniform1f(GU.S, S);
      ggl.uniform1f(GU.op, dim);
      ggl.uniform1f(GU.depth, 0.4 + 0.6 * rev);
      ggl.uniform1f(GU.colorR, 1 + 560 * rev);
      ggl.uniform1f(GU.lensR, 165);
      ggl.uniform1f(GU.lensFill, 0.05);
      ggl.uniform1f(GU.bubR, 112 * (0.6 + 0.4 * rev));
      ggl.uniform1f(GU.bubOp, rev);
      ggl.uniform1f(GU.reveal, rev);
      ggl.uniform1f(GU.halo, 300);
      ggl.uniform1f(GU.haloOp, 0);
      ggl.uniform1f(GU.milk, 0);
      ggl.uniform1f(GU.neon, 0.8 * glow * dim);
      ggl.uniform1f(GU.pix, 0);
      ggl.uniform1f(GU.streak, 0);
      ggl.uniform1f(GU.streakY, -150);
      ggl.uniform1f(GU.sheen, 0);
      ggl.uniform1f(GU.t, t - T0);
      ggl.drawArrays(ggl.TRIANGLE_STRIP, 0, 4);
      gsap.set("#i-bloom", { opacity: glow * dim });
    };
    const clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, { t: 37.0 - T0, duration: 37.0 - T0, ease: "none", immediateRender: false, onUpdate: () => draw(clock.t + T0) }, 0);
    draw(T0);

    window.__timelines["icon"] = tl;
  </script>
</template>

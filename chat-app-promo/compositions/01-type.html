<template>
  <style>
    @font-face {
      font-family: "Inter";
      font-weight: 100 900;
      src: url("assets/fonts/Inter-Variable.ttf") format("truetype");
    }
    /* static cut for the big word: the variable font's overlapping contours would show through the dashed stroke */
    @font-face {
      font-family: "Inter Display";
      font-weight: 500;
      src: url("assets/fonts/InterDisplay-Medium.woff2") format("woff2");
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #050306;
      font-family: "Inter", sans-serif;
      color: #ffffff;
    }
    .abs {
      position: absolute;
    }
    /* shot 1: a short line typed in the middle of the frame */
    /* measured on the reference: Inter at display optical size, medium, 86 px; cursor 9 x 106 px,
       centred on the cap height, just past the last letter's advance */
    #t-line {
      left: 0;
      top: 478px;
      height: 106px;
      display: flex;
      align-items: center;
      font-size: 86px;
      font-weight: 500;
      font-variation-settings: "opsz" 32;
      letter-spacing: -0.012em;
      color: #fcfafd;
      white-space: pre;
    }
    #t-text {
      display: block;
      line-height: 106px;
    }
    #t-cursor {
      flex: none;
      width: 9px;
      height: 106px;
      margin-left: 6px;
      background: #fcfafd;
    }
    /* shot 2: one huge word pressed to the bottom edge, rising, sliding off left; a punch-in cut to it outlined in orange.
       Measured on the reference: Inter Display Medium, 435 px, letter-spacing -0.038em; the outlined cut is 1.61x */
    #t-big {
      opacity: 0;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      overflow: visible;
    }
    #t-glass {
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      opacity: 0;
    }
    .big {
      font-family: "Inter Display", sans-serif;
      font-weight: 500;
    }
  </style>
  <div data-hf-id="hf-to5z" id="root" data-composition-id="type" data-width="1920" data-height="1080">
    <div data-hf-id="hf-b0f9" id="t-line" class="abs"><span data-hf-id="hf-jkaq" id="t-text"></span><div data-hf-id="hf-847m" id="t-cursor"></div></div>
    <canvas id="t-glass" class="abs" width="1920" height="1080"></canvas>
    <svg data-hf-id="hf-k14b" id="t-big" class="abs" width="1920" height="1080" viewBox="0 0 1920 1080" data-layout-allow-overflow data-layout-allow-overlap>
      <!-- white word: 429 px, i-dot top rests at y 658, ink starts at x 15 -->
      <g id="t-solid"><text class="big" x="-12" y="973" font-size="429" letter-spacing="-13.35" fill="#fcfafd">reimagined</text></g>
      
    </svg>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // ---------------------------------------------------------------- shot 1: typing
    const line = document.getElementById("t-line");
    const text = document.getElementById("t-text");
    const cursor = document.getElementById("t-cursor");
    const FULL = "Motion design";
    // the finished word is centred; typing grows from its left edge (the cursor sits there from frame 0)
    const LINE_W = 532; // "Motion design" at this setting, measured
    line.style.left = 960 - LINE_W / 2 + "px";
    // thirteen keystrokes squeezed into the reference's typing window (frames 2-22 at 30 fps), still uneven like a person
    const KEYS = [2, 4, 5, 7, 9, 10, 12, 14, 15, 17, 19, 20, 22].map((f) => f / 30);
    const clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, { t: 1.2, duration: 1.2, ease: "none", immediateRender: false,
      onUpdate: () => { text.textContent = FULL.slice(0, KEYS.filter((k) => clock.t >= k - 1e-6).length); } }, 0);
    // the cursor never blinks; it goes out just before the cut
    tl.set(cursor, { opacity: 0 }, 32 / 30);
    tl.set("#t-line", { opacity: 0 }, 1.2);

    // ---------------------------------------------------------------- shot 2: the big word (curves fitted to the reference, frame by frame)
    tl.set("#t-big", { opacity: 1 }, 1.2);
    // appears pressed to the bottom edge, 80 px low, and rises into place; the reference decays like e^(-t/0.165 s)
    tl.fromTo("#t-solid", { y: 80, x: 0 }, { y: 0, duration: 1.14, ease: "expo.out", immediateRender: false }, 1.2);
    // then accelerates off to the left
    tl.to("#t-solid", { x: -290, duration: 0.166, ease: "power2.in" }, 1.717);
    // punch-in cut: the same word 1.61x, outlined; its bottom stays at the same height
    tl.set("#t-solid", { opacity: 0 }, 1.883);
    tl.set("#t-glass", { opacity: 1 }, 1.883);
    const D_INK = 3181; // from the text origin to the d's right edge at 691 px, measured
    const glass = { x: 2000 - D_INK, y: 0 };
    // the glass word, 1.612x (691 px), i-dot top at y 408; x is driven so the d's right edge follows the reference
    const place = () => drawGlass(glass.x, glass.y);
    tl.fromTo(glass, { x: 2000 - D_INK }, { x: 1825 - D_INK, duration: 0.667, ease: "power2.out", immediateRender: false, onUpdate: place }, 1.883);
    // and drops out of frame, accelerating, until the cut
    tl.fromTo(glass, { y: 0 }, { y: 130, duration: 0.4, ease: "power3.in", immediateRender: false, onUpdate: place }, 2.15);

    // ---------------------------------------------------------------- the outlined word as lit orange glass (WebGL)
    // The letters get a real bevel: a height field from blurred letter shapes, normals from its slope, and two lights
    // fixed in the frame. Because the lights stay put while the word travels, the highlights slide across the letters.
    const TEX = { w: 3500, h: 840, ox: 60, base: 620 }; // word canvas: text origin at (ox, base)
    const gcv = document.getElementById("t-glass");
    const gl = gcv.getContext("webgl", { premultipliedAlpha: true, preserveDrawingBuffer: true, antialias: true });
    let glReady = false, prog, uOrigin, uTime, uSurf, uStrips;

    // ---------------------------------------------------------------- the slosh, simulated once at load
    // The word's travel is known (the two tweens above), so the liquid's response is integrated up front with a
    // damped spring for the tilt and another for the level, driven by the container's acceleration.
    const SIM = { t0: 1.883, t1: 2.56, dt: 1 / 600, slope: [], lift: [], wave: [] };
    (function simulate() {
      const ex = gsap.parseEase("power2.out"), ey = gsap.parseEase("power3.in");
      const X = (t) => (2000 - D_INK) + (1825 - 2000) * ex(Math.min(1, Math.max(0, (t - 1.883) / 0.667)));
      const Y = (t) => 130 * ey(Math.min(1, Math.max(0, (t - 2.15) / 0.4)));
      const acc = (f, t) => (f(t + SIM.dt) - 2 * f(t) + f(t - SIM.dt)) / (SIM.dt * SIM.dt);
      const G = 2600; // how hard the liquid is held flat, in px/s^2
      // it arrives already disturbed: the word was rushing left just before the cut
      let s = -0.05, sv = 0.32, l = 0, lv = 0, w = 6;
      const wS = 2 * Math.PI * 1.9, zS = 0.16, wL = 2 * Math.PI * 2.6, zL = 0.3;
      for (let t = SIM.t0; t <= SIM.t1 + 1e-9; t += SIM.dt) {
        const ax = acc(X, t), ay = acc(Y, t);
        // accelerating right pushes the liquid up on the left (screen y grows downward, so the slope goes positive)
        sv += (-wS * wS * s - 2 * zS * wS * sv + ax / G * wS * wS * 0.045) * SIM.dt;
        s += sv * SIM.dt;
        // falling lightens the liquid: it lifts away from the bottom
        lv += (-wL * wL * l - 2 * zL * wL * lv - ay * 0.018) * SIM.dt;
        l += lv * SIM.dt;
        w = 3 + Math.min(8, Math.abs(sv) * 14 + Math.abs(lv) * 0.04);
        SIM.slope.push(Math.max(-0.16, Math.min(0.16, s)));
        SIM.lift.push(l);
        SIM.wave.push(w);
      }
    })();
    const simAt = (arr, t) => arr[Math.max(0, Math.min(arr.length - 1, Math.round((t - SIM.t0) / SIM.dt)))];

    function wordLayer(blur) {
      const c = document.createElement("canvas");
      c.width = TEX.w; c.height = TEX.h;
      const g = c.getContext("2d");
      g.font = '500 691px "Inter Display"';
      g.letterSpacing = "-21.5px";
      g.textBaseline = "alphabetic";
      if (blur) g.filter = `blur(${blur}px)`;
      g.fillStyle = "#fff";
      g.fillText("reimagined", TEX.ox, TEX.base);
      return g.getImageData(0, 0, TEX.w, TEX.h).data;
    }

    function buildGlass() {
      // R: the sharp letters, G: a medium blur for the bevel, B: a wide blur for thickness
      const sharp = wordLayer(0), mid = wordLayer(9), wide = wordLayer(26);
      const px = new Uint8Array(TEX.w * TEX.h * 4);
      for (let i = 0; i < TEX.w * TEX.h; i++) {
        px[i * 4] = sharp[i * 4 + 3]; px[i * 4 + 1] = mid[i * 4 + 3]; px[i * 4 + 2] = wide[i * 4 + 3]; px[i * 4 + 3] = 255;
      }
      const vs = "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
      const fs = `
        precision highp float;
        uniform sampler2D T; uniform vec2 texSize; uniform vec2 origin; uniform float time;
        // luminous orange gel. Colour comes from one ten-step ramp, built like the reference's own:
        // near-black crimson -> red -> saturated orange -> light apricot, darks cooler and deeper, lights warmer
        vec3 ramp(float x) {
          x = clamp(x, 0.0, 1.0);
          vec3 c0 = vec3(0.102, 0.008, 0.004), c1 = vec3(0.290, 0.020, 0.008), c2 = vec3(0.549, 0.067, 0.008);
          vec3 c3 = vec3(0.816, 0.165, 0.000), c4 = vec3(1.000, 0.302, 0.024), c5 = vec3(1.000, 0.455, 0.141);
          vec3 c6 = vec3(1.000, 0.604, 0.322), c7 = vec3(1.000, 0.733, 0.525), c8 = vec3(1.000, 0.839, 0.706);
          vec3 c9 = vec3(1.000, 0.933, 0.867);
          if (x < 0.10) return mix(c0, c1, x / 0.10);
          if (x < 0.22) return mix(c1, c2, (x - 0.10) / 0.12);
          if (x < 0.34) return mix(c2, c3, (x - 0.22) / 0.12);
          if (x < 0.46) return mix(c3, c4, (x - 0.34) / 0.12);
          if (x < 0.58) return mix(c4, c5, (x - 0.46) / 0.12);
          if (x < 0.70) return mix(c5, c6, (x - 0.58) / 0.12);
          if (x < 0.82) return mix(c6, c7, (x - 0.70) / 0.12);
          if (x < 0.92) return mix(c7, c8, (x - 0.82) / 0.10);
          return mix(c8, c9, (x - 0.92) / 0.08);
        }
        // ---- clear glass letters, half full of orange liquid that sloshes with the motion ----
        uniform vec3 strips; // screen positions of the horizontal and vertical strip lights, and the diagonal one
        uniform vec4 surf;   // x: level (screen y at the word centre), y: slope, z: wave amplitude, w: word centre x
        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        // a quiet gradient: near-black at the top, deep warm umber low down, one broad soft glow behind the word
        vec3 backdrop(vec2 q) {
          // clean near-black: a whisper of lift in the middle, a narrow low warm line under the word, a vignette
          vec3 c = vec3(0.016, 0.012, 0.016);
          vec2 m = (q - vec2(980.0, 600.0)) / vec2(900.0, 520.0);
          c += vec3(0.022, 0.018, 0.022) * exp(-dot(m, m) * 1.4);
          vec2 g = (q - vec2(1050.0, 1000.0)) / vec2(820.0, 120.0);
          c += vec3(0.095, 0.030, 0.008) * exp(-dot(g, g));
          vec2 e = (q - vec2(960.0, 540.0)) / vec2(1100.0, 720.0);
          c *= 1.0 - 0.45 * smoothstep(0.5, 1.2, length(e));
          c += (hash(floor(q)) - 0.5) / 255.0;                                     // dither, no banding
          return c;
        }
        vec3 env(vec3 R, vec2 sp) {
          float shift = (sp.x - 1250.0) / 1920.0 * 1.1;                          // reflections sweep as the word travels
          float key = exp(-pow((R.x - 0.15 + shift) / 0.22, 2.0)) * smoothstep(0.1, -0.7, R.y);
          float strip = exp(-pow((R.x - 0.62 + shift) / 0.05, 2.0)) * smoothstep(0.3, -0.5, R.y);
          float broad = exp(-pow((R.x + 0.05 + shift * 1.4) / 0.45, 2.0)) * smoothstep(0.35, -0.25, R.y);
          return vec3(1.0, 0.97, 0.94) * (key * 0.9 + strip * 1.4 + broad * 0.35);
        }
        void main() {
          vec2 sp = vec2(gl_FragCoord.x, 1080.0 - gl_FragCoord.y);
          vec3 bg = backdrop(sp);
          vec2 tp = (sp - origin) / texSize;
          if (tp.x < 0.0 || tp.y < 0.0 || tp.x > 1.0 || tp.y > 1.0) { gl_FragColor = vec4(bg, 1.0); return; }
          vec4 s = texture2D(T, tp);
          float a = s.r;
          if (a < 0.003) { gl_FragColor = vec4(bg, 1.0); return; }
          vec2 d = 6.0 / texSize;
          float hx = (texture2D(T, tp + vec2(d.x, 0.0)).b - texture2D(T, tp - vec2(d.x, 0.0)).b)
                   + 0.5 * (texture2D(T, tp + vec2(d.x, 0.0)).g - texture2D(T, tp - vec2(d.x, 0.0)).g);
          float hy = (texture2D(T, tp + vec2(0.0, d.y)).b - texture2D(T, tp - vec2(0.0, d.y)).b)
                   + 0.5 * (texture2D(T, tp + vec2(0.0, d.y)).g - texture2D(T, tp - vec2(0.0, d.y)).g);
          vec3 N = normalize(vec3(-hx * 3.2, -hy * 3.2, 1.0));
          float thick = smoothstep(0.08, 0.9, s.b);
          float edge = smoothstep(0.35, 0.8, 1.0 - N.z);                          // 0 on the flat top, 1 on the steep rim

          // lensing: near the rims the glass bends what is behind it strongly, in the middle hardly at all,
          // so the liquid (and its surface) is seen shifted and magnified toward the walls
          float lensF = pow(1.0 - N.z, 1.3);
          vec2 q = sp - N.xy * 95.0 * lensF;
          // the liquid surface: one level across the word, tilted by the slosh, with a small travelling ripple
          float x = q.x - surf.w;
          float sy = surf.x + surf.y * x + surf.z * (sin(x * 0.011 - time * 9.0) * 0.7 + sin(x * 0.023 + time * 13.0) * 0.3);
          float dy = q.y - sy;                                                     // > 0 below the surface
          float wet = smoothstep(-3.0, 3.0, dy);

          // liquid: bright just under the surface, saturated orange, deep red-brown at the bottom; glowing in thick parts
          vec3 liq = mix(vec3(1.0, 0.66, 0.34), vec3(1.0, 0.38, 0.06), smoothstep(0.0, 110.0, dy));
          liq = mix(liq, vec3(0.50, 0.07, 0.01), smoothstep(110.0, 340.0, dy));
          liq *= 0.7 + 0.5 * thick;
          liq *= 1.0 - edge * 0.55;                                                // the glass wall darkens the liquid at the sides
          // meniscus: a fine bright line on the surface, a soft shadow just beneath it
          liq += vec3(1.0, 0.86, 0.70) * exp(-pow((dy - 3.0) / 4.0, 2.0)) * 0.7;      // meniscus, softened by the frost
          liq *= 1.0 - exp(-pow((dy - 10.0) / 5.0, 2.0)) * 0.25;
          // a few small bubbles rising slowly through the liquid
          vec2 cell = floor(vec2(sp.x - origin.x, sp.y) / 46.0);
          float h = hash(cell);
          if (h < 0.16 && dy > 30.0) {
            vec2 c = (cell + vec2(0.25 + 0.5 * hash(cell + 3.1), fract(0.8 - time * (0.35 + 0.4 * hash(cell + 7.7)) + h * 9.0))) * 46.0;
            c.x += origin.x;
            float r = 2.0 + 3.0 * hash(cell + 1.3);
            float dist = length(sp - c);
            liq += vec3(1.0, 0.85, 0.7) * (smoothstep(r + 1.0, r, dist) - smoothstep(r - 0.6, r - 1.6, dist)) * 0.55;
          }

          // empty glass above the liquid. On black, glass shows itself through light, so it gets three kinds:
          // 1) the walls: seen edge-on near the outline, a band of brighter glass that draws the whole letter
          float wall = (1.0 - smoothstep(0.42, 0.9, s.g)) * smoothstep(0.02, 0.18, s.r);
          // 2) the liquid's own glow climbing the glass above it, strongest on the walls
          float up = max(0.0, -dy);
          float spill = exp(-up / 55.0) * (0.25 + 0.75 * wall);
          // 3) a barely-there grey haze in the body of the glass
          // frosted: the gradient seen through the glass is softened by a small disc of samples, plus a milky haze
          vec2 look = sp - N.xy * 80.0 * lensF;
          vec3 seenBg = vec3(0.0);
          for (int k = 0; k < 8; k++) {
            float ang = float(k) * 0.785398;
            seenBg += backdrop(look + vec2(cos(ang), sin(ang)) * 22.0);
          }
          seenBg /= 8.0;
          vec3 empty = seenBg * 1.1 + vec3(0.045, 0.043, 0.048) * (1.0 - thick * 0.4);
          empty += vec3(0.72, 0.74, 0.80) * wall * 0.48;                                 // thick, bright glass walls
          empty += vec3(1.0, 0.45, 0.14) * spill * 0.4;
          vec3 col = mix(empty, liq, wet);

          // the glass over everything: reflections strongest at the rims, a thin highlight just inside the edge
          vec3 R = vec3(2.0 * N.z * N.x, 2.0 * N.z * N.y, 2.0 * N.z * N.z - 1.0);
          float fres = 0.03 + 0.97 * pow(1.0 - N.z, 4.0);
          col = col * (1.0 - fres * 0.4) + env(R, sp) * (0.10 + fres * 1.4);
          col += vec3(1.0, 0.95, 0.9) * smoothstep(0.62, 0.92, 1.0 - N.z) * smoothstep(0.02, 0.2, thick) * 0.45;
          // the two specular edges of Apple-style glass: strong on the upper left, softer on the lower right
          // the light is a point fixed just above the word, so every spot on a letter sees it from its own angle:
          // as a letter travels past it, its bright edge swings from one side to the other
          vec2 nd = normalize(N.xy + vec2(1e-5));
          vec2 Lp = vec2(1250.0, 110.0);
          vec2 toL = normalize(Lp - sp);
          float near = exp(-pow((sp.x - Lp.x) / 650.0, 2.0));                      // letters right under the light shine most
          float rimF = smoothstep(0.3, 0.85, 1.0 - N.z) * smoothstep(0.02, 0.15, s.r);
          float hiTL = pow(max(dot(nd, toL), 0.0), 2.5) * rimF * (0.55 + 0.75 * near);
          float hiBR = pow(max(dot(nd, -toL), 0.0), 2.5) * rimF * 0.8;
          // a crisp line traced just inside the outline, much brighter where it faces upper left and lower right
          float ring = smoothstep(0.30, 0.42, s.g) * (1.0 - smoothstep(0.50, 0.62, s.g));
          float dir = 0.2 + 1.3 * pow(max(dot(nd, toL), 0.0), 2.0) * (0.6 + 0.6 * near) + 0.6 * pow(max(dot(nd, -toL), 0.0), 2.0);
          col += vec3(1.0, 0.98, 0.95) * (hiTL * 0.7 + hiBR * 0.35 + ring * dir * 0.55);
          // two strip lights fixed in the frame, seen in the glass. Where each one shows depends on the surface slope,
          // so as the word drops the horizontal strip's reflection climbs each letter from bottom to top,
          // and as it slides left the vertical strip's reflection crosses each letter from left to right
          float curve = 0.35 + 0.65 * smoothstep(0.05, 0.6, 1.0 - N.z);
          // the strips also travel against the word (strips.xy), so the light races across each letter
          float hStrip = exp(-pow((sp.y + N.y * 200.0 - strips.x) / 40.0, 2.0)) * curve;
          float vStrip = exp(-pow((sp.x + N.x * 200.0 - strips.y) / 44.0, 2.0)) * curve;
          float dStrip = exp(-pow(((sp.x - sp.y * 0.6) + (N.x - N.y * 0.6) * 200.0 - strips.z) / 34.0, 2.0)) * curve;
          float glassOnly = 1.0 - wet * 0.4;                                        // a touch softer where it sits over the liquid
          col += vec3(1.0, 0.97, 0.93) * (hStrip * 0.8 + vStrip * 0.6 + dStrip * 0.42) * glassOnly;     // diffused by the frost
          // frost grain: fine, fixed to the glass surface
          float grain = hash(floor(tp * texSize * 0.8)) - 0.5;
          col += vec3(grain) * 0.035 * (1.0 - wet * 0.5);
          col += vec3(0.02, 0.019, 0.021) * (1.0 - wet * 0.6);                      // milky lift
          col = col / (1.0 + col * 0.12);
          gl_FragColor = vec4(mix(bg, col, a), 1.0);
        }`;
      const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); return o; };
      prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog); gl.useProgram(prog);
      const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, TEX.w, TEX.h, 0, gl.RGBA, gl.UNSIGNED_BYTE, px);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.uniform2f(gl.getUniformLocation(prog, "texSize"), TEX.w, TEX.h);
      uOrigin = gl.getUniformLocation(prog, "origin");
      uTime = gl.getUniformLocation(prog, "time");
      uSurf = gl.getUniformLocation(prog, "surf");
      uStrips = gl.getUniformLocation(prog, "strips");
      gl.viewport(0, 0, 1920, 1080);
      glReady = true;
    }

    // the SVG text origin is (x, 912) plus the word's travel; the texture's text origin is (ox, base)
    function drawGlass(x, y) {
      if (!glReady) return;
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform2f(uOrigin, x - TEX.ox, 912 + y - TEX.base);
      const t = tl.time();
      gl.uniform1f(uTime, t);
      // strip lights move against the word: up while it drops, right while it slides left, so the light sweeps fast
      const slid = (2000 - D_INK) - x;                                          // how far it has slid left so far
      gl.uniform3f(uStrips, 640 - 2.2 * y, 1120 + 2.0 * slid, 620 + 1.4 * slid - 1.2 * y);
      // the level sits a little under the x-height, centred on the word
      gl.uniform4f(uSurf, 912 + y - 190 + simAt(SIM.lift, t), simAt(SIM.slope, t), simAt(SIM.wave, t), x + 2350); // pivot: middle of the visible letters
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

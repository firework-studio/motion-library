  <script>
    const tl = gsap.timeline({ paused: true });
    const D = 15.15; // runs 0.45 s into the next shot, so the mark is pushed up as that shot rises
    gsap.set("#o-dot", { scale: 0 });

    // ---------------------------------------------------------------- helpers
    let seed = 11;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
    const clamp01 = (v) => Math.min(1, Math.max(0, v));
    const easeOut = (v) => 1 - Math.pow(1 - clamp01(v), 3);
    const easeIO = (v) => { v = clamp01(v); return v < 0.5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2; };
    const lerp = (a, b, k) => a + (b - a) * k;
    const PHOTO = (n) => `assets/photos/city-${String(n).padStart(2, "0")}.jpg`;
    const spans = (el, byChar) => {
      const parts = byChar ? [...el.dataset.text] : el.dataset.text.split(/(\s+)/);
      return parts.map((p) => { const s = document.createElement("span"); s.textContent = p; el.append(s); return s; });
    };

    // ---------------------------------------------------------------- timing (seconds)
    const BEATS = [2.0, 3.1, 4.2, 5.3]; // They grow / hire / expand / change
    const HERO_SHAPE = [[800, 540], [560, 700], [800, 540], [560, 700]]; // landscape and portrait in turn
    const BURST = 6.25;                  // the wall's last frame (also sets how far below the frame tiles start)
    const PUSH = 6.2, GATHER = 0.55;     // the wall's photos fly into the ball as it forms around the camera
    const BALL = 6.6;                    // orbits come in
    const TWIST = [7.82, 11.44];         // the change's clock (the study's 2–7.75 s), fitted to the reference in agent-workdir/ball-lab
    const DOT = 11.9;                    // the ball collapses to a point

    // ---------------------------------------------------------------- tiles
    // the first GHOSTS are large pale soft squares far back, the next SHARP are the photos near the
    // lens; every tile, those two sets included, ends up in the ball
    // the wall's rise: still until "stand" lands, a surge in, a pause with the opening line, a surge
    // that carries the line away into the first big photo, then a pause and a short surge at each
    // big-photo change; S(t) is the distance travelled, sampled once
    const bump = (t, c, w, peak) => peak * Math.exp(-Math.pow((t - c) / w, 2));
    const HOLD = [1.05, 1.65]; // the wall and the opening line pause together
    const speedAt = (t) => {
      if (t < 0.55) return 0;
      let v = 40 + bump(t, 0.78, 0.17, 4700) + bump(t, 1.95, 0.17, 2400);
      for (let i = 1; i < BEATS.length; i++) v += bump(t, BEATS[i] + 0.1, 0.18, 1500);
      return v * clamp01((t - 0.55) / 0.08);
    };
    const STEP = 1 / 240, TRAVEL = [0];
    for (let n = 1; n * STEP <= D + STEP; n++) TRAVEL.push(TRAVEL[n - 1] + speedAt((n - 0.5) * STEP) * STEP);
    const S = (t) => { const f = Math.max(0, t) / STEP, n = Math.floor(f); return n + 1 < TRAVEL.length ? lerp(TRAVEL[n], TRAVEL[n + 1], f - n) : TRAVEL[TRAVEL.length - 1]; };
    // each tile rides the same rise scaled by its own speed (near tiles faster), starting a given
    // distance below the frame
    const N = 50, GHOSTS = 22, SHARP = 28, F = 1600;
    const field = document.getElementById("o-field");
    const placed = [];
    const tiles = Array.from({ length: N }, (_, i) => {
      const el = document.createElement("div");
      el.className = "o-tile";
      const ghost = i < GHOSTS, sharp = !ghost && i < GHOSTS + SHARP;
      // each tile is a pale pane with its photo on top; on the wall the photo develops in as the
      // pane rises (the far panes stay pale), and in the ball every photo shows
      const img = document.createElement("i");
      img.style.backgroundImage = `url(${PHOTO((i % 16) + 1)})`;
      el.append(img);
      field.append(el);
      // photos ride one layer at one speed and never overlap each other; larger and smaller ones,
      // landscape and portrait, mixed; the pale panes behind drift slower, which gives the depth
      const near = sharp && rnd() < 0.45;
      const portrait = rnd() < 0.4;
      // sizes measured on the reference: landscape about 290 × 220, portrait 186 × 232, panes 190 × 140
      const w = ghost ? 160 + rnd() * 60 : portrait ? 180 + rnd() * 16 : 270 + rnd() * 34;
      const h = ghost ? w * 0.72 : portrait ? w * 1.25 : w * 0.75;
      let x = (rnd() - 0.5) * 2100;
      const v = ghost ? 150 + rnd() * 40 : 300; // rising speed, px/s
      let t0 = ghost ? -0.2 + rnd() * 7.4 : 0.3 + Math.pow(rnd(), 1.35) * 7.2; // when it would cross the bottom edge without the surge
      // keep the middle clear while the opening line is on screen: centre-column photos come later
      const burst = { x: (rnd() - 0.5) * 1880, y: (rnd() - 0.5) * 1040 };
      const k = (i + 0.5) / N, phi = Math.acos(1 - 2 * k), theta = Math.PI * (1 + Math.sqrt(5)) * i;
      const sph = [Math.sin(phi) * Math.cos(theta), Math.cos(phi), Math.sin(phi) * Math.sin(theta)];
      // how far below the frame it starts, in the wall's travel: a good share arrive with the first
      // surge and sit around the opening line while the wall pauses
      const sp = v / 300;
      const pick = () => {
        let U = rnd() < 0.36 ? 60 + rnd() * 1300 : 1360 + rnd() * (S(BURST) - 1360);
        U = Math.max(U, S(0.6)); // nothing on screen before the first surge
        // photos may brush the opening line, but the large ones pass beside it while it holds
        const yAt = (t) => h / 2 + 560 + sp * (U - S(t));
        if (near && Math.abs(x) - w / 2 < 440 && yAt(HOLD[1]) - h / 2 < 60 && yAt(HOLD[0]) + h / 2 > -60)
          x = (x < 0 ? -1 : 1) * (440 + w / 2 + rnd() * 480);
        return U;
      };
      let u = pick();
      if (sharp) {
        // keep a clear gap to every photo already on the wall
        // and stay off each big photo while it holds in the middle (centred 90 px above the frame's)
        const onHero = () => BEATS.some((b, i) => {
          const [hw, hh] = HERO_SHAPE[i], from = b + 0.35, to = i < 3 ? BEATS[i + 1] - 0.15 : BURST;
          const yAt = (t) => h / 2 + 560 + u - S(t);
          return Math.abs(x) - w / 2 < hw / 2 + 36 && yAt(to) - h / 2 < hh / 2 - 90 + 36 && yAt(from) + h / 2 > -hh / 2 - 90 - 36;
        });
        // and off the opening line while the wall pauses with it
        const onLine = () => {
          const yAt = (t) => h / 2 + 560 + u - S(t);
          return Math.abs(x) - w / 2 < 520 && yAt(HOLD[1]) - h / 2 < 70 && yAt(HOLD[0]) + h / 2 > -70;
        };
        const clash = () => onHero() || onLine() || placed.some((q) => Math.abs(q.x - x) < (q.w + w) / 2 + 70 && Math.abs(q.c - (u + h / 2)) < (q.h + h) / 2 + 70);
        for (let n = 0; n < 200 && clash(); n++) { x = (rnd() - 0.5) * 2100; u = pick(); }
        placed.push({ x, w, h, c: u + h / 2 });
      }
      return { el, img, below: sp * u, dev: 60 + rnd() * 220, ghost, sharp, near, w, h, x, v, t0, burst, sph, blur: ghost ? 0.8 + rnd() * 1.2 : 0, pale: ghost ? 0.55 + rnd() * 0.4 : 1, delay: rnd() };
    });
    const wallAt = (p, t) => ({ x: p.x, y: p.h / 2 + 20 + 540 + p.below - (p.v / 300) * S(t) });

    function draw(p, x, y, z, w, h, alpha, filter, zi) {
      const s = F / (F - z);
      p.el.style.transform = `translate(${960 + x * s}px, ${540 + y * s}px) scale(${(w / 100) * s}, ${(h / 70) * s})`;
      p.el.style.opacity = alpha;
      p.el.style.filter = filter;
      p.el.style.zIndex = zi;
    }

    // ball radius (world units, seen by a camera CAM away from the centre). At PUSH the ball is larger
    // than the camera's distance, so the camera sits inside it; as it shrinks, the photos on the near
    // side sweep in past the camera from all round the frame, and the rim closes in from outside
    // (about 1.1 frame widths across at 6.7 s). After 7 s the projected sizes follow the reference:
    // 540 at 7.0 s, 420 at 7.4, 380 at 8.2, 280 at 9.0, 230 by 10.5 (world 508, 404, 368, 275, 227).
    const CAM = 1500;
    // From 7.0 s the ball's diameter follows the reference, measured frame by frame (px): it shrinks
    // fast, eases, shrinks fast again and eases, never stopping. One monotone cubic through all the
    // points keeps the speed continuous (world radius ≈ 0.5 × projected diameter, a touch more once the
    // cards have shrunk, since the measured edge is the cards' outer edge).
    const SHRINK = [[6.1, 2600], [PUSH, 2600], [6.45, 1468], [6.7, 864], [6.85, 600],
      ...[[7.0, 1081], [7.2, 956], [7.4, 851], [7.6, 796], [7.8, 775], [8.0, 766], [8.2, 754], [8.4, 733], [8.6, 703],
        [8.8, 637], [9.0, 555], [9.2, 519], [9.4, 501], [9.6, 486], [9.8, 465], [10.0, 453], [10.6, 456], [11.8, 452]].map(([t, d]) => [t, d * (0.5 + 0.035 * clamp01((t - 9) / 1.5))])];
    const SHRINK_M = (() => {
      // Fritsch–Carlson tangents
      const n = SHRINK.length, d = [], m = [];
      for (let i = 0; i < n - 1; i++) d.push((SHRINK[i + 1][1] - SHRINK[i][1]) / (SHRINK[i + 1][0] - SHRINK[i][0]));
      for (let i = 0; i < n; i++) m.push(i === 0 ? d[0] : i === n - 1 ? d[n - 2] : d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2);
      for (let i = 0; i < n - 1; i++) {
        if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
        const a = m[i] / d[i], b = m[i + 1] / d[i], h = a * a + b * b;
        if (h > 9) { const k = 3 / Math.sqrt(h); m[i] = k * a * d[i]; m[i + 1] = k * b * d[i]; }
      }
      return m;
    })();
    const radiusAt = (t) => {
      if (t <= SHRINK[0][0]) return SHRINK[0][1];
      for (let i = 0; i < SHRINK.length - 1; i++) {
        const [t0, r0] = SHRINK[i], [t1, r1] = SHRINK[i + 1];
        if (t > t1) continue;
        const h = t1 - t0, u = (t - t0) / h, u2 = u * u, u3 = u2 * u;
        return (2 * u3 - 3 * u2 + 1) * r0 + (u3 - 2 * u2 + u) * h * SHRINK_M[i] + (-2 * u3 + 3 * u2) * r1 + (u3 - u2) * h * SHRINK_M[i + 1];
      }
      return SHRINK[SHRINK.length - 1][1];
    };

    function fieldAt(t) {
      tiles.forEach((p) => {
        // ---- the wall: tiles rise from below; far ones big, pale, soft and slow
        if (t >= PUSH + GATHER || !(p.ghost || p.sharp)) { p.el.style.opacity = 0; return; }
        if (t >= PUSH) {
          // ---- the gather: each photo flies towards the ball's middle, shrinking to a card's size,
          // and fades only as it arrives, as if it took its place in the ball; outer ones leave later
          const from = wallAt(p, PUSH), d = Math.hypot(from.x, from.y);
          p.img.style.opacity = p.ghost ? 0 : clamp01((540 + p.h / 2 - from.y - p.dev) / 220); // as developed at PUSH, whatever frame came before
          const q = easeIO((t - PUSH - 0.1 * clamp01(d / 1100)) / (GATHER - 0.12));
          const f = Math.min(1, 380 / Math.max(d, 1)) * 0.75;
          const qs = Math.sqrt(q), w = lerp(p.w, 30, qs), h = lerp(p.h, 21, qs);
          const alpha = (p.ghost ? p.pale * (1 - q) ** 4 : 1 - clamp01((q - 0.25) / 0.4)) * (Math.abs(from.y) < 540 + p.h ? 1 : 0);
          draw(p, lerp(from.x, from.x * f, q), lerp(from.y, from.y * f, q), 0, w, h, alpha, p.ghost ? `blur(${p.blur}px)` : "none", p.ghost ? 1 : p.near ? 3 : 2);
          return;
        }
        const { x, y } = wallAt(p, t);
        // the photo develops once the pane has risen a little way into the frame
        p.img.style.opacity = p.ghost ? 0 : clamp01((540 + p.h / 2 - y - p.dev) / 220);
        const h = p.h;
        const on = y < 540 + h && y > -540 - h;
        const alpha = on ? p.pale * clamp01((t - 0.15) / 0.3) : 0;
        draw(p, x, y, 0, p.w, h, alpha, p.ghost ? `blur(${p.blur}px)` : "none", p.ghost ? 1 : p.near ? 3 : 2);
      });
    }

    // ---------------------------------------------------------------- the photo ball (WebGL)
    // Small photo cards drawn in one instanced pass from a 4 × 4 atlas, filling the ball evenly (points
    // spread by best-candidate sampling, as in the studio's photo-sphere study). Cards face the camera; the
    // ball turns about a slightly tilted vertical axis and fades from colour to pale grey as it shrinks.
    const GL_N = 3000, LAB_DEPTH_VAR = 0.25; // dense, as on the reference: the ball reads as a solid of small photos
    const ballPts = (() => {
      let s2 = 4022;
      const r2 = () => ((s2 = (s2 * 16807) % 2147483647) - 1) / 2147483646;
      const pts = [];
      for (let i = 0; i < GL_N; i++) {
        let best = null, score = -1;
        for (let k = 0; k < 8; k++) {
          const z = r2() * 2 - 1, a = r2() * Math.PI * 2, r = 1 - LAB_DEPTH_VAR * Math.pow(r2(), 1.6), q = Math.sqrt(1 - z * z) * r; // mostly near the surface, some deeper: the fold reads because the far wall shows through, and the ball is never a tidy shell
          const c = [q * Math.cos(a), z * r, q * Math.sin(a)];
          let near = Infinity;
          for (let j = 0; j < pts.length && near > score; j++) { const d = pts[j]; near = Math.min(near, (d[0] - c[0]) ** 2 + (d[1] - c[1]) ** 2 + (d[2] - c[2]) ** 2); }
          if (near > score) { score = near; best = c; }
        }
        pts.push(best);
      }
      // each photo also gets its own size, tilt, drift direction and timing, so the ball never moves as
      // one tidy body
      return pts.map((c, i) => {
        const ja = r2() * Math.PI * 2, jz = r2() * 2 - 1, jq = Math.sqrt(1 - jz * jz);
        return { c, cell: i % 16, aspect: 0.66 + r2() * 0.08, k: r2(), sz: 0.55 + r2() * 0.9, rl: r2() * 2 - 1, j: [jq * Math.cos(ja), jz, jq * Math.sin(ja)], jm: Math.pow(r2(), 0.7), tj: r2() * 2 - 1, dr: r2() };
      });
    })();
    const glCanvas = document.getElementById("o-gl"), atlasImg = document.getElementById("o-atlas");
    const gl = glCanvas.getContext("webgl2", { premultipliedAlpha: true, preserveDrawingBuffer: true, antialias: true });
    const glProgram = (() => {
      const vs = `#version 300 es
        layout(location=0) in vec2 corner; layout(location=1) in vec4 c01; layout(location=2) in vec4 c23; layout(location=3) in vec3 cellAlpha;
        out vec2 uv; out vec2 local; out float alpha; out float defocus;
        void main() {
          vec2 px = gl_VertexID == 0 ? c01.xy : gl_VertexID == 1 ? c01.zw : gl_VertexID == 2 ? c23.xy : c23.zw;

      [x, z] = [x * Math.cos(f.a) + z * Math.sin(f.a), -x * Math.sin(f.a) + z * Math.cos(f.a)];
      [x, y] = [x * Math.cos(f.roll) - y * Math.sin(f.roll), x * Math.sin(f.roll) + y * Math.cos(f.roll)];
      const s = RING_CAM / (RING_CAM - z);

      // and fade as they get small
      const close = easeIO((t - DOT + 0.15) / 0.5), R = radiusAt(t) * (1 - close);
      const ringScale = 1 - close;

          const pt = `${x.toFixed(1)} ${y.toFixed(1)}`;
          if (z >= 0) { front += (pf ? " L" : " M") + pt; pf = true; pb = false; }
          else { back += (pb ? " L" : " M") + pt; pb = true; pf = false; }
        }
        ringBack[j].setAttribute("d", back); ringFront[j].setAttribute("d", front);
      });

        const [x, y, z, sc] = ringPoint(o, f, rho, o.phase + b.off + t * o.speed);
        const on = z >= 0 ? b.front : b.back, off = z >= 0 ? b.back : b.front;
        on.setAttribute("cx", x); on.setAttribute("cy", y); on.setAttribute("r", 10 * sc * (0.4 + 0.6 * ringScale)); on.style.opacity = 1;

      });
    }

    tl.to(["#o-orbits", "#o-orbits-front"], { opacity: 0, duration: 0.35, ease: "power1.in" }, DOT + 0.05);

    // ---------------------------------------------------------------- the point, the word, the mark
    // the point lands big (about 230 px, as on the reference) and settles to 120 px
    tl.fromTo("#o-dot", { scale: 0, x: 0 }, { scale: 1.95, duration: 0.2, ease: "power2.out" }, DOT + 0.12);
    tl.to("#o-dot", { scale: 1, duration: 0.35, ease: "power2.inOut" }, DOT + 0.35);
    const LOCK = { dot: 1250, shift: -194.5 }; // the point's resting centre, and the lockup's slide to centre
    tl.to("#o-dot", { scale: 104 / 120, x: LOCK.dot - 960, duration: 0.62, ease: "power1.out" }, 12.75);
    const intro = spans(document.getElementById("o-intro"), true);
    intro.forEach((c, i) => tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.05, immediateRender: false }, 12.76 + i * 0.055));
    tl.set("#o-dot", { opacity: 0 }, 13.62);
    tl.fromTo("#o-mark", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 13.62);

    tl.fromTo("#o-wave", { x: -40, scale: 0.55, transformOrigin: "50% 50%" }, { x: 0, scale: 1, duration: 0.42, ease: "power2.inOut" }, 13.62);

      onUpdate: () => { const t = clock.t; pushAt(t); headline.style.transform = `translateY(${-Math.max(0, S(t) - S(HOLD[1]))}px)`; fieldAt(t); ballAt(t); heroesAt(t); sidesAt(t); orbitsAt(t); },

  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const split = (el, byChar) => {
      const parts = byChar ? [...el.dataset.text] : el.dataset.text.split(/(\s+)/);
      el.textContent = "";
      return parts.map((p) => { const s = document.createElement("span"); s.textContent = p; el.append(s); return s; });
    };

    // ---- positioning: the headline types on under the mark; industry photos slide past below
    const head = document.getElementById("g-head");
    head.dataset.text = "Asia-Pacific Company Signals\nbuilt to give you the advantage.";
    const hw = split(head);
    // the shot rises in under the previous one's mark and pushes it up to the top: for the first
    // 0.45 s the background is clear and that mark stays on top; this shot's own mark takes over in
    // the same place once it has arrived
    tl.set("#root", { backgroundColor: "rgba(255,255,255,0)" }, 0);
    tl.set("#root", { backgroundColor: "#ffffff" }, 0.45);
    tl.fromTo("#g-mark", { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: true }, 0.44);
    hw.forEach((w, i) => tl.fromTo(w, { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: i === 0 }, 0.4 + i * 0.12));
    tl.fromTo("#g-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.35);

    // ---- the carousel: cards run right to left at a steady 833 px/s, 600 px apart, then ease to a stop
    // with the eighth card (the aerial) in the middle; the camera then pushes into it.
    const CATS = [["SaaS", 1], ["Fintech", 8], ["Real Estate", 4], ["Logistics", 7], ["Healthcare", 11], ["Energy", 10], ["Retail", 15], ["Smart Cities", 16], ["Warehousing", 12], ["Travel", 13]];
    const PITCH = 600, SPEED = 833, STOP = 3.55, DEC = 0.7, PUSH = 0.6;
    // distance run by time t: steady, then a smooth stop over DEC seconds ending at STOP
    const runAt = (t) => { const t0 = STOP - DEC, u = Math.min(1, Math.max(0, (t - t0) / DEC)); return t < t0 ? SPEED * t : SPEED * (t0 + (DEC / 2) * (1 - (1 - u) * (1 - u))); };
    const START = 960 + runAt(STOP) - 7 * PITCH; // the eighth card stops in the middle
    const strip = document.getElementById("g-strip");
    const cards = CATS.map(([name, n], i) => {
      const c = document.createElement("div");
      c.className = "g-card";
      const url = typeof n === "string" ? `url(assets/photos/${n}.jpg)` : `url(assets/photos/city-${String(n).padStart(2, "0")}.jpg)`;
      c.innerHTML = `<i style="background-image:${url}"></i><u style="background-image:${url}"></u><s></s><b>${name}</b>`;
      strip.append(c);
      return c;
    });
    // the row rises from below as the shot opens, pushing the previous shot's mark up
    tl.fromTo(strip, { y: 640 }, { y: 0, duration: 0.55, ease: "power3.out", immediateRender: true }, 0);
    // the cards ride round the outside of a wide drum facing the camera: the one in the middle is
    // nearest and largest, and each one shrinks and sinks a little as it moves off to the side, all
    // from perspective alone (drum radius ARC, camera EYE away, vanishing point at y VP)
    const ARC = 1800, EYE = 1500, VP = 1150, NEAR = 1.08; // side cards about 94% of the middle one, as on the reference
    function carouselAt(t) {
      cards.forEach((c, i) => {
        const dx = START + i * PITCH - runAt(t) - 960, a = dx / ARC;   // the card's angle round the drum
        const z = -ARC * (1 - Math.cos(a)), sc = NEAR * EYE / (EYE - z);
        // the depth sets size and height; across the frame the cards keep an even spacing, as on the reference
        c.style.transform = `translate(${960 + dx}px, ${(VP - 520) * (1 - sc)}px) scale(${sc})`;
        c.style.zIndex = Math.round(1000 + z);
      });
    }
    const clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, { t: 4.5, duration: 4.5, ease: "none", onUpdate: () => carouselAt(clock.t) }, 0);
    carouselAt(0);

    // ---- once the row has stopped (the cards stay where they are), the next shot opens out of the middle
    // card as a rounded window in front of the row (a different photo, the aerial) while the headline
    // grows away over the top
    const SG = 3.6, OX = 960, OY = 800, TY = 520 + (VP - 520) * (1 - NEAR);
    [["#g-mark", 932, 132], ["#g-rule", 750, 214], ["#g-head", 0, 236]].forEach(([el, l, tp]) =>
      tl.to(el, { scale: SG, transformOrigin: `${OX - l}px ${OY - tp}px`, duration: 0.3, ease: "power2.in" }, STOP)); // off the top in step with the window opening
    const W0 = { l: 960 - 260 * NEAR, t: TY, r: 960 + 260 * NEAR, b: Math.min(1080, TY + 700 * NEAR) };
    // the window is upright like the card (520 × 700): it first grows, centred in the frame, to a full
    // height upright panel, then opens evenly to both sides to fill the width
    const W1 = (1080 * 520) / 700, SIDE = (1920 - W1) / 2;
    tl.fromTo("#g-full", { clipPath: `inset(${W0.t}px ${1920 - W0.r}px ${1080 - W0.b}px ${W0.l}px round 18px)` },
      { clipPath: `inset(0px ${SIDE}px 0px ${SIDE}px round 18px)`, duration: 0.3, ease: "power2.in", immediateRender: false }, STOP);
    // (explicit from-values: the browser would report the panel's inset in shortened form, which GSAP
    // would pair up with the wrong sides)
    tl.fromTo("#g-full", { clipPath: `inset(0px ${SIDE}px 0px ${SIDE}px round 18px)` }, { clipPath: "inset(0px 0px 0px 0px round 0px)", duration: 0.32, ease: "power2.out", immediateRender: false }, STOP + 0.3);
    tl.fromTo("#g-full", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out", immediateRender: false }, STOP); // the window fades up as it opens
    tl.set(["#g-strip", "#g-head", "#g-mark", "#g-rule"], { opacity: 0 }, STOP + PUSH);
    tl.fromTo("#g-full-img", { scale: 1.25 }, { scale: 1, duration: 1.8, ease: "power2.out", immediateRender: false }, STOP); // the move carries on, slowing

    // ---- the app icon, then it stretches into a frosted search bar and the query types
    // the icon: a 120 px rounded window of the bar, which then opens to the full bar
    tl.fromTo("#g-tile", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, STOP + 0.05); // the app tile comes as the window starts to grow
    // the tile stretches out to the right and fades; the search bar then grows from the middle out to
    // both sides, picking the movement up
    // one shape all the way, as on the reference: at 4.4 the bar's own outline takes the tile's exact
    // place (same size and white face), so nothing changes hands visibly. It stretches out to the right
    // while the mark fades and the face turns from white to frosted glass, the magnifier and the first
    // letters coming in where the mark was; then it keeps opening, now to both sides, and settles.
    const T0 = 4.4, T1 = 4.72, T2 = 5.3, L0 = 680;
    const SHAPE0 = `inset(0px ${1620 - L0 - 260}px 0px ${L0}px round 66px)`, SHAPE1 = `inset(0px ${1620 - L0 - 700}px 0px ${L0}px round 62px)`;
    tl.set("#g-tile", { background: "rgba(255,255,255,0)", boxShadow: "0 0 0 rgba(0,0,0,0)" }, T0); // its mark stays a moment
    tl.set(["#g-bg", "#g-bg-white", "#g-bg-sh"], { opacity: 1 }, T0);
    tl.fromTo(["#g-bg", "#g-bg-white"], { clipPath: SHAPE0 }, { clipPath: SHAPE1, duration: T1 - T0, ease: "power1.in", immediateRender: false }, T0);
    tl.fromTo(["#g-bg", "#g-bg-white"], { clipPath: SHAPE1 }, { clipPath: "inset(0px 0px 0px 0px round 56px)", duration: T2 - T1, ease: "power2.out", immediateRender: false }, T1);
    tl.fromTo("#g-bg-sh", { x: L0, scaleX: 260 / 1620 }, { x: L0, scaleX: 700 / 1620, duration: T1 - T0, ease: "power1.in", immediateRender: false }, T0);
    tl.fromTo("#g-bg-sh", { x: L0, scaleX: 700 / 1620 }, { x: 0, scaleX: 1, duration: T2 - T1, ease: "power2.out", immediateRender: false }, T1);
    tl.to("#g-bg-white", { opacity: 0, duration: 0.3, ease: "sine.inOut" }, T0 + 0.18);
    tl.to("#g-icon", { opacity: 0, scale: 0.85, duration: 0.25, ease: "power1.in" }, T0 + 0.1);
    tl.set("#g-tile", { opacity: 0 }, T0 + 0.36);
    // the magnifier and the text sit at the bar's left edge and travel with it as it opens
    tl.fromTo(["#g-glass", "#g-query"], { x: L0 }, { x: 0, duration: T2 - T1, ease: "power2.out", immediateRender: false }, T1);
    tl.fromTo("#g-glass", { opacity: 0 }, { opacity: 1, duration: 0.2 }, T0 + 0.24);
    tl.fromTo("#g-query", { opacity: 0 }, { opacity: 1, duration: 0.01 }, T1 - 0.05);
    const q = split(document.getElementById("g-query"), true);
    q.forEach((c, i) => tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.03, immediateRender: false }, T1 - 0.02 + (i * 1.25) / q.length));

    // ---- results pop in under the bar as it rises
    tl.to("#g-search", { y: -232, duration: 0.5, ease: "power2.inOut" }, 6.05);
    [0, 1, 2].forEach((i) => tl.fromTo(`#g-res${i}`, { opacity: 0, y: 40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 6.3 + i * 0.28));

    // ---- to white: the results line up on the left and lines run from them into three apps
    // everything moves off to the left together: the aerial and the search bar slide out and clear to
    // white, the results glide over to the left edge, and the lines then run on from them left to right
    tl.to("#g-full", { x: -280, opacity: 0, duration: 0.4, ease: "power2.in" }, 8.05);
    tl.to("#g-search", { x: -700, opacity: 0, duration: 0.45, ease: "power2.in" }, 8.05);
    // (and grow by a fifth, spread to rows at y 330, 545, 760 with their left edges at x 90)
    [0, 1, 2].forEach((i) => tl.to(`#g-res${i}`, { x: -440, y: [-215, -170, -125][i], scale: 1.2, transformOrigin: "0% 50%", duration: 0.6, ease: "power3.inOut" }, 8.05 + i * 0.03));
    const lines = document.getElementById("g-lines");
    const NS = "http://www.w3.org/2000/svg";
    const curve = (d, w) => { const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); p.setAttribute("fill", "none"); p.setAttribute("stroke", "#2a2c30"); p.setAttribute("stroke-width", w); p.setAttribute("pathLength", "1"); p.setAttribute("stroke-dasharray", "1"); p.setAttribute("stroke-dashoffset", "1"); lines.append(p); return p; };
    // three lines run from the results' right edges (x 950; rows at y 375, 545, 715) and merge at J into
    // one line that carries on to the right. An app chip rides each line in turn, top first, joins the
    // merged line: the lines draw first; then the chips set off from the results one after another,
    // reach the junction in turn and run on along the merged line out of the frame; then the table.
    const J = [1500, 545], ROWY = [330, 545, 760], X0 = 90 + 860 * 1.2;
    // the three sweep in and meet the merged line along its own direction, so they join into it cleanly
    const seg = (i) => [[X0, ROWY[i]], [X0 + 230, ROWY[i]], [J[0] - 200, J[1]], J];
    const bez = (b, t) => [0, 1].map((k) => (1 - t) ** 3 * b[0][k] + 3 * (1 - t) ** 2 * t * b[1][k] + 3 * (1 - t) * t * t * b[2][k] + t ** 3 * b[3][k]);
    const fromRes = [0, 1, 2].map((i) => { const b = seg(i); return curve(`M${b[0]} C ${b[1]}, ${b[2]}, ${b[3]}`, 3); });
    const main = curve(`M${J} L 1920 ${J[1]}`, 3);
    // the three draw together at an even pace and the merged line carries straight on from the junction
    tl.fromTo("#g-lines", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 8.2);
    fromRes.forEach((p) => tl.to(p, { attr: { "stroke-dashoffset": 0 }, duration: 0.36, ease: "power1.in" }, 8.2));
    tl.to(main, { attr: { "stroke-dashoffset": 0 }, duration: 0.42, ease: "power2.out" }, 8.56);
    // each chip: s runs 0 → 1 along its curve, then on along the merged line by its place in the row
    // ---- the cut (as on the reference, frame by frame): while the chips run along the merged line the
    // picture cuts to a closer view further on. There the chips are back on three lines that come in
    // from the left edge and merge at J2 into one that meets the table's left side; the camera drifts
    // slowly right, and the chips run in one after another, spaced apart, through the junction into
    // the table, where each one adds a row. The middle chip, last, waits at the junction.
    const CUT = 9.23, J2 = [480, 545], TX = 960, ROW2 = [318, 545, 772], DRIFT = 260; // measured on the reference
    const driftAt = (t) => DRIFT * (1 - Math.pow(1 - Math.max(0, Math.min(1, (t - CUT) / 1.4)), 2));
    const segB = (i) => [[-60, ROW2[i]], [200, ROW2[i]], [J2[0] - 170, J2[1]], J2];
    const lines2 = document.getElementById("g-lines2");
    [0, 1, 2].forEach((i) => { const b = segB(i), p = curve(`M${b[0]} C ${b[1]}, ${b[2]}, ${b[3]}`, 4.5); p.setAttribute("stroke-dashoffset", "0"); lines2.append(p); });
    { const p = curve(`M${J2} L ${TX} ${J2[1]}`, 4.5); p.setAttribute("stroke-dashoffset", "0"); lines2.append(p); }
    const route = (pts) => { const len = [0]; for (let k = 1; k < pts.length; k++) len.push(len[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1])); return { pts, len }; };
    const along = (r, d) => {
      const { pts, len } = r;
      if (d <= 0) return pts[0];
      if (d >= len[len.length - 1]) return pts[pts.length - 1];
      let k = 1; while (len[k] < d) k++;
      const f = (d - len[k - 1]) / (len[k] - len[k - 1]);
      return [pts[k - 1][0] + (pts[k][0] - pts[k - 1][0]) * f, pts[k - 1][1] + (pts[k][1] - pts[k - 1][1]) * f];
    };
    // before the cut: from the result into the merged line and on to the right
    const ROUTE_A = [0, 1, 2].map((i) => { const pts = []; for (let k = 0; k <= 60; k++) pts.push(bez(seg(i), k / 60)); pts.push([1960, J[1]]); return route(pts); });
    // after it: along its own line from the left edge, through J2, to the table
    const ROUTE_B = [0, 1, 2].map((i) => { const pts = []; for (let k = 0; k <= 60; k++) pts.push(bez(segB(i), k / 60)); pts.push([TX, J2[1]]); return route(pts); });
    const CHIP_T0 = [8.72, 8.75, 8.78], SPEED_C = 1800, ACC = 0.2; // all set off together, a touch apart
    const distA = (d) => (d <= 0 ? 0 : d < ACC ? (SPEED_C * d * d) / (2 * ACC) : SPEED_C * (ACC / 2 + d - ACC));
    // after the cut each chip starts a set way along its line and moves on at 1300 px/s: top first, then
    // the bottom one, the middle one last, far enough apart never to touch
    const B = [{ d0: 330, t0: CUT, stop: Infinity }, { d0: 230, t0: CUT, stop: null }, { d0: 260, t0: CUT, stop: Infinity }], SPEED_B = 1300; // all move at once; the queue sets the order
    B[1].stop = Infinity; // the middle one follows the others into the table
    const distB = (i, t) => Math.min(B[i].stop, B[i].d0 + SPEED_B * Math.max(0, t - B[i].t0));
    const arriveB = (i) => { for (let t = CUT; t < CUT + 3; t += 1 / 120) if (placeB(t)[i] >= ROUTE_B[i].len[ROUTE_B[i].len.length - 1] - 70) return t; return CUT + 3; };
    const chips = [0, 1, 2].map((i) => document.getElementById(`g-app${i}`));
    // The chips run together on their own lines, but as they near the junction they fall into line in
    // a set order, never closer than GAP along the merged line: each one's distance past its junction
    // is held at least GAP behind the one ahead.
    const GAP = 140, junc = (r) => r.len[60];
    const queue = (order, want) => { const m = want.slice(); order.forEach((i, k) => { if (k) m[i] = Math.min(m[i], m[order[k - 1]] - GAP); }); return m; };
    const placeA = (t) => queue([0, 1, 2], [0, 1, 2].map((i) => distA(t - CHIP_T0[i]) - junc(ROUTE_A[i]))).map((m, i) => m + junc(ROUTE_A[i]));
    const placeB = (t) => queue([0, 2, 1], [0, 1, 2].map((i) => distB(i, t) - junc(ROUTE_B[i]))).map((m, i) => m + junc(ROUTE_B[i]));
    const chipAt = (t) => { const dA = t < CUT ? placeA(t) : null, dB = t < CUT ? null : placeB(t); chips.forEach((el, i) => {
      if (t < CUT) {
        const [x, y] = along(ROUTE_A[i], dA[i]);
        el.style.transform = `translate(${x}px, ${y}px)`;
        el.style.opacity = Math.min(1, Math.max(0, (t - CHIP_T0[i] + 0.12) / 0.12));
        return;
      }
      const r = ROUTE_B[i], end = r.len[r.len.length - 1], d = dB[i];
      const [x, y] = along(r, d), into = Math.max(0, Math.min(1, (d - (end - 70)) / 70)); // taken in by the table
      el.style.transform = `translate(${x - driftAt(t)}px, ${y}px) scale(${1 - 0.5 * into})`;
      el.style.opacity = 1 - into;
    }); };
    const chipClock = { t: 8.2 };
    tl.fromTo(chipClock, { t: 8.2 }, { t: 10.6, duration: 2.4, ease: "none", onUpdate: () => chipAt(chipClock.t) }, 8.2);
    chipAt(8.2);

    // ---- the table slides in and fills row by row
    const table = document.getElementById("g-table");
    const ROWS = [
      ["Harborline Pay", "Fintech", "Singapore", "320", "<em>●</em> Raised Series B"],
      ["Lumora Ledger", "Payments", "Jakarta", "140", "<em>●</em> Hiring 6 in sales"],
      ["Kitewire Remit", "Cross-border", "Singapore", "85", "<em>●</em> New CFO"],
      ["Tessel Freight", "Logistics", "Sydney", "610", "Opened Perth hub"],
      ["Oriel Health", "Healthcare", "Seoul", "230", "New software budget"],
      ["Brightmoor Grid", "Energy", "Tokyo", "1,200", "Expanding to Osaka"],
      ["Canopy Retail", "Retail", "Hong Kong", "480", "Hiring 12 engineers"],
      ["Lattice Works", "SaaS", "Shanghai", "95", "Raised seed round"],
    ];
    ROWS.forEach((r, i) => {
      const row = document.createElement("div");
      row.className = "g-tr";
      row.style.top = `${174 + i * 54}px`;
      row.innerHTML = r.map((c) => `<span>${c}</span>`).join("");
      table.append(row);
      // as in the contact table: each row is a slip of card that arrives tipped and lifted, in turn, and
      // lays down into the table
      const at = 10.68 + i * 0.08;
      tl.fromTo(row, { opacity: 0, x: 0, y: -16, z: 60, scale: 0.97, rotationX: -55, transformPerspective: 900, transformOrigin: "50% 100%" },
        { opacity: 1, x: 0, y: 0, z: 0, scale: 1, rotationX: 0, duration: 0.45, ease: "power3.out" }, at);
      tl.fromTo(row, { backgroundColor: "rgba(255,255,255,1)", boxShadow: "0 16px 30px rgba(30,30,40,0.15), 0 0 0 1px rgba(30,30,40,0.05)" },
        { backgroundColor: "rgba(255,255,255,0)", boxShadow: "0 0px 0px rgba(30,30,40,0), 0 0 0 1px rgba(30,30,40,0)", duration: 0.5, ease: "power1.inOut" }, at + 0.3);
    });
    // the pan: what was on screen slides off to the left as the next stretch slides in from the right
    tl.set(["#g-lines", ".g-res"], { opacity: 0 }, CUT);
    tl.set(["#g-lines2", "#g-ctable"], { opacity: 1 }, CUT);
    tl.fromTo(["#g-lines2", "#g-ctable"], { x: 0 }, { x: -DRIFT, duration: 1.4, ease: "power1.out", immediateRender: false }, CUT); // the slow drift (as driftAt)
    // a contact row arrives with each chip: it comes in green and settles to the table's own colours
    const CONTACTS = [["Mei Tanaka", "Head of Operations", "Harborline Pay", "+65 6123 4401"], ["Arjun Rao", "CFO", "Lumora Ledger", "+62 21 555 0192"], ["Lin Wei", "Purchasing Lead", "Kitewire Remit", "+65 6789 2210"], ["Sora Park", "Head of Sales", "Oriel Health", "+82 2 555 0147"], ["Daniel Ho", "Finance Director", "Tessel Freight", "+61 2 5550 0193"], ["Hana Ito", "Operations Lead", "Lattice Works", "+81 3 5550 0148"]];
    const ctable = document.getElementById("g-ctable");
    CONTACTS.forEach((c, i) => {
      const r = document.createElement("div");
      r.className = "g-cr";
      r.style.top = `${150 + i * 84}px`;
      r.innerHTML = `<i></i><b>${c[0]}</b><small>${c[1]}</small><b>${c[2]}</b><small>${c[3]}</small>`;
      ctable.append(r);
      // the first three are already coming in at the cut; the rest arrive with the chips
      const at = i < 3 ? CUT + 0.03 + i * 0.07 : arriveB([0, 2, 1][i - 3]);
      // each row is its own slip of card: it arrives tipped towards us and lifted, with a shadow under
      // it, then lays down flat into the table and the card fades into the page
      tl.fromTo(r, { opacity: 0, x: 0, y: -18, z: 60, scale: 0.97, rotationX: -55, transformPerspective: 900, transformOrigin: "50% 100%" },
        { opacity: 1, x: 0, y: 0, z: 0, scale: 1, rotationX: 0, duration: 0.45, ease: "power3.out" }, at);
      tl.fromTo(r, { backgroundColor: "rgba(255,255,255,1)", boxShadow: "0 18px 34px rgba(30,30,40,0.16), 0 0 0 1px rgba(30,30,40,0.05)" },
